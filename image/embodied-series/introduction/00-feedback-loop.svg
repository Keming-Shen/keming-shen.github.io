<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">机器人如何通过感知、规划与控制形成反馈闭环</title>
  <desc id="desc">任务目标传给规划，规划生成运动参考，控制输出驱动指令，机器人在环境中执行。内部与外部传感器获得测量，状态估计融合这些测量，估计状态反馈给规划和控制。图中不规定各模块的更新频率。</desc>
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#51647d"/></marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0f766e"/></marker>
  </defs>
  <style>
    text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243954}
    .heading{font-size:28px;font-weight:600}
    .label{font-size:26px;font-weight:600}
    .detail{font-size:20px;fill:#51647d}
    .feedback-label{font-size:20px;fill:#0f766e}
    .forward{fill:none;stroke:#51647d;stroke-width:3;marker-end:url(#forward)}
    .feedback{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#feedback)}
  </style>
  <rect width="960" height="640" rx="20" fill="#f1f6fc"/>
  <text x="40" y="55" class="heading" font-size="28" font-weight="600">从任务目标到物理动作：机器人反馈闭环</text>
  <text x="40" y="91" class="detail" font-size="20" font-weight="400">感知持续提供测量，估计状态用于修正计划与驱动指令。</text>

  <g>
    <rect x="40" y="168" width="145" height="100" rx="12" fill="white" stroke="#386db6" stroke-width="2"/>
    <text x="112.5" y="207" text-anchor="middle" class="label" font-size="26" font-weight="600">任务目标</text>
    <text x="112.5" y="240" text-anchor="middle" class="detail" font-size="20" font-weight="400">要完成什么</text>
    <rect x="235" y="168" width="160" height="100" rx="12" fill="white" stroke="#386db6" stroke-width="2"/>
    <text x="315" y="207" text-anchor="middle" class="label" font-size="26" font-weight="600">规划</text>
    <text x="315" y="240" text-anchor="middle" class="detail" font-size="20" font-weight="400">路径与轨迹</text>
    <rect x="455" y="168" width="160" height="100" rx="12" fill="white" stroke="#386db6" stroke-width="2"/>
    <text x="535" y="207" text-anchor="middle" class="label" font-size="26" font-weight="600">控制</text>
    <text x="535" y="240" text-anchor="middle" class="detail" font-size="20" font-weight="400">计算驱动指令</text>
    <rect x="675" y="168" width="245" height="100" rx="12" fill="white" stroke="#386db6" stroke-width="2"/>
    <text x="797.5" y="207" text-anchor="middle" class="label" font-size="26" font-weight="600">机器人 / 环境</text>
    <text x="797.5" y="240" text-anchor="middle" class="detail" font-size="20" font-weight="400">运动、接触与交互</text>
  </g>
  <path class="forward" d="M185 218H235"/>
  <path class="forward" d="M395 218H455"/>
  <path class="forward" d="M615 218H675"/>
  <text x="425" y="150" text-anchor="middle" class="detail" font-size="20" font-weight="400">运动参考</text>
  <text x="645" y="150" text-anchor="middle" class="detail" font-size="20" font-weight="400">驱动指令</text>

  <path d="M797.5 268V320H620" fill="none" stroke="#0f766e" stroke-width="3"/>
  <path class="feedback" d="M620 320V365"/>
  <path class="feedback" d="M797.5 320H827.5V365"/>
  <text x="812" y="305" class="feedback-label" font-size="20" font-weight="400">获取测量</text>
  <g>
    <rect x="535" y="365" width="170" height="100" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/>
    <text x="620" y="404" text-anchor="middle" class="label" font-size="26" font-weight="600">内部传感</text>
    <text x="620" y="437" text-anchor="middle" class="detail" font-size="20" font-weight="400">编码器、IMU 等</text>
    <rect x="735" y="365" width="185" height="100" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/>
    <text x="827.5" y="404" text-anchor="middle" class="label" font-size="26" font-weight="600">外部传感</text>
    <text x="827.5" y="437" text-anchor="middle" class="detail" font-size="20" font-weight="400">相机、雷达等</text>
    <rect x="235" y="470" width="220" height="100" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/>
    <text x="345" y="509" text-anchor="middle" class="label" font-size="26" font-weight="600">状态估计</text>
    <text x="345" y="542" text-anchor="middle" class="detail" font-size="20" font-weight="400">自身状态与环境信息</text>
  </g>
  <path class="feedback" d="M620 465V505H455"/>
  <path class="feedback" d="M827.5 465V550H455"/>
  <text x="627" y="588" text-anchor="middle" class="feedback-label" font-size="20" font-weight="400">融合测量，更新估计</text>
  <path class="feedback" d="M300 470V268"/>
  <text x="315" y="379" class="feedback-label" font-size="20" font-weight="400">修正规划</text>
  <path class="feedback" d="M430 470V305H535V268"/>
  <text x="432" y="333" class="feedback-label" font-size="20" font-weight="400">用于反馈控制</text>
  <text x="40" y="614" class="detail" font-size="20" font-weight="400">闭环的关键：根据实际状态调整动作，而不是只发送一次指令。</text>
</svg>
