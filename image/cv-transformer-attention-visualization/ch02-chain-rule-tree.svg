<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="title desc"><title id="title">链式法则的概率树</title><desc id="desc">从开始标记出发，第一步选“猫”的概率为 0.4，在前缀“猫”之后选“在”的概率为 0.7，在前缀“猫在”之后选“睡觉”的概率为 0.5，整条路径的概率为 0.14。每层还列出其他候选。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="452" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">链式法则：逐步分解序列概率</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">每一步都在前缀确定之后，给出下一个 token 的完整分布</text><rect x="50.5" y="231" width="79.1" height="38" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="90" y="256.6" font-size="19" fill="#8a979d" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><path d="M128 250L238 160" fill="none" stroke="#6d9580" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><text x="180" y="202.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">0.40</text><rect x="248.5" y="141" width="43" height="38" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="270" y="166.7" font-size="19" fill="#3d7058" text-anchor="middle" font-weight="500">猫</text><path d="M128 250L238 250" fill="none" stroke="#c9d0d3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="247.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.35</text><rect x="248.5" y="231" width="43" height="38" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="270" y="256.6" font-size="19" fill="#8a979d" text-anchor="middle" font-weight="500">狗</text><path d="M128 250L238 340" fill="none" stroke="#c9d0d3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="292.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.25</text><rect x="252.5" y="321" width="35" height="38" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="270" y="346.6" font-size="19" fill="#8a979d" text-anchor="middle" font-weight="500">…</text><path d="M300 160L430 120" fill="none" stroke="#6d9580" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><text x="365" y="137.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">0.70</text><rect x="440.5" y="101" width="43" height="38" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="462" y="126.7" font-size="19" fill="#3d7058" text-anchor="middle" font-weight="500">在</text><path d="M300 160L430 200" fill="none" stroke="#c9d0d3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="365" y="177.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.20</text><rect x="440.5" y="181" width="43" height="38" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="462" y="206.7" font-size="19" fill="#8a979d" text-anchor="middle" font-weight="500">跑</text><path d="M300 160L430 262" fill="none" stroke="#c9d0d3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="365" y="208.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.10</text><rect x="444.5" y="243" width="35" height="38" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="462" y="268.6" font-size="19" fill="#8a979d" text-anchor="middle" font-weight="500">…</text><path d="M494 120L630 90" fill="none" stroke="#6d9580" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><text x="565" y="102.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">0.50</text><rect x="641" y="71" width="62" height="38" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="672" y="96.7" font-size="19" fill="#3d7058" text-anchor="middle" font-weight="500">睡觉</text><path d="M494 120L630 160" fill="none" stroke="#c9d0d3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="565" y="137.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.30</text><rect x="641" y="141" width="62" height="38" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="672" y="166.7" font-size="19" fill="#8a979d" text-anchor="middle" font-weight="500">吃饭</text><path d="M494 120L630 222" fill="none" stroke="#c9d0d3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="565" y="168.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.20</text><rect x="654.5" y="203" width="35" height="38" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="672" y="228.7" font-size="19" fill="#8a979d" text-anchor="middle" font-weight="500">…</text><text x="270" y="395.9" font-size="17" fill="#5c747d" text-anchor="middle" font-weight="500">p(y₁)</text><text x="462" y="395.9" font-size="17" fill="#5c747d" text-anchor="middle" font-weight="500">p(y₂ | y₁)</text><text x="672" y="395.9" font-size="17" fill="#5c747d" text-anchor="middle" font-weight="500">p(y₃ | y₁, y₂)</text><rect x="740" y="300" width="190" height="80" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="835" y="331.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="600">0.4 × 0.7 × 0.5</text><text x="835" y="363" font-size="20" fill="#3d7058" text-anchor="middle" font-weight="700">= 0.14</text><path d="M712 90C760 90 790 200 835 296" fill="none" stroke="#6d9580" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)" stroke-dasharray="6 6"/><text x="38" y="432" font-size="16" fill="#71838b" text-anchor="start" font-weight="400">每层的分支概率之和为 1；“…”代表词表中其余所有候选。换一个前缀，下一层的整组分布都会改变。</text></svg>