<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="title desc"><title id="title">残差块结构</title><desc id="desc">输入 x=[1,2] 分两路：一路经残差分支得到 F(x)=[0.1,−0.2]，另一路经恒等短路；两路相加得到 H(x)=[1.1,1.8]。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="464" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">残差块：H(x) = x + F(x)</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">残差分支只需学习对输入的修正量</text><rect x="50" y="232" width="120" height="36" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="110" y="255.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">x = [1, 2]</text><path d="M172 250H230" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="240" cy="250" r="6" fill="#708794" stroke="none" stroke-width="0"/><path d="M240 250V160H300" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="304" y="120" width="220" height="80" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="414" y="156.9" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="650">残差分支 F(x)</text><text x="414" y="177.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">若干层（线性 / 卷积 + 激活）</text><path d="M528 160H620V232" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="540" y="150" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">F(x) = [0.1, −0.2]</text><path d="M240 250V330H620V268" fill="none" stroke="#3d7058" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><text x="380" y="352" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">恒等短路（无参数）</text><circle cx="620" cy="250" r="18" fill="#fcfcfa" stroke="#293e4b" stroke-width="2"/><text x="620" y="257.7" font-size="22" fill="#293e4b" text-anchor="middle" font-weight="700">+</text><path d="M640 250H700" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="705" y="232" width="150" height="36" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="780" y="255.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">H(x) = [1.1, 1.8]</text><rect x="38" y="392" width="884" height="52" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="56" y="423" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">若最优映射接近恒等，只需把 F 推向 0，比用多层非线性精确拟合恒等映射容易得多；相加本身不引入参数。</text></svg>