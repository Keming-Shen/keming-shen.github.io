<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-labelledby="title desc"><title id="title">按时间展开的循环神经网络</title><desc id="desc">输入 &lt;bos&gt;、我、喜欢、你依次进入 RNN，隐藏状态 h1 到 h4 沿时间传递，每一步都输出下一个 token 的 logits。所有时间步共享 W_x、W_h、W_o。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="462" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">RNN 按时间展开</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">每一步使用同一组参数 W_x、W_h、W_o</text><circle cx="60" cy="240" r="26" fill="#f3f4f2" stroke="#c9d0d3" stroke-width="2"/><text x="60" y="245.9" font-size="17" fill="#9aa7ad" text-anchor="middle" font-weight="400">h₀</text><rect x="108" y="354" width="84" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="150" y="375.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><text x="150" y="408.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">e₁</text><path d="M150 352L150 272" fill="none" stroke="#9eb4c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><text x="172" y="322.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="600">W_x</text><circle cx="150" cy="240" r="30" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="150" y="246.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="650">h₁</text><path d="M88 240L116 240" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="104" y="226.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="600">W_h</text><path d="M150 208L150 164" fill="none" stroke="#b9a98a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="172" y="194.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">W_o</text><rect x="98" y="110" width="104" height="50" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="150" y="132.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">z₁（logits）</text><text x="150" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">→ 预测 我</text><rect x="298" y="354" width="84" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="340" y="375.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="500">我</text><text x="340" y="408.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">e₂</text><path d="M340 352L340 272" fill="none" stroke="#9eb4c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><text x="362" y="322.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="600">W_x</text><circle cx="340" cy="240" r="30" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="340" y="246.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="650">h₂</text><path d="M182 240L306 240" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="245" y="226.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="600">W_h</text><path d="M340 208L340 164" fill="none" stroke="#b9a98a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="362" y="194.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">W_o</text><rect x="288" y="110" width="104" height="50" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="340" y="132.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">z₂（logits）</text><text x="340" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">→ 预测 喜欢</text><rect x="488" y="354" width="84" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="530" y="375.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="500">喜欢</text><text x="530" y="408.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">e₃</text><path d="M530 352L530 272" fill="none" stroke="#9eb4c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><text x="552" y="322.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="600">W_x</text><circle cx="530" cy="240" r="30" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="530" y="246.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="650">h₃</text><path d="M372 240L496 240" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="435" y="226.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="600">W_h</text><path d="M530 208L530 164" fill="none" stroke="#b9a98a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="552" y="194.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">W_o</text><rect x="478" y="110" width="104" height="50" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="530" y="132.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">z₃（logits）</text><text x="530" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">→ 预测 你</text><rect x="678" y="354" width="84" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="720" y="375.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="500">你</text><text x="720" y="408.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">e₄</text><path d="M720 352L720 272" fill="none" stroke="#9eb4c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><text x="742" y="322.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="600">W_x</text><circle cx="720" cy="240" r="30" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="720" y="246.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="650">h₄</text><path d="M562 240L686 240" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="625" y="226.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="600">W_h</text><path d="M720 208L720 164" fill="none" stroke="#b9a98a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="742" y="194.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">W_o</text><rect x="668" y="110" width="104" height="50" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="720" y="132.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">z₄（logits）</text><text x="720" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">→ 预测 &lt;eos&gt;</text><rect x="780" y="190" width="160" height="100" rx="8" fill="#f6f7f4" stroke="none"/><text x="794" y="216" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">hₜ = tanh(eₜW_x</text><text x="816" y="238" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">+ hₜ₋₁W_h + b)</text><text x="794" y="266" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">zₜ = hₜW_o + b_o</text><text x="38" y="440" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">计算 hₜ 必须先得到 hₜ₋₁，因此同一层内的时间步只能依次计算；前缀的全部信息都要压缩进固定维度的 hₜ。</text></svg>