<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc"><title id="title">中文文本的词级切分</title><desc id="desc">句子切分为我、来自、深圳大学、计算机、与、软件、学院，共七个词元。</desc><defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.7"/></marker><linearGradient id="mic" x1="0" x2="1"><stop stop-color="#153b5a"/><stop offset=".5" stop-color="#438ab8"/><stop offset="1" stop-color="#153b5a"/></linearGradient><linearGradient id="soft" x2="0" y2="1"><stop stop-color="#edf7ff"/><stop offset="1" stop-color="#dceef8"/></linearGradient></defs><rect width="1000" height="280" fill="#fff"/><text x="500" y="56" text-anchor="middle" font-size="34" fill="#182e43" font-weight="500">我来自深圳大学计算机与软件学院</text><path d="M492 89V126" fill="none" stroke="#a8bccb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="536" y="114" text-anchor="start" font-size="18" fill="#587086" font-weight="400">词级切分</text><text x="202" y="183" text-anchor="middle" font-size="34" fill="#347bb8" font-weight="500">我</text><path d="M185 199V207H219V199" fill="none" stroke="#347bb8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="273" y="183" text-anchor="middle" font-size="34" fill="#3a8c75" font-weight="500">来自</text><path d="M239 199V207H307V199" fill="none" stroke="#3a8c75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="395" y="183" text-anchor="middle" font-size="34" fill="#cc654e" font-weight="500">深圳大学</text><path d="M327 199V207H463V199" fill="none" stroke="#cc654e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="534" y="183" text-anchor="middle" font-size="34" fill="#347bb8" font-weight="500">计算机</text><path d="M483 199V207H585V199" fill="none" stroke="#347bb8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="622" y="183" text-anchor="middle" font-size="34" fill="#3a8c75" font-weight="500">与</text><path d="M605 199V207H639V199" fill="none" stroke="#3a8c75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="693" y="183" text-anchor="middle" font-size="34" fill="#cc654e" font-weight="500">软件</text><path d="M659 199V207H727V199" fill="none" stroke="#cc654e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="781" y="183" text-anchor="middle" font-size="34" fill="#347bb8" font-weight="500">学院</text><path d="M747 199V207H815V199" fill="none" stroke="#347bb8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="255" text-anchor="middle" font-size="19" fill="#587086" font-weight="400">7 个词元；实际切分结果由分词器和词表决定</text></svg>