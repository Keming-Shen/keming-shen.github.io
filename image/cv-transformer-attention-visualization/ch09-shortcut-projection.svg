<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="title desc"><title id="title">残差的短路投影</title><desc id="desc">输入 [64,32,32] 经残差分支变为 [128,16,16]；短路分支经 1×1、步幅 2 的卷积投影到同样的 [128,16,16]，两者相加。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="464" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">短路投影：两条分支形状必须相同才能相加</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">通道数或空间尺寸改变时，用 1×1 卷积把短路映射到相同形状</text><rect x="78" y="172" width="90" height="90" rx="4" fill="#e8eff5" stroke="#9eb4c4"/><rect x="72" y="178" width="90" height="90" rx="4" fill="#e8eff5" stroke="#9eb4c4"/><rect x="66" y="184" width="90" height="90" rx="4" fill="#e8eff5" stroke="#9eb4c4"/><rect x="60" y="190" width="90" height="90" rx="4" fill="#e8eff5" stroke="#9eb4c4"/><text x="117" y="306.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">x：[64, 32, 32]</text><path d="M186 214C260 214 260 150 330 150" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="336" y="118" width="210" height="64" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="441" y="146.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">残差分支</text><text x="441" y="167.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">3×3 卷积 ×2，步幅 2</text><path d="M186 250C260 250 260 310 330 310" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="336" y="278" width="210" height="64" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="441" y="306.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">投影 P</text><text x="441" y="327.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">1×1 卷积，步幅 2</text><path d="M550 150C610 150 610 220 648 228" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550 310C610 310 610 250 648 244" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="560" y="132" font-size="13" fill="#8f7857" text-anchor="start" font-weight="400">[128, 16, 16]</text><text x="560" y="338" font-size="13" fill="#3d7058" text-anchor="start" font-weight="400">[128, 16, 16]</text><circle cx="666" cy="236" r="18" fill="#fcfcfa" stroke="#293e4b" stroke-width="2"/><text x="666" y="243.7" font-size="22" fill="#293e4b" text-anchor="middle" font-weight="700">+</text><path d="M686 236L720 236" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="170" width="70" height="70" rx="4" fill="#edf3ed" stroke="#6d9580"/><rect x="754" y="176" width="70" height="70" rx="4" fill="#edf3ed" stroke="#6d9580"/><rect x="748" y="182" width="70" height="70" rx="4" fill="#edf3ed" stroke="#6d9580"/><rect x="742" y="188" width="70" height="70" rx="4" fill="#edf3ed" stroke="#6d9580"/><rect x="736" y="194" width="70" height="70" rx="4" fill="#edf3ed" stroke="#6d9580"/><rect x="730" y="200" width="70" height="70" rx="4" fill="#edf3ed" stroke="#6d9580"/><text x="783" y="296.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">H(x)：[128, 16, 16]</text><rect x="38" y="392" width="884" height="52" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="56" y="423" font-size="15" fill="#4a6a80" text-anchor="start" font-weight="400">Transformer 中所有子层的输入输出都是 d_model 维，可以直接相加；多头注意力的 Wᴼ 把拼接结果映射回 d_model，正是为此。</text></svg>