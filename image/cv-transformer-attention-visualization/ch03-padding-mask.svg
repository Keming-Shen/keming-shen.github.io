<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" role="img" aria-labelledby="title desc"><title id="title">零向量不能代替掩码</title><desc id="desc">左：第二条序列的四个有效向量之和为 [1,1,1,1]，除以 4 得 0.25，除以 5 得 0.2。右：五个键的注意力权重中，不加掩码时填充位置分走一部分权重，加掩码后权重只在四个有效位置之间分配。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="446" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">零向量不能代替掩码</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">左：平均时改变分母；右：注意力中分走权重</text><rect x="38" y="92" width="420" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="248" y="126" font-size="17" fill="#293e4b" text-anchor="middle" font-weight="650">有效位置平均（第二条序列）</text><text x="60" y="160" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">四个有效向量之和</text><text x="436" y="160" font-size="16" fill="#293e4b" text-anchor="end" font-weight="600">[1, 1, 1, 1]</text><rect x="60" y="184" width="176" height="86" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="148" y="223.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">÷ 4（有效位置）</text><text x="148" y="244.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[0.25, 0.25, 0.25, 0.25]</text><rect x="260" y="184" width="176" height="86" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="348" y="223.6" font-size="16" fill="#a4604b" text-anchor="middle" font-weight="650">÷ 5（数组长度）</text><text x="348" y="244.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[0.2, 0.2, 0.2, 0.2]</text><text x="60" y="310" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">&lt;pad&gt; 的零向量没有改变分子，</text><text x="60" y="334" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">却让分母多算了一个位置。</text><rect x="478" y="92" width="444" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="700" y="126" font-size="17" fill="#293e4b" text-anchor="middle" font-weight="650">一个查询对五个键的注意力权重</text><path d="M520 320L900 320" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="532" y="215.1" width="24" height="104.9" rx="3" fill="#dfe3e4" stroke="none"/><rect x="558" y="201.7" width="24" height="118.3" rx="3" fill="#94b79a" stroke="none"/><text x="557" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">&lt;bos&gt;</text><rect x="608" y="256.4" width="24" height="63.6" rx="3" fill="#dfe3e4" stroke="none"/><rect x="634" y="248.3" width="24" height="71.7" rx="3" fill="#94b79a" stroke="none"/><text x="633" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">我</text><rect x="684" y="272.9" width="24" height="47.1" rx="3" fill="#dfe3e4" stroke="none"/><rect x="710" y="266.9" width="24" height="53.1" rx="3" fill="#94b79a" stroke="none"/><text x="709" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">喜欢</text><rect x="760" y="234.1" width="24" height="85.9" rx="3" fill="#dfe3e4" stroke="none"/><rect x="786" y="223.2" width="24" height="96.8" rx="3" fill="#94b79a" stroke="none"/><text x="785" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">&lt;eos&gt;</text><rect x="836" y="281.4" width="24" height="38.6" rx="3" fill="#d9a797" stroke="none"/><rect x="862" y="320" width="24" height="0.5" rx="3" fill="#94b79a" stroke="none"/><text x="861" y="344.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="400">&lt;pad&gt;</text><rect x="540" y="356" width="14" height="14" rx="3" fill="#dfe3e4" stroke="none"/><text x="560" y="368" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">不加掩码：&lt;pad&gt; 分走 11.3%</text><rect x="740" y="356" width="14" height="14" rx="3" fill="#94b79a" stroke="none"/><text x="760" y="368" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">加掩码：权重只在有效位置间分配</text><text x="38" y="424" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">右图分数为示意：[1.0, 0.5, 0.2, 0.8, 0.0]，第五个位置是填充。即使它的 Value 为零，也会减少有效位置获得的总权重。</text></svg>