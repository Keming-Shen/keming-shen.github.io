<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="title desc"><title id="title">两层 MLP 的一次前向计算</title><desc id="desc">输入 x=[2,−1] 经第一层得到 a=[1.5,−2.5,3]，ReLU 后 h=[1.5,0,3]，再经第二层得到 logits z=[−1.4,1.4]。第二个隐藏单元为 0，其输出连线以虚线表示。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="448" rx="14" fill="#fcfcfa" stroke="none"/><path d="M184 180L352 120" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 180L352 240" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 180L352 360" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 300L352 120" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 300L352 240" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 300L352 360" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M488 120L676 180" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M488 120L676 300" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M488 240L676 180" fill="none" stroke="#d7dde0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M488 240L676 300" fill="none" stroke="#d7dde0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M488 360L676 180" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M488 360L676 300" fill="none" stroke="#b9c6cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="62" font-size="21" fill="#71838b" text-anchor="middle" font-weight="400">输入 x</text><text x="420" y="62" font-size="21" fill="#71838b" text-anchor="middle" font-weight="400">隐藏层：a → ReLU → h</text><text x="706" y="62" font-size="21" fill="#71838b" text-anchor="middle" font-weight="400">输出 z（logits）</text><circle cx="160" cy="180" r="26" fill="#e8eff5" stroke="#9eb4c4" stroke-width="2"/><text x="160" y="188" font-size="22" fill="#4a6a80" text-anchor="middle" font-weight="600">2</text><circle cx="160" cy="300" r="26" fill="#e8eff5" stroke="#9eb4c4" stroke-width="2"/><text x="160" y="308" font-size="22" fill="#4a6a80" text-anchor="middle" font-weight="600">−1</text><rect x="352" y="96" width="136" height="48" rx="24" fill="#edf3ed" stroke="#6d9580"/><text x="384" y="127" font-size="19" fill="#5c747d" text-anchor="middle" font-weight="400">1.5</text><text x="420" y="127" font-size="18" fill="#9aa7ad" text-anchor="middle" font-weight="400">→</text><text x="452" y="127" font-size="21" fill="#3d7058" text-anchor="middle" font-weight="650">1.5</text><rect x="352" y="216" width="136" height="48" rx="24" fill="#f3f4f2" stroke="#c9d0d3" stroke-dasharray="6 6"/><text x="384" y="247" font-size="19" fill="#9aa7ad" text-anchor="middle" font-weight="400">−2.5</text><text x="420" y="247" font-size="18" fill="#9aa7ad" text-anchor="middle" font-weight="400">→</text><text x="452" y="247" font-size="21" fill="#9aa7ad" text-anchor="middle" font-weight="650">0</text><rect x="352" y="336" width="136" height="48" rx="24" fill="#edf3ed" stroke="#6d9580"/><text x="384" y="367" font-size="19" fill="#5c747d" text-anchor="middle" font-weight="400">3</text><text x="420" y="367" font-size="18" fill="#9aa7ad" text-anchor="middle" font-weight="400">→</text><text x="452" y="367" font-size="21" fill="#3d7058" text-anchor="middle" font-weight="650">3</text><circle cx="706" cy="180" r="30" fill="#f1f0e9" stroke="#b9a98a" stroke-width="2"/><text x="706" y="188" font-size="20" fill="#8f7857" text-anchor="middle" font-weight="650">−1.4</text><text x="762" y="188" font-size="21" fill="#71838b" text-anchor="start" font-weight="400">z₁</text><circle cx="706" cy="300" r="30" fill="#f1f0e9" stroke="#b9a98a" stroke-width="2"/><text x="706" y="308" font-size="20" fill="#8f7857" text-anchor="middle" font-weight="650">1.4</text><text x="762" y="308" font-size="21" fill="#71838b" text-anchor="start" font-weight="400">z₂</text><text x="480" y="420" font-size="18" fill="#71838b" text-anchor="middle" font-weight="400">第二个隐藏单元被 ReLU 截为 0，它在本次计算中对输出没有贡献（虚线）。</text></svg>