<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" role="img" aria-labelledby="title desc"><title id="title">SGD 与 Adam 的优化轨迹</title><desc id="desc">在一个两个方向曲率相差 50 倍的二次函数上，从同一点出发迭代 30 步。SGD 在陡峭方向来回振荡、在平缓方向前进缓慢；Adam 的两个方向步长接近，更快接近最优点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="454" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">SGD 与 Adam 的优化轨迹</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">f(x, y) = ½(x² + 50y²)：沿 y 方向陡峭，沿 x 方向平缓</text><rect x="38" y="100" width="410" height="250" rx="8" fill="#f6f7f4" stroke="none"/><clipPath id="clip38"><rect x="38" y="100" width="410" height="250" rx="8"/></clipPath><g clip-path="url(#clip38)"><ellipse cx="371.1" cy="225" rx="64.1" ry="8.8" fill="none" stroke="#c9d0d3" stroke-width="1"/><ellipse cx="371.1" cy="225" rx="128.1" ry="17.7" fill="none" stroke="#c9d0d