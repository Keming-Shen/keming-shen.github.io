<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-labelledby="title desc"><title id="title">原始 Transformer 的学习率调度</title><desc id="desc">学习率在前 4000 步线性增长到峰值约 6.99e-4，之后按步数的平方根倒数衰减，10 万步时约 1.40e-4。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="476" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">原论文的学习率调度（预热 + 平方根倒数衰减）</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">η = d^(−1/2) · min(t^(−1/2), t · 4000^(−3/2))，d = 512</text><rect x="110" y="96" width="600" height="290" rx="6" fill="#f6f7f4" stroke="none"/><path d="M110 311.9L710 311.9" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="102" y="316.9" font-size="12" fill="#9aa7ad" text-anchor="end" font-weight="400">2×10⁻⁴</text><path d="M110 237.8L710 237.8" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="102" y="242.8" font-size="12" fill="#9aa7ad" text-anchor="end" font-weight="400">4×10⁻⁴</text><path d="M110 163.7L710 163.7" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="102" y="168.7" font-size="12" fill="#9aa7ad" text-anchor="end" font-weight="400">6×10⁻⁴</text><text x="110" y="408.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">0</text><text x="230" y="408.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">20k</text><text x="350" y="408.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">40k</text><text x="470" y="408.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">60k</text><text x="590" y="408.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">80k</text><text x="710" y="408.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">100k</text><text x="410" y="432.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">训练步数 t</text><rect x="110" y="96" width="24" height="290" rx="0" fill="#f1f0e9" stroke="none" opacity=".7"/><path d="M110 385.9L111.5 369.8L113 353.6L114.5 337.4L116 321.2L117.5 305L119 288.8L120.5 272.7L122 256.5L123.5 240.3L125 224.1L126.5 207.9L128 191.7L129.5 175.6L131 159.4L132.5 143.2L134 127.1L135.5 134.8L137 141.9L138.5 148.4L140 154.4L141.5 160L143 165.2L144.5 170.1L146 174.6L147.5 178.9L149 182.9L150.5 186.7L152 190.3L153.5 193.7L155 196.9L156.5 200L158 202.9L159.5 205.7L161 208.4L162.5 210.9L164 213.4L165.5 215.7L167 218L168.5 220.2L170 222.2L171.5 224.3L173 226.2L174.5 228.1L176 229.9L177.5 231.6L179 233.3L180.5 234.9L182 236.5L183.5 238L185 239.5L186.5 241L188 242.4L189.5 243.7L191 245.1L192.5 246.3L194 247.6L195.5 248.8L197 250L198.5 251.2L200 252.3L201.5 253.4L203 254.5L204.5 255.5L206 256.5L207.5