" font-weight="650">预热</text><rect x="740" y="110" width="182" height="270" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="754" y="136" font-size="13" fill="#4a6a80" text-anchor="start" font-weight="650">前 4000 步</text><text x="754" y="160" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">学习率线性增长</text><text x="754" y="184" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400"></text><text x="754" y="208" font-size="13" fill="#4a6a80" text-anchor="start" font-weight="650">之后</text><text x="754" y="232" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">按 t^(−1/2) 衰减</text><text x="754" y="256" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">10 万步时 1.40×10⁻⁴</text><text x="754" y="280" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400"></text><text x="754" y="304" font-size="13" fill="#4a6a80" text-anchor="start" font-weight="650">配合 Adam：</text><text x="754" y="328" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">β₁=0.9，β₂=0.98</text><text x="754" y="352" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">ε = 10⁻⁹</text><text x="38" y="454" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">Post-LN 在训练初期对学习率敏感，预热避免初期的大步更新破坏训练；Pre-LN 模型通常可以缩短甚至去掉预热。</text></svg>