<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">批量张量的三个轴</title><desc id="desc">两条序列补齐到长度 5 后组成形状 [2,5,4] 的张量。高亮的一行是 X[0,1]，即第 0 个样本中“我”的四维向量；每个切片的第一列组成 X[:,:,0]；第 1 个样本的最后一个位置是填充。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="480" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">批量张量 X ∈ ℝ²ˣ⁵ˣ⁴</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">三个轴依次为样本 B、位置 L、特征 D</text><rect x="296" y="132" width="43" height="37" rx="3" fill="#c9dcc9" stroke="#6d9580"/><rect x="342" y="132" width="43" height="37" rx="3" fill="#edf3ed" stroke="#6d9580"/><rect x="388" y="132" width="43" height="37" rx="3" fill="#edf3ed" stroke="#6d9580"/><rect x="434" y="132" width="43" height="37" rx="3" fill="#edf3ed" stroke="#6d9580"/><rect x="296" y="172" width="43" height="3