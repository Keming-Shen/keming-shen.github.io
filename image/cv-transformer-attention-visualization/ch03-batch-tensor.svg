364" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="98" y="268" font-size="14" fill="#71838b" text-anchor="middle" transform="rotate(-90 98 268)">位置轴 L = 5</text><path d="M432 176L484 136" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="492" y="140" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">样本轴 B = 2</text><rect x="580" y="130" width="340" height="78" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="598" y="160" font-size="17" fill="#8f7857" text-anchor="start" font-weight="650">X[0, 1]</text><text x="598" y="186" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">第 0 个样本、第 1 个位置（“我”）的向量</text><text x="900" y="160" font-size="14" fill="#9aa7ad" text-anchor="end" font-weight="400">形状 [4]</text><rect x="580" y="226" width="340" height="78" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="598" y="256" font-size="17" fill="#4a6a80" text-anchor="start" font-weight="650">X[:, :, 0]</text><text x="598" y="282" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">所有样本、所有位置的第 0 个特征</text><text x="900" y="256" font-size="14" fill="#9aa7ad" text-anchor="end" font-weight="400">形状 [2, 5]</text><rect x="580" y="322" width="340" height="78" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="598" y="352" font-size="17" fill="#8a979d" text-anchor="start" font-weight="650">&lt;pad&gt;</text><text x="598" y="378" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">第 1 个样本的第 4 个位置，不属于句子内容</text><text x="900" y="352" font-size="14" fill="#9aa7ad" text-anchor="end" font-weight="400">补齐位置</text></svg>