<svg xmlns="http://www.w3.org/2000/svg" width="960" height="376" viewBox="0 0 960 376" role="img" aria-labelledby="title desc"><title id="title">cross_entropy 的正确输入</title><desc id="desc">正确路径直接把 logits [−1.4,1.4] 传入 cross_entropy，内部经 log_softmax 后取标签对应项，损失为 0.059。错误路径先做 softmax 得到 [0.057,0.943]，再传入 cross_entropy，损失变为 0.345。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="376" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">cross_entropy 的输入应当是 logits</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">库函数内部已经包含 log_softmax</text><rect x="40" y="100" width="150" height="60" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="115" y="127.7" font-size="19" fill="#4a6a80" text-anchor="middle" font-weight="650">logits</text><text x="115" y="147.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[−1.4, 1.4]</text><rect x="260" y="100" width="190" height="60" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="355" y="127.7" font-size="19" fill="#3d7058" text-anchor="middle" font-weight="650">log_softmax</text><text x="355" y="147.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[−2.859, −0.059]</text><rect x="520" y="100" width="170" height="60" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="605" y="127.7" font-size="19" fill="#3d7058" text-anchor="middle" font-weight="650">取标签对应项</text><text x="605" y="147.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">并取负号</text><rect x="760" y="100" width="160" height="60" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="840" y="127.7" font-size="19" fill="#3d7058" text-anchor="middle" font-weight="650">损失 0.059</text><text x="840" y="147.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">正确</text><path d="M194 130H254" fill="none" stroke="#6d9580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M454 130H514" fill="none" stroke="#6d9580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M694 130H754" fill="none" stroke="#6d9580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="250" y="86" width="450" height="88" rx="12" fill="none" stroke="#6d9580" stroke-dasharray="6 6"/><text x="260" y="192" font-size="15" fill="#3d7058" text-anchor="start" font-weight="400">F.cross_entropy(logits, target) 一次完成</text><rect x="40" y="240" width="150" height="60" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="115" y="267.6" font-size="19" fill="#4a6a80" text-anchor="middle" font-weight="650">logits</text><text x="115" y="287.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[−1.4, 1.4]</text><rect x="260" y="240" width="190" height="60" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="355" y="267.6" font-size="19" fill="#a4604b" text-anchor="middle" font-weight="650">先 softmax</text><text x="355" y="287.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[0.057, 0.943]</text><rect x="520" y="240" width="170" height="60" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="605" y="267.6" font-size="19" fill="#a4604b" text-anchor="middle" font-weight="650">再 cross_entropy</text><text x="605" y="287.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">当作新的 logits</text><rect x="760" y="240" width="160" height="60" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="840" y="267.6" font-size="19" fill="#a4604b" text-anchor="middle" font-weight="650">损失 0.345</text><text x="840" y="287.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">含义已改变</text><path d="M194 270H254" fill="none" stroke="#c99787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowR)"/><path d="M454 270H514" fill="none" stroke="#c99787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowR)"/><path d="M694 270H754" fill="none" stroke="#c99787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowR)"/><text x="38" y="352" font-size="16" fill="#71838b" text-anchor="start" font-weight="400">错误路径不会报错：概率被再次归一化，梯度被压扁，模型往往训练得更慢、更差。</text></svg>