<svg xmlns="http://www.w3.org/2000/svg" width="960" height="394" viewBox="0 0 960 394" role="img" aria-labelledby="title desc"><title id="title">训练步中梯度的状态</title><desc id="desc">zero_grad 把梯度清空为 None；前向与计算损失时梯度保持为空；backward 后梯度写入 g；step 用梯度把参数更新为 w₀−η·g。梯度累积时，两次 backward 之间不清零，最后统一 step。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="394" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">一个训练步中参数与梯度的状态</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">以某个参数 w 为例；梯度默认累加，因此每步先清零</text><rect x="38" y="100" width="164" height="64" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="120" y="129.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">zero_grad()</text><text x="120" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">清空旧梯度</text><path d="M204 132L216 132" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="190" width="140" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="120" y="211.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="600">.grad = None</text><rect x="50" y="234" width="140" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="120" y="255.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">w = w₀</text><rect x="218" y="100" width="164" height="64" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="300" y="129.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">model(x)</text><text x="300" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">前向，建立计算图</text><path d="M384 132L396 132" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="230" y="190" width="140" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="300" y="211.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="600">.grad = None</text><rect x="230" y="234" width="140" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="300" y="255.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">w = w₀</text><rect x="398" y="100" width="164" height="64" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="480" y="129.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">loss_fn(...)</text><text x="480" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">得到标量损失</text><path d="M564 132L576 132" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="410" y="190" width="140" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="480" y="211.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="600">.grad = None</text><rect x="410" y="234" width="140" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="480" y="255.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">w = w₀</text><rect x="578" y="100" width="164" height="64" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="660" y="129.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">backward()</text><text x="660" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">梯度写入 .grad</text><path d="M744 132L756 132" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="590" y="190" width="140" height="34" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="660" y="211.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="600">.grad = g</text><rect x="590" y="234" width="140" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="660" y="255.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">w = w₀</text><rect x="758" y="100" width="164" height="64" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="840" y="129.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">step()</text><text x="840" y="152.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">按梯度更新参数</text><rect x="770" y="190" width="140" height="34" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="840" y="211.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="600">.grad = g</text><rect x="770" y="234" width="140" height="34" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="840" y="255.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">w = w₀ − η·g</text><path d="M38 300L922 300" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="334" font-size="16" fill="#293e4b" text-anchor="start" font-weight="650">梯度累积（累积 2 个小批次）：</text><rect x="296" y="313" width="136" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="364" y="333.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="500">zero_grad()</text><path d="M434 329L444 329" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="448" y="313" width="136" height="32" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="516" y="333.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="500">backward(ℒ₁ / 2)</text><path d="M586 329L596 329" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="600" y="313" width="136" height="32" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="668" y="333.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="500">backward(ℒ₂ / 2)</text><path d="M738 329L748 329" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="752" y="313" width="136" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="820" y="333.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">step()</text><text x="38" y="372" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">两次 backward 之间不清零，.grad 中累加得到 (∇ℒ₁ + ∇ℒ₂) / 2，相当于一次更大的批量；损失需除以累积次数，保持梯度尺度不变。</text></svg>