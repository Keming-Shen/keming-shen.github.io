<svg xmlns="http://www.w3.org/2000/svg" width="960" height="506" viewBox="0 0 960 506" role="img" aria-labelledby="title desc"><title id="title">原始 Transformer 的数据流</title><desc id="desc">源 token 编号经嵌入与位置编码后进入 6 层编码器，得到 memory [B,S,512]。右移的目标前缀经嵌入与位置编码后进入 6 层解码器，每层依次为因果自注意力、交叉注意力与 FFN，每个子层后接残差与 LayerNorm；交叉注意力读取 memory。最后经线性层与 softmax 得到 [B,T,|V|]。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="506" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">原始 Transformer 的完整数据流</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">Base 配置；源长 S，目标前缀长 T，词表 |V| ≈ 37000</text><rect x="130" y="425" width="220" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="240" y="444.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">源 token 编号  [B, S]</text><rect x="130" y="366" width="220" height="50" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="240" y="386.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">嵌入 × √d + 位置编码</text><text x="240" y="408.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">→ [B, S, 512]</text><path d="M240 424L240 420" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="110" y="120" width="260" height="230" rx="12" fill="#e8eff5" stroke="#9eb4c4"/><text x="240" y="147.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="700">编码器 × 6</text><text x="240" y="166.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">每层参数独立</text><rect x="130" y="177" width="220" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="240" y="196.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">多头自注意力（无因果掩码）</text><rect x="130" y="217" width="220" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="240" y="236.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">Add &amp; LayerNorm</text><rect x="130" y="257" width="220" height="30" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="240" y="276.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="500">FFN 512 → 2048 → 512</text><rect x="130" y="297" width="220" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="240" y="316.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">Add &amp; LayerNorm</text><path d="M240 362L240 354" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130" y="81" width="220" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="240" y="100.5" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="500">memory M  [B, S, 512]</text><rect x="590" y="425" width="220" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="700" y="444.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">目标前缀（右移）  [B, T]</text><rect x="590" y="366" width="220" height="50" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="700" y="386.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">嵌入 × √d + 位置编码</text><text x="700" y="408.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">→ [B, T, 512]</text><path d="M700 424L700 420" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="550" y="90" width="300" height="270" rx="12" fill="#edf3ed" stroke="#6d9580"/><text x="700" y="117.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="700">解码器 × 6</text><rect x="570" y="124" width="260" height="28" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="700" y="142.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">带因果掩码的自注意力</text><rect x="570" y="160" width="260" height="28" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="700" y="178.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">Add &amp; LayerNorm</text><rect x="570" y="196" width="260" height="28" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="700" y="214.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="500">交叉注意力（Q←解码器，K/V←M）</text><rect x="570" y="232" width="260" height="28" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="700" y="250.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">Add &amp; LayerNorm</text><rect x="570" y="268" width="260" height="28" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="700" y="286.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="500">FFN</text><rect x="570" y="304" width="260" height="28" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="700" y="322.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">Add &amp; LayerNorm</text><path d="M700 362L700 356" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M350 96H420V210H568" fill="none" stroke="#8f7857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="430" y="196" font-size="13" fill="#8f7857" text-anchor="start" font-weight="650">每一层都读取 M</text><path d="M700 88V64H828" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="832" y="40" width="110" height="48" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="887" y="59.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="650">Linear + softmax</text><text x="887" y="80.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">[B, T, |V|]</text><text x="38" y="486" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">编码器输出只计算一次，被解码器的全部 6 层共享；每层交叉注意力用各自的参数把 M 投影为 K、V。</text></svg>