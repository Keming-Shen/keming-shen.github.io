<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">批次构造与右移</title><desc id="desc">两条源句补齐到长度 5，两条目标序列补齐到长度 6。target[:, :-1] 作为解码器输入，target[:, 1:] 作为标签，两者错开一位。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="450" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">批次构造：源与目标分别补齐</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">同一批次中，源侧补齐到 S = 5，目标侧补齐到 T + 1 = 6</text><text x="38" y="110" font-size="14" fill="#293e4b" text-anchor="start" font-weight="650">source</text><text x="500" y="110" font-size="14" fill="#293e4b" text-anchor="start" font-weight="650">target</text><rect x="38" y="124" width="64" height="30" rx="5" fill="#e8eff5" stroke="#9eb4c4"/><text x="70" y="143.2" font-size="12" fill="#4a6a80" text-anchor="middle" font-weight="600">i</text><rect x