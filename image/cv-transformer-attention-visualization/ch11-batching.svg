ext x="38" y="228" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">[B = 2, S = 5]</text><text x="500" y="228" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">[B = 2, T + 1 = 6]</text><path d="M38 248L922 248" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="280" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">target[:, :-1]  →  prefix（解码器输入）</text><text x="500" y="280" font-size="14" fill="#a4604b" text-anchor="start" font-weight="650">target[:, 1:]  →  labels（监督标签）</text><rect x="38" y="296" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="70" y="315.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">&lt;bos&gt;</text><rect x="106" y="296" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="138" y="315.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">我</text><rect x="174" y="296" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="206" y="315.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">喜欢</text><rect x="242" y="296" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="274" y="315.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">你</text><rect x="310" y="296" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="342" y="315.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">&lt;eos&gt;</text><rect x="38" y="332" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="70" y="351.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">&lt;bos&gt;</text><rect x="106" y="332" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="138" y="351.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">今天</text><rect x="174" y="332" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="206" y="351.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">我们</text><rect x="242" y="332" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="274" y="351.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">帮助</text><rect x="310" y="332" width="64" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="342" y="351.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">他们</text><rect x="500" y="296" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="532" y="315.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">我</text><rect x="568" y="296" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="600" y="315.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">喜欢</text><rect x="636" y="296" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="668" y="315.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">你</text><rect x="704" y="296" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="736" y="315.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">&lt;eos&gt;</text><rect x="772" y="296" width="64" height="30" rx="5" fill="#f3f4f2" stroke="#c9d0d3"/><text x="804" y="315.2" font-size="12" fill="#8a979d" text-anchor="middle" font-weight="600">&lt;pad&gt;</text><rect x="500" y="332" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="532" y="351.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">今天</text><rect x="568" y="332" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="600" y="351.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">我们</text><rect x="636" y="332" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="668" y="351.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">帮助</text><rect x="704" y="332" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="736" y="351.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">他们</text><rect x="772" y="332" width="64" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="804" y="351.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">&lt;eos&gt;</text><text x="38" y="408" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">固定编号 PAD=0、BOS=1、EOS=2、UNK=3，其余在源词表与目标词表中分别编号；同一个整数在两个词表中不代表同一个 token。</text><text x="38" y="430" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">labels 中的 &lt;pad&gt; 由 ignore_index 排除；prefix 中的 &lt;pad&gt; 由 tgt_key_padding_mask 屏蔽。</text></svg>