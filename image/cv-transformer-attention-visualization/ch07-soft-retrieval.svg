<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title desc"><title id="title">硬检索与软检索</title><desc id="desc">左：字典查询中查询只命中 k2，输出 v2。右：注意力为三个键分别给出 0.15、0.59、0.26 的权重，输出为三个值的加权和。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="442" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">硬检索与软检索</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">字典按键精确匹配，注意力按相似度加权混合所有值</text><rect x="38" y="92" width="420" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="248" y="123.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">字典 / 数据库查询</text><text x="248" y="144.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">命中或不命中，只返回一个值</text><rect x="63" y="233" width="90" height="34" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="108" y="255.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">查询 q</text><rect x="238" y="166" width="120" height="40" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="298" y="191.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="600">k₁ → v₁</text><path d="M154 250L234 186" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="196" y="214.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="650">0</text><path d="M360 186L388 250" fill="none" stroke="#c9d0d3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="238" y="230" width="120" height="40" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="298" y="255.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="600">k₂ → v₂</text><path d="M154 250L234 250" fill="none" stroke="#b9a98a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="196" y="246.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="650">1</text><path d="M360 250L388 250" fill="none" stroke="#b9a98a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="238" y="294" width="120" height="40" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="298" y="319.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="600">k₃ → v₃</text><path d="M154 250L234 314" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="196" y="278.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="650">0</text><path d="M360 314L388 250" fill="none" stroke="#c9d0d3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="390" y="228" width="56" height="44" rx="8" fill="#f1f0e9" stroke="#8f7857" stroke-width="2"/><text x="418" y="254.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">输出</text><text x="248" y="374.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="600">输出 = v₂</text><rect x="502" y="92" width="420" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="712" y="123.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">注意力（软检索）</text><text x="712" y="144.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">权重由 softmax(分数) 给出，处处可导</text><rect x="527" y="233" width="90" height="34" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="572" y="255.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">查询 q</text><rect x="702" y="166" width="120" height="40" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="762" y="191.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">k₁ → v₁</text><path d="M618 250L698 186" fill="none" stroke="#6d9580" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="214.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">0.15</text><path d="M824 186L852 250" fill="none" stroke="#6d9580" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><rect x="702" y="230" width="120" height="40" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="762" y="255.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">k₂ → v₂</text><path d="M618 250L698 250" fill="none" stroke="#6d9580" stroke-width="3.9499999999999997" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="246.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">0.59</text><path d="M824 250L852 250" fill="none" stroke="#6d9580" stroke-width="3.9499999999999997" stroke-linecap="round" stroke-linejoin="round"/><rect x="702" y="294" width="120" height="40" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="762" y="319.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">k₃ → v₃</text><path d="M618 250L698 314" fill="none" stroke="#6d9580" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="278.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">0.26</text><path d="M824 314L852 250" fill="none" stroke="#6d9580" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="854" y="228" width="56" height="44" rx="8" fill="#edf3ed" stroke="#3d7058" stroke-width="2"/><text x="882" y="254.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">输出</text><text x="712" y="374.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">输出 = 0.15·v₁ + 0.59·v₂ + 0.26·v₃</text><text x="38" y="420" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">硬检索的 0/1 选择对输入不可导；软检索的权重是分数的光滑函数，梯度可以传回 q、k 以及产生它们的投影参数。</text></svg>