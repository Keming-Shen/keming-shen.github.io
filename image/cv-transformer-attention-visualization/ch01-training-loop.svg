<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">前向传播、反向传播与参数更新</title><desc id="desc">输入 x 经网络 f(x; θ) 得到预测 ŷ，与标签 y 一起计算损失。反向传播求出损失对参数的梯度，优化器据此更新参数 θ。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="340" rx="14" fill="#fcfcfa" stroke="none"/><rect x="40" y="110" width="150" height="62" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="115" y="138" font-size="21" fill="#4a6a80" text-anchor="middle" font-weight="650">输入 x</text><text x="115" y="162" font-size="15" fill="#71838b" text-anchor="middle" font-weight="400">样本</text><rect x="262" y="110" width="180" height="62" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="352" y="138" font-size="21" fill="#3d7058" text-anchor="middle" font-weight="650">网络 f(x; θ)</text><text x="352" y="162" font-size="15" fill="#71838b" text-anchor="middle" font-weight="400">参数 θ 定义变换</text><rect x="514" y="110" width="140" height="62" rx="10" fill="#f6f7f4" stroke="#c9d0d3"/><text x="584" y="138" font-size="21" fill="#293e4b" text-anchor="middle" font-weight="650">预测 ŷ</text><text x="584" y="162" font-size="15" fill="#71838b" text-anchor="middle" font-weight="400">前向传播的输出</text><rect x="726" y="110" width="150" height="62" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="801" y="138" font-size="21" fill="#8f7857" text-anchor="middle" font-weight="650">损失 ℒ(ŷ, y)</text><text x="801" y="162" font-size="15" fill="#71838b" text-anchor="middle" font-weight="400">衡量预测误差</text><path d="M194 141H256" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M446 141H508" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M658 141H720" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="846" y="232" font-size="17" fill="#71838b" text-anchor="middle" font-weight="400">标签 y</text><path d="M846 212V180" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="482" y="84" font-size="18" fill="#71838b" text-anchor="middle" font-weight="400">前向传播 → 计算预测与损失</text><path d="M766 176V262H700" fill="none" stroke="#8f7857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><rect x="470" y="240" width="226" height="46" rx="23" fill="#fcfcfa" stroke="#b9a98a"/><text x="583" y="269" font-size="18" fill="#8f7857" text-anchor="middle" font-weight="600">优化器：θ ← θ − η∇ℒ</text><path d="M466 262H352V178" fill="none" stroke="#8f7857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="752" y="222" font-size="17" fill="#8f7857" text-anchor="end" font-weight="400">反向传播：∂ℒ/∂θ</text><text x="480" y="318" font-size="17" fill="#9aa7ad" text-anchor="middle" font-weight="400">每个训练步重复一次：前向计算损失，反向求梯度，再由优化器更新参数。</text></svg>