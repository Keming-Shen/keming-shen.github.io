<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title desc"><title id="title">RNN 与因果自注意力的训练顺序</title><desc id="desc">左：RNN 的四个隐藏状态依次计算，需要四个顺序步骤。右：因果自注意力的 4×4 权重矩阵中，下三角允许、上三角为负无穷，所有行在一个步骤内同时计算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="442" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">训练时的计算顺序</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">RNN 必须逐步递推；因果自注意力在一次矩阵运算中处理所有位置</text><rect x="38" y="92" width="420" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="248" y="123.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">RNN：T 个时间步依次执行</text><circle cx="90" cy="200" r="24" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="90" y="205.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">h₁</text><path d="M116 200L162 200" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="262" width="60" height="26" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="90" y="279.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="600">第 1 步</text><circle cx="190" cy="200" r="24" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="190" y="205.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">h₂</text><path d="M216 200L262 200" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="262" width="60" height="26" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="190" y="279.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="600">第 2 步</text><circle cx="290" cy="200" r="24" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="290" y="205.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">h₃</text><path d="M316 200L362 200" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="260" y="262" width="60" height="26" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="290" y="279.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="600">第 3 步</text><circle cx="390" cy="200" r="24" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="390" y="205.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">h₄</text><rect x="360" y="262" width="60" height="26" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="390" y="279.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="600">第 4 步</text><path d="M60 312H410" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="235" y="340.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">时间</text><text x="248" y="373.3" font-size="15" fill="#a4604b" text-anchor="middle" font-weight="650">顺序操作数 O(T)</text><rect x="498" y="92" width="424" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="710" y="123.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">因果自注意力：一次计算全部位置</text><rect x="620" y="150" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="641" y="173.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="664" y="150" width="42" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="685" y="173.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">−∞</text><rect x="708" y="150" width="42" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="729" y="173.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">−∞</text><rect x="752" y="150" width="42" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="773" y="173.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">−∞</text><rect x="620" y="190" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="641" y="213.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="664" y="190" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="685" y="213.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="708" y="190" width="42" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="729" y="213.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">−∞</text><rect x="752" y="190" width="42" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="773" y="213.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">−∞</text><rect x="620" y="230" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="641" y="253.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="664" y="230" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="685" y="253.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="708" y="230" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="729" y="253.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="752" y="230" width="42" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="773" y="253.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">−∞</text><rect x="620" y="270" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="641" y="293.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="664" y="270" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="685" y="293.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="708" y="270" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="729" y="293.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><rect x="752" y="270" width="42" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="773" y="293.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="400">✓</text><text x="610" y="175" font-size="13" fill="#5c747d" text-anchor="end" font-weight="400">&lt;bos&gt;</text><text x="610" y="215" font-size="13" fill="#5c747d" text-anchor="end" font-weight="400">我</text><text x="610" y="255" font-size="13" fill="#5c747d" text-anchor="end" font-weight="400">喜欢</text><text x="610" y="295" font-size="13" fill="#5c747d" text-anchor="end" font-weight="400">你</text><text x="641" y="144.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">&lt;bos&gt;</text><text x="685" y="144.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">我</text><text x="729" y="144.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">喜欢</text><text x="773" y="144.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">你</text><rect x="560" y="322" width="300" height="26" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="710" y="339.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="600">第 1 步：所有行同时计算</text><text x="710" y="375.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">顺序操作数 O(1)（每层）</text><text x="38" y="420" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">前提是正确前缀已经完整给出（teacher forcing）；推理时下一个 token 尚未生成，仍需逐步执行。</text></svg>