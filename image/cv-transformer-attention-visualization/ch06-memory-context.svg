<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" role="img" aria-labelledby="title desc"><title id="title">memory 的上下文范围</title><desc id="desc">三种编码器都为 I、like、you 保留三个状态。单向 RNN 中 h1 只依赖 I，h3 依赖全部三个词；双向 RNN 与 Transformer 编码器中每个状态都依赖全部输入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="454" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">memory：保留全部源位置的状态</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">保留多少个位置，与每个位置包含多大范围的上下文，是两件事</text><rect x="38" y="86" width="280" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="178" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">单向 RNN</text><text x="178" y="138.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">hⱼ 只看到位置 j 及之前</text><rect x="65" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="98" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">I</text><rect x="72" y="188" width="52" height="64" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="98" y="225.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₁</text><rect x="145" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="178" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">like</text><rect x="152" y="188" width="52" height="64" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="178" y="225.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₂</text><rect x="225" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="258" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">you</text><rect x="232" y="188" width="52" height="64" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="258" y="225.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₃</text><path d="M98 316C98 290 98 290 98 256" fill="none" stroke="#9eb4c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 316C98 290 178 290 178 256" fill="none" stroke="#9eb4c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M178 316C178 290 178 290 178 256" fill="none" stroke="#9eb4c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M98 316C98 290 258 290 258 256" fill="none" stroke="#9eb4c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M178 316C178 290 258 290 258 256" fill="none" stroke="#9eb4c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M258 316C258 290 258 290 258 256" fill="none" stroke="#9eb4c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="86" width="280" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="480" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">双向 RNN</text><text x="480" y="138.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">拼接正向与反向状态</text><rect x="367" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="400" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">I</text><rect x="374" y="188" width="52" height="64" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="400" y="225.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">h₁</text><rect x="447" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="480" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">like</text><rect x="454" y="188" width="52" height="64" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="480" y="225.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">h₂</text><rect x="527" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="560" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">you</text><rect x="534" y="188" width="52" height="64" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="560" y="225.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">h₃</text><path d="M400 316C400 290 400 290 400 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 316C480 290 400 290 400 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M560 316C560 290 400 290 400 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M400 316C400 290 480 290 480 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M480 316C480 290 480 290 480 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 316C560 290 480 290 480 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M400 316C400 290 560 290 560 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M480 316C480 290 560 290 560 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M560 316C560 290 560 290 560 256" fill="none" stroke="#6d9580" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="642" y="86" width="280" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="782" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">Transformer 编码器</text><text x="782" y="138.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">自注意力直接读取所有位置</text><rect x="669" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="702" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">I</text><rect x="676" y="188" width="52" height="64" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="702" y="225.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">h₁</text><rect x="749" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="782" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">like</text><rect x="756" y="188" width="52" height="64" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="782" y="225.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">h₂</text><rect x="829" y="317" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="862" y="337.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">you</text><rect x="836" y="188" width="52" height="64" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="862" y="225.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">h₃</text><path d="M702 316C702 290 702 290 702 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M782 316C782 290 702 290 702 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M862 316C862 290 702 290 702 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M702 316C702 290 782 290 782 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M782 316C782 290 782 290 782 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M862 316C862 290 782 290 782 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M702 316C702 290 862 290 862 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M782 316C782 290 862 290 862 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M862 316C862 290 862 290 862 256" fill="none" stroke="#b9a98a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="388" width="884" height="46" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="480" y="416.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="500">三者都保留 n 个向量 H ∈ ℝⁿˣᵈ；区别在于每个 hⱼ 依赖哪些输入（连线）。</text></svg>