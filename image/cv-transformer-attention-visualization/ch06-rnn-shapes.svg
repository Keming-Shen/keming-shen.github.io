<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">nn.RNN 的输出形状</title><desc id="desc">嵌入 [1,3,12] 输入 nn.RNN 后得到两种输出：序列输出 memory 形状为 [1,3,16]，包含每个时间步的状态；最终状态 final_state 形状为 [1,1,16]，第一维是层数乘方向数，不受 batch_first 影响。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="410" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">nn.RNN 的两种输出</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">batch_first=True，单层单向，B = 1，S = 3，H = 16</text><rect x="40" y="150" width="140" height="64" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="110" y="178.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">embedding</text><text x="110" y="199.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">[B, S, E] = [1, 3, 12]</text><path d="M184 182L236 182" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="240" y="110" width="200" height="146" rx="12" fill="#edf3ed" stroke="#6d9580"/><text x="340" y="146.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="700">nn.RNN</text><circle cx="282" cy="200" r="20" fill="#fcfcfa" stroke="#6d9580" stroke-width="2"/><text x="282" y="204.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">h₁</text><path d="M304 200L318 200" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="340" cy="200" r="20" fill="#fcfcfa" stroke="#6d9580" stroke-width="2"/><text x="340" y="204.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">h₂</text><path d="M362 200L376 200" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="398" cy="200" r="20" fill="#fcfcfa" stroke="#6d9580" stroke-width="2"/><text x="398" y="204.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">h₃</text><path d="M444 150H520" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M444 226C480 226 480 300 520 300" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="526" y="108" width="396" height="86" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="544" y="136" font-size="16" fill="#4a6a80" text-anchor="start" font-weight="650">memory（序列输出）</text><text x="544" y="162" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">形状 [B, S, H] = [1, 3, 16]</text><text x="544" y="184" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">每个时间步的状态 h₁, h₂, h₃</text><rect x="526" y="258" width="396" height="86" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="544" y="286" font-size="16" fill="#8f7857" text-anchor="start" font-weight="650">final_state（最终状态）</text><text x="544" y="312" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">形状 [层数 × 方向数, B, H] = [1, 1, 16]</text><text x="544" y="334" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">只有最后一步 h₃；不受 batch_first 影响</text><text x="38" y="388" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">固定上下文模型只把 final_state 交给解码器作初始状态；第 4 节开始改为使用完整的 memory。</text></svg>