<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-labelledby="title desc"><title id="title">top-k 与 top-p 截断</title><desc id="desc">同一个分布 0.42、0.23、0.14、0.09、0.06、0.04、0.02。top-k 取 k=3 保留前三个，概率之和 0.79；top-p 取 p=0.9 时，累计到第五个达到 0.94，保留五个。截断后都重新归一化再采样。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="462" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">top-k 与 top-p 截断</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">对同一个下一 token 分布，保留不同的候选集合</text><rect x="38" y="86" width="424" height="318" rx="10" fill="#f6f7f4" stroke="none"/><text x="250" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">top-k（k = 3）：固定保留 3 个</text><rect x="68" y="162" width="20" height="168" rx="3" fill="#c4d6df" stroke="none"/><rect x="90" y="117.3" width="20" height="212.7" rx="3" fill="#94b79a" stroke="none"/><text x="89" y="354.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">好</text><text x="78" y="157.8" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="400">0.42</text><rect x="122" y="238" width="20" height="92" rx="3" fill="#c4d6df" stroke="none"/><rect x="144" y="213.5" width="20" height="116.5" rx="3" fill="#94b79a" stroke="none"/><text x="143" y="354.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">热</text><text x="132" y="233.8" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="400">0.23</text><rect x="176" y="274" width="20" height="56" rx="3" fill="#c4d6df" stroke="none"/><rect x="198" y="259.1" width="20" height="70.9" rx="3" fill="#94b79a" stroke="none"/><text x="197" y="354.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">冷</text><text x="186" y="269.9" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="400">0.14</text><rect x="230" y="294" width="20" height="36" rx="3" fill="#e4e7e6" stroke="none"/><text x="251" y="354.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">闷</text><text x="240" y="289.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.09</text><rect x="284" y="306" width="20" height="24" rx="3" fill="#e4e7e6" stroke="none"/><text x="305" y="354.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">晴</text><text x="294" y="301.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.06</text><rect x="338" y="314" width="20" height="16" rx="3" fill="#e4e7e6" stroke="none"/><text x="359" y="354.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">湿</text><text x="348" y="309.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.04</text><rect x="392" y="322" width="20" height="8" rx="3" fill="#e4e7e6" stroke="none"/><text x="413" y="354.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">…</text><text x="402" y="317.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.02</text><path d="M58 330L442 330" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="222" y="128" width="2" height="212" rx="1" fill="#a4604b" stroke="none"/><text x="223" y="150.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">截断</text><text x="250" y="386.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">保留概率之和 0.79，再归一化</text><rect x="498" y="86" width="424" height="318" rx="10" fill="#f6f7f4" stroke="none"/><text x="710" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">top-p（p = 0.9）：累计达到 0.9 为止</text><rect x="528" y="162" width="20" height="168" rx="3" fill="#c4d6df" stroke="none"/><rect x="550" y="151.3" width="20" height="178.7" rx="3" fill="#94b79a" stroke="none"/><text x="549" y="354.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">好</text><text x="538" y="157.8" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="400">0.42</text><rect x="582" y="238" width="20" height="92" rx="3" fill="#c4d6df" stroke="none"/><rect x="604" y="232.1" width="20" height="97.9" rx="3" fill="#94b79a" stroke="none"/><text x="603" y="354.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">热</text><text x="592" y="233.8" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="400">0.23</text><rect x="636" y="274" width="20" height="56" rx="3" fill="#c4d6df" stroke="none"/><rect x="658" y="270.4" width="20" height="59.6" rx="3" fill="#94b79a" stroke="none"/><text x="657" y="354.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">冷</text><text x="646" y="269.9" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="400">0.14</text><rect x="690" y="294" width="20" height="36" rx="3" fill="#c4d6df" stroke="none"/><rect x="712" y="291.7" width="20" height="38.3" rx="3" fill="#94b79a" stroke="none"/><text x="711" y="354.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">闷</text><text x="700" y="289.9" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="400">0.09</text><rect x="744" y="306" width="20" height="24" rx="3" fill="#c4d6df" stroke="none"/><rect x="766" y="304.5" width="20" height="25.5" rx="3" fill="#94b79a" stroke="none"/><text x="765" y="354.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">晴</text><text x="754" y="301.9" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="400">0.06</text><rect x="798" y="314" width="20" height="16" rx="3" fill="#e4e7e6" stroke="none"/><text x="819" y="354.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">湿</text><text x="808" y="309.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.04</text><rect x="852" y="322" width="20" height="8" rx="3" fill="#e4e7e6" stroke="none"/><text x="873" y="354.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">…</text><text x="862" y="317.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.02</text><path d="M518 330L902 330" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="128" width="2" height="212" rx="1" fill="#a4604b" stroke="none"/><text x="791" y="150.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">截断</text><text x="710" y="386.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">累计 0.42 + 0.23 + 0.14 + 0.09 + 0.06 = 0.94，保留 5 个</text><rect x="60" y="428" width="14" height="14" rx="3" fill="#c4d6df" stroke="none"/><text x="80" y="440" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">原分布</text><rect x="160" y="428" width="14" height="14" rx="3" fill="#94b79a" stroke="none"/><text x="180" y="440" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">截断并归一化后用于采样</text><text x="420" y="440" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">分布越平坦，top-p 保留的候选越多；分布越尖锐，保留越少。</text></svg>