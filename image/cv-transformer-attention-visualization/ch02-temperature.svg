<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title desc"><title id="title">缩放对 softmax 分布的影响</title><desc id="desc">同一组 logits 2.0、1.0、0.1、−1.0，除以 τ=0.5、1、2 后，最高项概率依次约为 0.86、0.64、0.45。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="414" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">分数缩放改变分布的集中程度</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">对同一组 logits 除以 τ 再做 softmax；排名不变</text><rect x="38" y="92" width="262" height="262" rx="10" fill="#f6f7f4" stroke="none"/><text x="169" y="124.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">τ = 0.5（放大差距）</text><path d="M58 310L280 310" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="66" y="163.5" width="40" height="146.5" rx="3" fill="#94b79a" stroke="none"/><text x="86" y="158.4" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.86</text><text x="86" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">猫</text><rect x="121.5" y="290.2" width="40" height="19.8" rx="3" fill="#c9dcc9" stroke="none"/><text x="141.5" y="285.1" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.12</text><text x="141.5" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">狗</text><rect x="177" y="306.7" width="40" height="3.3" rx="3" fill="#c9dcc9" stroke="none"/><text x="197" y="301.6" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.02</text><text x="197" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鱼</text><rect x="232.5" y="309.6" width="40" height="0.4" rx="3" fill="#c9dcc9" stroke="none"/><text x="252.5" y="304.5" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">&lt;0.01</text><text x="252.5" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鸟</text><rect x="349" y="92" width="262" height="262" rx="10" fill="#f6f7f4" stroke="none"/><text x="480" y="124.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">τ = 1（原始）</text><path d="M369 310L591 310" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="377" y="201.5" width="40" height="108.5" rx="3" fill="#94b79a" stroke="none"/><text x="397" y="196.4" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.64</text><text x="397" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">猫</text><rect x="432.5" y="270.1" width="40" height="39.9" rx="3" fill="#c9dcc9" stroke="none"/><text x="452.5" y="265" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.23</text><text x="452.5" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">狗</text><rect x="488" y="293.8" width="40" height="16.2" rx="3" fill="#c9dcc9" stroke="none"/><text x="508" y="288.7" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.10</text><text x="508" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鱼</text><rect x="543.5" y="304.6" width="40" height="5.4" rx="3" fill="#c9dcc9" stroke="none"/><text x="563.5" y="299.5" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.03</text><text x="563.5" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鸟</text><rect x="660" y="92" width="262" height="262" rx="10" fill="#f6f7f4" stroke="none"/><text x="791" y="124.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">τ = 2（缩小差距）</text><path d="M680 310L902 310" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="688" y="233.3" width="40" height="76.7" rx="3" fill="#94b79a" stroke="none"/><text x="708" y="228.2" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.45</text><text x="708" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">猫</text><rect x="743.5" y="263.5" width="40" height="46.5" rx="3" fill="#c9dcc9" stroke="none"/><text x="763.5" y="258.4" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.27</text><text x="763.5" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">狗</text><rect x="799" y="280.3" width="40" height="29.7" rx="3" fill="#c9dcc9" stroke="none"/><text x="819" y="275.2" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.17</text><text x="819" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鱼</text><rect x="854.5" y="292.9" width="40" height="17.1" rx="3" fill="#c9dcc9" stroke="none"/><text x="874.5" y="287.8" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.10</text><text x="874.5" y="337.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鸟</text><text x="38" y="392" font-size="16" fill="#71838b" text-anchor="start" font-weight="400">相同运算在第 05 章用作采样温度，在第 07 章中则解释了为什么要把注意力分数除以 √dₖ。</text></svg>