<svg xmlns="http://www.w3.org/2000/svg" width="960" height="384" viewBox="0 0 960 384" role="img" aria-labelledby="title desc"><title id="title">模型的 encode 与 decode 接口</title><desc id="desc">encode(source) 返回 memory 与源填充掩码；decode(prefix, memory, src_pad) 返回目标前缀各位置的 logits；forward 依次调用两者。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="384" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">模型的三个接口</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">拆分 encode 与 decode，使推理时源句只编码一次</text><rect x="60" y="110" width="240" height="70" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="180" y="141.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">encode(source)</text><text x="180" y="162.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">→ memory [B, S, D], src_pad [B, S]</text><rect x="380" y="110" width="280" height="70" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="520" y="141.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">decode(prefix, memory, src_pad)</text><text x="520" y="162.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">→ logits [B, T, |V|]</text><path d="M302 145H376" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="210" width="640" height="110" rx="12" fill="none" stroke="#8f7857" stroke-dasharray="6 6"/><text x="56" y="236" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">forward(source, prefix) = decode(prefix, *encode(source))</text><text x="56" y="266" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">训练时调用：一次完成编码与解码。</text><text x="56" y="290" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">推理时分开调用：encode 一次，decode 每步一次。</text><rect x="720" y="110" width="202" height="210" rx="8" fill="#f6f7f4" stroke="none"/><text x="734" y="140" font-size="13" fill="#293e4b" text-anchor="start" font-weight="650">内部结构</text><text x="734" y="164" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400"></text><text x="734" y="188" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">嵌入 × √D + PE</text><text x="734" y="212" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">→ Dropout</text><text x="734" y="236" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">→ ModuleList 中的各层</text><text x="734" y="260" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">（逐层实例化，参数独立）</text><text x="734" y="284" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">→ 输出 Linear</text><text x="38" y="362" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">batch_first=True：张量形状统一为 [B, L, D]；norm_first=False：Post-LN，与原始 Transformer 一致；堆栈末尾不额外加 LayerNorm。</text></svg>