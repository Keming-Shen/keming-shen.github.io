<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">生物神经元与人工神经元</title><desc id="desc">左侧为生物神经元：树突接收信号，细胞体整合，轴突传导并由末梢传出。右侧为人工神经元：输入 x1、x2、x3 分别乘以权重 w1、w2、w3，与偏置 b 求和后经激活函数 f 得到输出 y。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="430" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="47" font-size="25" fill="#293e4b" text-anchor="start" font-weight="650">生物神经元</text><text x="38" y="78" font-size="18" fill="#71838b" text-anchor="start" font-weight="400">信号经树突汇入，经轴突传出</text><text x="518" y="47" font-size="25" fill="#293e4b" text-anchor="start" font-weight="650">人工神经元</text><text x="518" y="78" font-size="18" fill="#71838b" text-anchor="start" font-weight="400">输入加权求和，再经激活函数输出</text><path d="M480 40V410" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M166 222C138 202 112 172 80 160" fill="none" stroke="#b9a98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 178C102 164 96 150 99 134" fill="none" stroke="#b9a98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M163 238C130 240 100 238 70 246" fill="none" stroke="#b9a98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 239C90 252 80 263 72 276" fill="none" stroke="#b9a98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M172 260C148 282 126 302 104 322" fill="none" stroke="#b9a98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 296C115 298 100 302 88 300" fill="none" stroke="#b9a98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><pat