<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="title desc"><title id="title">FlashAttention 的分块计算</title><desc id="desc">标准实现把 L×L 的分数矩阵和权重矩阵写回显存，额外显存为 O(L²)。FlashAttention 把 Q、K、V 分块载入片上 SRAM，用在线 softmax 逐块累积输出，额外显存为 O(L)。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="464" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">FlashAttention：分块计算，不在显存中存储 L × L 矩阵</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">精确的稠密注意力；优化的是显存读写，而不是运算量</text><rect x="38" y="92" width="420" height="300" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="248" y="123.6" font-size="16" fill="#a4604b" text-anchor="middle" font-weight="700">标准实现</text><rect x="68" y="142" width="100" height="46" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="118" y="160.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="650">Q, K, V</text><text x="118" y="181.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">HBM</text><rect x="200" y="142" width="110" height="46" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="255" y="160.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">S = QKᵀ</text><text x="255" y="181.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">写回 HBM [L, L]</text><rect x="200" y="212" width="110" height="46" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="255" y="230.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">A = softmax(S)</text><text x="255" y="251.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">写回 HBM [L, L]</text><rect x="200" y="282" width="110" height="46" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="255" y="309.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="650">O = AV</text><path d="M170 165L196 165" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M255 190L255 208" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M255 260L255 278" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="330" y="170" font-size="12" fill="#a4604b" text-anchor="start" font-weight="400">反复读写</text><text x="330" y="190" font-size="12" fill="#a4604b" text-anchor="start" font-weight="400">L² 的中间结果</text><text x="248" y="372.9" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="650">额外显存 O(L²)</text><rect x="492" y="92" width="430" height="300" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="707" y="123.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="700">FlashAttention</text><rect x="520" y="146" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="554" y="146" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="588" y="146" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="622" y="146" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="520" y="180" width="32" height="32" rx="3" fill="#94b79a" stroke="none"/><rect x="554" y="180" width="32" height="32" rx="3" fill="#94b79a" stroke="none"/><rect x="588" y="180" width="32" height="32" rx="3" fill="#d8c9a8" stroke="none"/><rect x="622" y="180" width="32" height="32" rx="3" fill="#c9dcc9" stroke="none"/><rect x="520" y="214" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="554" y="214" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="588" y="214" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="622" y="214" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="520" y="248" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="554" y="248" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="588" y="248" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><rect x="622" y="248" width="32" height="32" rx="3" fill="#e5ebe5" stroke="none"/><text x="588" y="303.9" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">Q 的一个块逐次读取</text><text x="588" y="319.9" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">K、V 的各个块</text><rect x="682" y="146" width="220" height="140" rx="8" fill="#fcfcfa" stroke="#6d9580"/><text x="694" y="170" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">1. 把 Qᵢ、Kⱼ、Vⱼ 载入片上 SRAM</text><text x="694" y="194" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">2. 计算块内分数</text><text x="694" y="218" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">3. 在线 softmax：维护行最大值</text><text x="694" y="242" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">   与分母，逐块更新输出</text><text x="694" y="266" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">4. 反向传播时按块重算</text><text x="707" y="372.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">额外显存 O(L)，运算量仍含 L²</text><text x="38" y="422" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">在现代 GPU 上，注意力的瓶颈往往是 HBM 与 SRAM 之间的数据搬运；结果与标准实现只差浮点运算顺序带来的微小误差。</text><text x="38" y="444" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">PyTorch 的 F.scaled_dot_product_attention 在条件满足时会自动选用这类内核。</text></svg>