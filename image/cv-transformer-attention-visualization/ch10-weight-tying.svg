<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="title desc"><title id="title">权重绑定</title><desc id="desc">同一个 [37000,512] 的矩阵 E 同时用作源端嵌入、目标端嵌入，以及输出层的投影 logits = h·Eᵀ。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="464" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">权重绑定：三处共享同一个矩阵 E</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">共享 BPE 词表时，源嵌入、目标嵌入与输出投影使用同一组参数</text><rect x="380" y="160" width="200" height="150" rx="12" fill="#f1f0e9" stroke="#8f7857" stroke-width="2"/><text x="480" y="221.2" font-size="32" fill="#8f7857" text-anchor="middle" font-weight="700">E</text><text x="480" y="254.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">[|V|, d] = [37000, 512]</text><text x="480" y="280.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">≈ 18.9M 参数</text><rect x="60" y="110" width="220" height="64" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="170" y="138.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">源端嵌入</text><text x="170" y="159.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">查表：E[source_ids]</text><rect x="60" y="296" width="220" height="64" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="170" y="324.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">目标端嵌入</text><text x="170" y="345.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">查表：E[target_ids]</text><rect x="680" y="200" width="240" height="70" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="800" y="231.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">输出投影</text><text x="800" y="252.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">logits = h · Eᵀ</text><path d="M282 142C330 142 340 200 376 210" fill="none" stroke="#9eb4c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><path d="M282 328C330 328 340 270 376 262" fill="none" stroke="#6d9580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M584 235H676" fill="none" stroke="#b9a98a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><rect x="38" y="382" width="884" height="62" rx="8" fill="#f6f7f4" stroke="none"/><text x="56" y="408" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">代码中写作 readout.weight = embedding.weight：两个模块引用同一个张量，梯度来自三处，累加到同一组参数上。</text><text x="56" y="432" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">直观上，“输入时代表某个 token 的向量”与“输出时用于给该 token 打分的向量”被约束为同一个。</text></svg>