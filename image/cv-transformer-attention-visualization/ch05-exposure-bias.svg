rker-end="url(#arrowR)"/><rect x="584" y="436" width="92" height="32" rx="7" fill="#f6ebe7" stroke="#c99787"/><text x="630" y="457.6" font-size="16" fill="#a4604b" text-anchor="middle" font-weight="500">爱</text><path d="M630 434L630 412" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="574" y="366" width="112" height="44" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="630" y="393.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="600">模型</text><rect x="584" y="322" width="92" height="32" rx="7" fill="#f6ebe7" stroke="#c99787"/><text x="630" y="343.6" font-size="16" fill="#a4604b" text-anchor="middle" font-weight="500">着</text><path d="M630 364L630 356" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M678 338C730 338 710 452 750 452" fill="none" stroke="#c99787" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowR)"/><rect x="749" y="436" width="92" height="32" rx="7" fill="#f6ebe7" stroke="#c99787"/><text x="795" y="457.6" font-size="16" fill="#a4604b" text-anchor="middle" font-weight="500">着</text><path d="M795 434L795 412" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="739" y="366" width="112" height="44" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="795" y="393.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="600">模型</text><rect x="749" y="322" width="92" height="32" rx="7" fill="#f6ebe7" stroke="#c99787"/><text x="795" y="343.6" font-size="16" fill="#a4604b" text-anchor="middle" font-weight="500">你</text><path d="M795 364L795 356" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="38" y="486" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">训练中第 2 步预测错为“爱”，但第 3 步仍读入正确的“喜欢”；推理时这个错误成为后续的输入，</text><text x="38" y="510" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">模型面对训练中从未见过的前缀，错误逐步累积（曝光偏差）。输出为示意。</text></svg>