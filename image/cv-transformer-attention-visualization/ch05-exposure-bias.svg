<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">teacher forcing 与自回归生成</title><desc id="desc">上方训练时，每一步的输入都是正确前缀，即使第二步预测错为“爱”，第三步仍读入“喜欢”。下方推理时，第二步的错误输出“爱”成为第三步的输入，后续预测随之偏离。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="530" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">训练与推理时的前缀来源</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">训练用正确答案作为前缀，推理用模型自己的输出</text><text x="38" y="180" font-size="17" fill="#293e4b" text-anchor="start" font-weight="650">训练：teacher forcing</text><text x="38" y="202" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">输入来自数据中的正确前缀</text><rect x="254" y="230" width="92" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="300" y="251.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weigh