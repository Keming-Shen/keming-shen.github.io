<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488" viewBox="0 0 960 488" role="img" aria-labelledby="title desc"><title id="title">Bahdanau 注意力的一步计算</title><desc id="desc">解码状态 s 与三个源状态分别打分，得到 −0.4、0.3、1.6；softmax 后权重约为 0.096、0.194、0.710；加权求和得到上下文向量 c = [−0.61, 1.10]。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="488" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">Bahdanau 注意力：解码一步的读取过程</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">打分 → softmax → 加权求和，每一步都重新计算</text><rect x="97" y="397" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="130" y="417.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">I</text><path d="M130 396L130 372" fill="none" stroke="#9eb4c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><rect x="80" y="316" width="100" height="52" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="130" y="339.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₁</text><text x="130" y="358.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">[1, 0]</text><rect x="267" y="397" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="300" y="417.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">like</text><path d="M300 396L300 372" fill="none" stroke="#9eb4c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><rect x="250" y="316" width="100" height="52" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="300" y="339.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₂</text><text x="300" y="358.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">[0, 2]</text><rect x="437" y="397" width="66" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="470" y="417.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">you</text><path d="M470 396L470 372" fill="none" stroke="#9eb4c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><rect x="420" y="316" width="100" height="52" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="470" y="339.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₃</text><text x="470" y="358.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">[−1, 1]</text><rect x="660" y="300" width="200" height="70" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="760" y="331.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">解码状态 s</text><text x="760" y="354.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">当前要生成“喜欢”</text><path d="M660 330C600 330 190 300 160 314" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="86" y="236" width="88" height="40" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="130" y="260.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">a₁ = −0.4</text><path d="M130 312L130 280" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="86" y="166" width="88" height="40" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="130" y="190.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">α = 0.096</text><path d="M130 232L130 210" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M130 162L300 132" fill="none" stroke="#6d9580" stroke-width="1.480639420857506" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/><path d="M660 330C600 330 360 300 330 314" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="256" y="236" width="88" height="40" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="300" y="260.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">a₂ = 0.3</text><path d="M300 312L300 280" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="256" y="166" width="88" height="40" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="300" y="190.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">α = 0.194</text><path d="M300 232L300 210" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 162L300 132" fill="none" stroke="#6d9580" stroke-width="1.9678889350688442" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/><path d="M660 330C600 330 530 300 500 314" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="426" y="236" width="88" height="40" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="470" y="260.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">a₃ = 1.6</text><path d="M470 312L470 280" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="426" y="166" width="88" height="40" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="470" y="190.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">α = 0.710</text><path d="M470 232L470 210" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470 162L300 132" fill="none" stroke="#6d9580" stroke-width="4.551471644073649" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/><text x="560" y="262" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">① score(s, hⱼ) 打分</text><text x="560" y="192" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">② softmax 归一化</text><rect x="210" y="92" width="180" height="40" rx="10" fill="#edf3ed" stroke="#3d7058" stroke-width="2"/><text x="300" y="117.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="700">c = [−0.61, 1.10]</text><text x="410" y="118" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">③ c = Σ αⱼ hⱼ，送入解码器计算输出</text><text x="38" y="466" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">线宽与权重成正比。打分函数为加性形式 vᵀ tanh(sW + hⱼU)；这里直接给出分数，数值为示意。</text></svg>