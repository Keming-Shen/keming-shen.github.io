<svg xmlns="http://www.w3.org/2000/svg" width="960" height="478" viewBox="0 0 960 478" role="img" aria-labelledby="title desc"><title id="title">贪心解码与束搜索</title><desc id="desc">首词“我”概率 0.6、“你”概率 0.4。“我”之后最好的是“喜欢”0.5，累计 0.30；“你”之后最好的是“好”0.9，累计 0.36。贪心解码选择 0.30 的路径，束宽为 2 的束搜索保留两条路径并选出 0.36 的路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="478" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">贪心解码与束搜索（束宽 k = 2）</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">局部最优的第一步不一定通向概率最高的整句</text><rect x="50" y="212" width="80" height="36" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="90" y="235.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><path d="M130 222L250 150" fill="none" stroke="#b9a98a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="180" y="177.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">0.6</text><rect x="250" y="132" width="80" height="36" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="290" y="155.9" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="500">我</text><text x="290" y="186.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">累计 0.6</text><path d="M130 238L250 310" fill="none" stroke="#6d9580" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><text x="180" y="303.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">0.4</text><rect x="250" y="292" width="80" height="36" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="290" y="315.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="500">你</text><text x="290" y="346.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="600">累计 0.4</text><path d="M332 142L490 100" fill="none" stroke="#b9a98a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="411" y="117.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">0.5</text><rect x="490" y="82" width="80" height="36" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="530" y="106" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="500">喜欢</text><text x="530" y="136.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="600">0.6 × 0.5 = 0.30</text><path d="M332 158L490 190" fill="none" stroke="#c9d0d3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="411" y="170.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.3</text><rect x="490" y="172" width="80" height="36" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="530" y="195.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">爱</text><text x="530" y="226.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="600">0.18</text><path d="M332 316L490 310" fill="none" stroke="#6d9580" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><text x="411" y="309.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">0.9</text><rect x="490" y="292" width="80" height="36" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="530" y="315.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="500">好</text><text x="530" y="346.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="600">0.4 × 0.9 = 0.36</text><path d="M332 326L490 392" fill="none" stroke="#c9d0d3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="411" y="355.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">0.1</text><rect x="490" y="374" width="80" height="36" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="530" y="397.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">…</text><text x="530" y="428.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="600">0.04</text><rect x="640" y="76" width="282" height="120" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="656" y="104" font-size="16" fill="#8f7857" text-anchor="start" font-weight="650">贪心解码</text><text x="656" y="132" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">每步只保留 1 条：先选“我”</text><text x="656" y="156" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">最终得到“我喜欢”，概率 0.30</text><text x="656" y="180" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">“你”在第一步就被丢弃</text><rect x="640" y="214" width="282" height="146" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="656" y="242" font-size="16" fill="#3d7058" text-anchor="start" font-weight="650">束搜索（k = 2）</text><text x="656" y="270" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">第 1 步保留“我”“你”两条</text><text x="656" y="294" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">第 2 步在 4 个扩展中保留</text><text x="656" y="316" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">0.36 与 0.30 两条</text><text x="656" y="342" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">最终选出“你好”，概率 0.36</text><text x="38" y="456" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">两条路径随后都以概率 1 输出 &lt;eos&gt;。实际实现在对数空间中累加 log p，以避免连乘下溢。</text></svg>