<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img" aria-labelledby="title desc"><title id="title">逐位置前馈网络</title><desc id="desc">FFN 把每个位置的 512 维向量扩展到 2048 维，经 ReLU 后再收窄回 512 维。每个编码器层中 FFN 约占三分之二的参数，注意力约占三分之一。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="474" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">逐位置前馈网络：先扩宽、再收窄</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">原始基础模型：512 → 2048 → 512，所有位置共享参数</text><rect x="80" y="205" width="46" height="90" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="103" y="319.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">512</text><rect x="300" y="120" width="46" height="260" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="323" y="404.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="650">2048</text><rect x="520" y="205" width="46" height="90" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="543" y="319.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">512</text><path d="M128 205L298 126M128 295L298 374" fill="none" stroke="#c9d0d3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M348 126L518 205M348 374L518 295" fill="none" stroke="#c9d0d3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="213" y="244.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="650">W₁：512 × 2048</text><text x="433" y="244.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="650">W₂：2048 × 512</text><text x="323" y="114.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">ReLU</text><text x="103" y="424.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">z</text><text x="323" y="424.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">ReLU(zW₁ + b₁)</text><text x="543" y="424.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">FFN(z)</text><path d="M780 240L780 140A100 100 0 1 1 693.4 290.0Z" fill="#d8c9a8"/><path d="M780 240L693.4 290.0A100 100 0 0 1 780 140Z" fill="#c4d6df"/><text x="814" y="255.3" font-size="15" fill="#fcfcfa" text-anchor="middle" font-weight="700">FFN 67%</text><text x="734" y="210.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">注意力 33%</text><text x="780" y="370.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">每个编码器层的参数分布（忽略偏置）</text><text x="780" y="390.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">8d² ≈ 2.10M vs 4d² ≈ 1.05M</text><text x="38" y="452" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">FFN 自身不读取其他位置；注意力负责跨位置混合信息，FFN 负责在每个位置内部做非线性变换。</text></svg>