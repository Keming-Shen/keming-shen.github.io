<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="title desc"><title id="title">三项行为测试</title><desc id="desc">因果性：修改较晚位置的输入，较早位置的 logits 不变。源填充不变性：在源序列末尾追加填充，目标 logits 不变。保存与载入：重新构造并载入后，同一输入的 logits 不变。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="452" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">三项行为测试：不依赖训练效果的正确性检查</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">均在 eval() 模式下进行，以排除 Dropout 的随机性；本次运行全部通过</text><rect x="38" y="90" width="284" height="316" rx="12" fill="#e8eff5" stroke="#9eb4c4"/><text x="180" y="121.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="700">① 因果性</text><text x="56" y="152" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">前缀 A：&lt;bos&gt; 我 喜欢 你</text><text x="56" y="174" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">前缀 B：&lt;bos&gt; 我 喜欢 他</text><rect x="74" y="200" width="48" height="30" rx="5" fill="#e8eff5" stroke="#9eb4c4"/><text x="98" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">t=1</text><rect x="126" y="200" width="48" height="30" rx="5" fill="#e8eff5" stroke="#9eb4c4"/><text x="150" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">t=2</text><rect x="178" y="200" width="48" height="30" rx="5" fill="#e8eff5" stroke="#9eb4c4"/><text x="202" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">t=3</text><rect x="230" y="200" width="48" height="30" rx="5" fill="#e8e0cf" stroke="#8f7857"/><text x="254" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">t=4</text><text x="56" y="256" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">只改最后一个位置</text><text x="56" y="290" font-size="13" fill="#4a6a80" text-anchor="start" font-weight="650">前 3 个位置的 logits</text><text x="56" y="312" font-size="13" fill="#4a6a80" text-anchor="start" font-weight="650">必须完全不变</text><text x="180" y="390.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">检测：因果掩码缺失或方向写反</text><rect x="342" y="90" width="284" height="316" rx="12" fill="#edf3ed" stroke="#6d9580"/><text x="484" y="121.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="700">② 源填充不变性</text><text x="360" y="152" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">源 A：we help you</text><text x="360" y="174" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">源 B：we help you &lt;pad&gt; &lt;pad&gt;</text><rect x="378" y="200" width="40" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="402" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">we</text><rect x="430" y="200" width="40" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="454" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">help</text><rect x="482" y="200" width="40" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="506" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">you</text><rect x="534" y="200" width="40" height="30" rx="5" fill="#e8e0cf" stroke="#8f7857"/><text x="558" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">pad</text><rect x="586" y="200" width="40" height="30" rx="5" fill="#e8e0cf" stroke="#8f7857"/><text x="610" y="219.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="600">pad</text><text x="360" y="256" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">只在末尾追加填充</text><text x="360" y="290" font-size="13" fill="#3d7058" text-anchor="start" font-weight="650">所有目标位置的 logits</text><text x="360" y="312" font-size="13" fill="#3d7058" text-anchor="start" font-weight="650">在浮点误差内相同</text><text x="484" y="390.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">检测：编码器或交叉注意力漏掉源填充掩码</text><rect x="646" y="90" width="284" height="316" rx="12" fill="#f1f0e9" stroke="#b9a98a"/><text x="788" y="121.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="700">③ 保存与载入</text><rect x="688" y="150" width="200" height="40" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="788" y="174.2" font-size="12" fill="#8a979d" text-anchor="middle" font-weight="650">保存参数 + 配置 + 两个词表</text><path d="M788 192L788 210" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="688" y="214" width="200" height="40" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="788" y="238.2" font-size="12" fill="#8a979d" text-anchor="middle" font-weight="650">重新构造模型并载入</text><text x="664" y="290" font-size="13" fill="#8f7857" text-anchor="start" font-weight="650">同一输入的 logits</text><text x="664" y="312" font-size="13" fill="#8f7857" text-anchor="start" font-weight="650">与保存前一致</text><text x="788" y="390.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">检测：配置或词表未保存、载入错位</text><text x="38" y="432" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">准确率高并不能证明实现正确：偷看了答案的模型在 teacher forcing 下同样能达到 100%。这类测试成本很低，适合作为回归测试。</text></svg>