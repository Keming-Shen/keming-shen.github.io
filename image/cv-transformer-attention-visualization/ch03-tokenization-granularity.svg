<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">三种分词粒度的对比</title><desc id="desc">unhappiness 在词级下是 1 个 token，在字符级下是 11 个，在子词级下是 un、happi、ness 共 3 个。没见过的 unhappier 在词级下只能变为 &lt;unk&gt;，在子词级下可以切成 un、happi、er。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="470" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">三种分词粒度</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">同一个词在不同粒度下得到的 token 序列</text><text x="330" y="114" font-size="17" fill="#293e4b" text-anchor="middle" font-weight="650">训练时见过的词：unhappiness</text><text x="770" y="114" font-size="17" fill="#293e4b" text-anchor="middle" font-weight="650">训练时没见过的词：unhappier</text><text x="38" y="162" font-size="19" fill="#293e4b" text-anchor="start" font-weight="650">词级</text><text x="38" y="184" font-size="14" fill="#9aa7ad" text-anchor="start" font-weight="400">word</text><rect x="140" y="144" width="128.5" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="204.23" y="165.9" font-size="17" fill="#4a6a80" text-anchor="middle" font-weight="500">unhappiness</text><rect x="590" y="144" width="69.3" height="32" rx="7" fill="#f6ebe7" stroke="#c99787"/><text x="624.65" y="165.9" font-size="17" fill="#a4604b" text-anchor="middle" font-weight="500">&lt;unk&gt;</text><text x="140" y="200" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">1 个 token</text><text x="590" y="200" font-size="14" fill="#a4604b" text-anchor="start" font-weight="400">1 个 token，原词信息丢失</text><path d="M38 218L922 218" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="254" font-size="19" fill="#293e4b" text-anchor="start" font-weight="650">字符级</text><text x="38" y="276" font-size="14" fill="#9aa7ad" text-anchor="start" font-weight="400">character</text><rect x="140" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="152" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">u</text><rect x="168" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="180" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">n</text><rect x="196" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="208" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">h</text><rect x="224" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="236" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">a</text><rect x="252" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="264" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">p</text><rect x="280" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="292" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">p</text><rect x="308" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="320" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">i</text><rect x="336" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="348" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">n</text><rect x="364" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="376" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">e</text><rect x="392" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="404" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">s</text><rect x="420" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="432" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">s</text><rect x="590" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="602" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">u</text><rect x="618" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="630" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">n</text><rect x="646" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="658" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">h</text><rect x="674" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="686" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">a</text><rect x="702" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="714" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">p</text><rect x="730" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="742" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">p</text><rect x="758" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="770" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">i</text><rect x="786" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="798" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">e</text><rect x="814" y="236" width="24" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="826" y="257.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">r</text><text x="140" y="292" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">11 个 token</text><text x="590" y="292" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">9 个 token</text><path d="M38 310L922 310" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="346" font-size="19" fill="#293e4b" text-anchor="start" font-weight="650">子词级</text><text x="38" y="368" font-size="14" fill="#9aa7ad" text-anchor="start" font-weight="400">subword</text><rect x="140" y="328" width="39.7" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="159.86" y="349.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="500">un</text><rect x="187.7" y="328" width="69.3" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="222.37" y="349.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="500">happi</text><rect x="265" y="328" width="59.4" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="294.74" y="349.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="500">ness</text><rect x="590" y="328" width="39.7" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="609.86" y="349.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="500">un</text><rect x="637.7" y="328" width="69.3" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="672.37" y="349.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="500">happi</text><rect x="715" y="328" width="39.7" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="734.88" y="349.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="500">er</text><text x="140" y="384" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">3 个 token</text><text x="590" y="384" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">3 个 token</text><text x="38" y="448" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">子词级在词表大小、序列长度与未登录词之间折中：新词可以由已有片段组合得到。切分结果为示意，实际边界由分词器决定。</text></svg>