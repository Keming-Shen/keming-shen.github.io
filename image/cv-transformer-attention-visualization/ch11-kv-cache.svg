<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">KV 缓存</title><desc id="desc">无缓存时，生成第 4 个 token 需要为全部 4 个位置重新计算 Q、K、V。有缓存时，前 3 个位置的 K、V 从缓存读取，只为新位置计算 q、k、v，并把 k、v 追加进缓存。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="480" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">KV 缓存：每步只为新位置计算 K、V</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">以第 4 步为例：前缀已有 3 个位置，新 token 为“你”</text><rect x="38" y="92" width="420" height="290" rx="10" fill="#f6f7f4" stroke="none"/><text x="248" y="123.3" font-size="15" fill="#a4604b" text-anchor="middle" font-weight="650">无缓存：每步重算整个前缀</text><rect x="55" y="135" width="70" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="90" y="154.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><rect x="150" y="135" width="120" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="210" y="154.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">计算 Q, K, V</text><rect x="55" y="185" width="70" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="90" y="204.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">我</text><rect x="150" y="185" width="120" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="210" y="204.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">计算 Q, K, V</text><rect x="55" y="235" width="70" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="90" y="254.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">喜欢</text><rect x="150" y="235" width="120" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="210" y="254.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">计算 Q, K, V</text><rect x="55" y="285" width="70" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="90" y="304.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">你</text><rect x="150" y="285" width="120" height="30" rx="5" fill="#f6ebe7" stroke="#c99787"/><text x="210" y="304.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">计算 Q, K, V</text><text x="248" y="366.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">第 t 步重复计算 t 个位置</text><rect x="492" y="92" width="430" height="290" rx="10" fill="#f6f7f4" stroke="none"/><text x="707" y="123.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">有缓存：只算新位置，读取历史 K、V</text><rect x="505" y="135" width="70" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="540" y="154.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><rect x="600" y="135" width="120" height="30" rx="5" fill="#f1f0e9" stroke="#b9a98a"/><text x="660" y="154.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="600">缓存中的 K, V</text><rect x="505" y="185" width="70" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="540" y="204.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">我</text><rect x="600" y="185" width="120" height="30" rx="5" fill="#f1f0e9" stroke="#b9a98a"/><text x="660" y="204.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="600">缓存中的 K, V</text><rect x="505" y="235" width="70" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="540" y="254.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">喜欢</text><rect x="600" y="235" width="120" height="30" rx="5" fill="#f1f0e9" stroke="#b9a98a"/><text x="660" y="254.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="600">缓存中的 K, V</text><rect x="505" y="285" width="70" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="540" y="304.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">你</text><rect x="600" y="285" width="120" height="30" rx="5" fill="#edf3ed" stroke="#6d9580"/><text x="660" y="304.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="650">新算 q, k, v</text><rect x="740" y="140" width="160" height="176" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="820" y="170.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="650">注意力</text><text x="820" y="200.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">q × [K_cache; k]ᵀ</text><text x="820" y="226.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">→ 权重 [1, 4]</text><text x="820" y="252.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">× [V_cache; v]</text><text x="820" y="278.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">k、v 追加进缓存</text><path d="M722 300H736" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M722 200H736" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="707" y="366.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">每层缓存约 2·B·T·D 个元素</text><rect x="38" y="398" width="884" height="62" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="56" y="424" font-size="14" fill="#8f7857" text-anchor="start" font-weight="400">MQA 让所有头共享一组 K、V；GQA 让每组头共享一组 K、V，在质量与缓存大小之间折中。</text><text x="56" y="446" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">实现时注意：单个查询的掩码形状是 [1, T]，不能照搬训练时的方阵下三角；束搜索时缓存需要随候选重新排列。</text></svg>