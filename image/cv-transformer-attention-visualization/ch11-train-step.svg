<svg xmlns="http://www.w3.org/2000/svg" width="960" height="406" viewBox="0 0 960 406" role="img" aria-labelledby="title desc"><title id="title">训练步流程</title><desc id="desc">一个训练步依次为清空梯度、目标右移、前向计算、带 ignore_index 的交叉熵、反向传播、梯度裁剪（阈值 1.0）与 Adam 更新。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="406" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">一个训练步</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">数据 → 右移 → 前向 → 有效 token 交叉熵 → 反向 → 裁剪 → 更新</text><rect x="38" y="110" width="118" height="66" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="97" y="138.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="650">zero_grad</text><text x="97" y="159.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">清空梯度</text><path d="M157 143L165 143" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="166" y="110" width="118" height="66" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="225" y="138.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">右移</text><text x="225" y="159.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">prefix, labels</text><path d="M285 143L293 143" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="294" y="110" width="118" height="66" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="353" y="138.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">model(src, prefix)</text><text x="353" y="159.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">[B, T, 12]</text><path d="M413 143L421 143" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="422" y="110" width="118" height="66" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="481" y="138.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="650">CrossEntropy</text><text x="481" y="159.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">ignore_index=PAD</text><path d="M541 143L549 143" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="550" y="110" width="118" height="66" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="609" y="138.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">backward</text><text x="609" y="159.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">求梯度</text><path d="M669 143L677 143" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="678" y="110" width="118" height="66" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="737" y="138.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">clip_grad_norm_</text><text x="737" y="159.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">阈值 1.0</text><path d="M797 143L805 143" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="806" y="110" width="118" height="66" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="865" y="138.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">optimizer.step</text><text x="865" y="159.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">Adam, lr 0.003</text><rect x="38" y="208" width="420" height="176" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="56" y="236" font-size="15" fill="#a4604b" text-anchor="start" font-weight="650">梯度裁剪</text><text x="56" y="262" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">把全部参数的梯度拼成一个向量 g：</text><text x="56" y="286" font-size="14" fill="#a4604b" text-anchor="start" font-weight="650">若 ‖g‖ &gt; 1.0，则 g ← g · 1.0 / ‖g‖</text><text x="56" y="312" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">方向不变，只缩小整体幅度，</text><text x="56" y="334" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">防止个别批次的大梯度破坏训练。</text><rect x="478" y="208" width="444" height="176" rx="10" fill="#f6f7f4" stroke="none"/><text x="496" y="236" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">与原论文设置的差异</text><text x="496" y="266" font-size="13" fill="#5c747d" text-anchor="start" font-weight="650">学习率</text><text x="580" y="266" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">固定 0.003（无预热调度）</text><text x="496" y="292" font-size="13" fill="#5c747d" text-anchor="start" font-weight="650">标签平滑</text><text x="580" y="292" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">不使用</text><text x="496" y="318" font-size="13" fill="#5c747d" text-anchor="start" font-weight="650">模型规模</text><text x="580" y="318" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">1 + 1 层，d = 32</text><text x="496" y="344" font-size="13" fill="#5c747d" text-anchor="start" font-weight="650">理由</text><text x="580" y="344" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">小任务上已足够，便于排查问题</text></svg>