<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="title desc"><title id="title">Base 模型的参数构成</title><desc id="desc">按公式估算：编码器约 18.9M，解码器约 25.2M，共享嵌入约 18.9M，合计约 63.1M，与论文报告的约 65M 接近。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="424" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">Base 模型的参数构成（按公式估算）</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">d = 512，d_ff = 2048，N = 6，共享词表 |V| ≈ 37000，三处嵌入权重绑定</text><rect x="60" y="110" width="248.9" height="56" rx="6" fill="#91b1c0" stroke="none"/><text x="185.93045906109992" y="143.3" font-size="15" fill="#fcfcfa" text-anchor="middle" font-weight="700">18.9M</text><text x="185.93045906109992" y="194.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="650">编码器（6 层）</text><rect x="311.9" y="110" width="332.9" height="56" rx="6" fill="#94b79a" stroke="none"/><text x="479.80228556587235" y="143.3" font-size="15" fill="#fcfcfa" text-anchor="middle" font-weight="700">25.2M</text><text x="479.80228556587235" y="194.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">解码器（6 层）</text><rect x="647.7" y="110" width="249.3" height="56" rx="6" fill="#d8c9a8" stroke="none"/><text x="773.8718265047723" y="143.3" font-size="15" fill="#fcfcfa" text-anchor="middle" font-weight="700">18.9M</text><text x="773.8718265047723" y="194.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">共享嵌入 / 输出投影</text><text x="60" y="236" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">自注意力（每个）</text><text x="300" y="236" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">4(d² + d)</text><text x="620" y="236" font-size="14" fill="#293e4b" text-anchor="end" font-weight="650">1,050,624</text><text x="60" y="268" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">FFN（每个）</text><text x="300" y="268" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">2·d·d_ff + d_ff + d</text><text x="620" y="268" font-size="14" fill="#293e4b" text-anchor="end" font-weight="650">2,099,712</text><text x="60" y="300" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">LayerNorm（每个）</text><text x="300" y="300" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">2d</text><text x="620" y="300" font-size="14" fill="#293e4b" text-anchor="end" font-weight="650">512</text><text x="60" y="332" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">编码器层</text><text x="300" y="332" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">1 注意力 + 1 FFN + 2 LN</text><text x="620" y="332" font-size="14" fill="#293e4b" text-anchor="end" font-weight="650">3,152,384</text><text x="60" y="364" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">解码器层</text><text x="300" y="364" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">2 注意力 + 1 FFN + 3 LN</text><text x="620" y="364" font-size="14" fill="#293e4b" text-anchor="end" font-weight="650">4,204,032</text><rect x="660" y="220" width="262" height="150" rx="8" fill="#f6f7f4" stroke="none"/><text x="676" y="248" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">合计</text><text x="676" y="280" font-size="24" fill="#3d7058" text-anchor="start" font-weight="700">≈ 63.1M</text><text x="676" y="312" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">论文报告约 65M</text><text x="676" y="336" font-size="12" fill="#9aa7ad" text-anchor="start" font-weight="400">差异来自词表大小的近似</text><text x="38" y="402" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">若三处嵌入不共享，仅嵌入就要再多出约 38M 参数；权重绑定因此显著减小了模型。</text></svg>