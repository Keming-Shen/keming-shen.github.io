<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" role="img" aria-labelledby="title desc"><title id="title">三种注意力的掩码</title><desc id="desc">编码器自注意力 4×4，屏蔽源端填充列；解码器自注意力 3×3，屏蔽上三角；交叉注意力 3×4，屏蔽源端填充列。下方列出三类常见错误。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="446" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">三种注意力分别需要哪些掩码</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">B = 1，S = 4（最后一个为 &lt;pad&gt;），T = 3；PyTorch Transformer 层中 True = 屏蔽</text><text x="80" y="106" font-size="15" fill="#4a6a80" text-anchor="start" font-weight="650">编码器自注意力</text><text x="80" y="126" font-size="12" fill="#9aa7ad" text-anchor="start" font-weight="400">src_key_padding_mask</text><text x="101" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">i</text><text x="145" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">like</text><text x="189" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">you</text><text x="233" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">&lt;pad&gt;</text><text x="74" y="178" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">i</text><text x="74" y="208" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">like</text><text x="74" y="238" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">you</text><text x="74" y="268" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">&lt;pad&gt;</text><rect x="80" y="160" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="124" y="160" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="168" y="160" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="212" y="160" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="233" y="177.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="80" y="190" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="124" y="190" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="168" y="190" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="212" y="190" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="233" y="207.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="80" y="220" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="124" y="220" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="168" y="220" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="212" y="220" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="233" y="237.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="80" y="250" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="124" y="250" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="168" y="250" width="42" height="28" rx="3" fill="#e8eff5" stroke="none"/><rect x="212" y="250" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="233" y="267.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><text x="390" y="106" font-size="15" fill="#3d7058" text-anchor="start" font-weight="650">解码器自注意力</text><text x="390" y="126" font-size="12" fill="#9aa7ad" text-anchor="start" font-weight="400">tgt_mask（+ tgt_key_padding_mask）</text><text x="411" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">&lt;bos&gt;</text><text x="455" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">我</text><text x="499" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">喜欢</text><text x="384" y="178" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">&lt;bos&gt;</text><text x="384" y="208" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">我</text><text x="384" y="238" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">喜欢</text><rect x="390" y="160" width="42" height="28" rx="3" fill="#edf3ed" stroke="none"/><rect x="434" y="160" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="455" y="177.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="478" y="160" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="499" y="177.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="390" y="190" width="42" height="28" rx="3" fill="#edf3ed" stroke="none"/><rect x="434" y="190" width="42" height="28" rx="3" fill="#edf3ed" stroke="none"/><rect x="478" y="190" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="499" y="207.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="390" y="220" width="42" height="28" rx="3" fill="#edf3ed" stroke="none"/><rect x="434" y="220" width="42" height="28" rx="3" fill="#edf3ed" stroke="none"/><rect x="478" y="220" width="42" height="28" rx="3" fill="#edf3ed" stroke="none"/><text x="650" y="106" font-size="15" fill="#8f7857" text-anchor="start" font-weight="650">交叉注意力</text><text x="650" y="126" font-size="12" fill="#9aa7ad" text-anchor="start" font-weight="400">memory_key_padding_mask</text><text x="671" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">i</text><text x="715" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">like</text><text x="759" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">you</text><text x="803" y="149.8" font-size="11" fill="#5c747d" text-anchor="middle" font-weight="400">&lt;pad&gt;</text><text x="644" y="178" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">&lt;bos&gt;</text><text x="644" y="208" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">我</text><text x="644" y="238" font-size="11" fill="#5c747d" text-anchor="end" font-weight="400">喜欢</text><rect x="650" y="160" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="694" y="160" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="738" y="160" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="782" y="160" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="803" y="177.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="650" y="190" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="694" y="190" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="738" y="190" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="782" y="190" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="803" y="207.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="650" y="220" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="694" y="220" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="738" y="220" width="42" height="28" rx="3" fill="#f1f0e9" stroke="none"/><rect x="782" y="220" width="42" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="803" y="237.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">屏蔽</text><rect x="38" y="316" width="884" height="110" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="56" y="342" font-size="15" fill="#a4604b" text-anchor="start" font-weight="650">常见错误</text><text x="56" y="366" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">· 交叉注意力漏传 memory_key_padding_mask，或误传目标侧的填充掩码：它的键值来自源端。</text><text x="56" y="386" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">· 换用 F.scaled_dot_product_attention 时忘记取反：该函数中 attn_mask = True 表示“允许”。</text><text x="56" y="406" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">· 评估时直接调用 scaled_dot_product_attention 却未设 dropout_p = 0.0：它不感知 model.eval()。</text></svg>