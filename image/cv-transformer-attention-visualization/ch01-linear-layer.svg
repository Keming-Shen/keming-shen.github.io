<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">线性层的全连接计算</title><desc id="desc">两个输入 x1=2、x2=−1 通过六条带权重的连线连接到三个输出。a1=1·2+0.5·(−1)+0=1.5，a2=−1·2+1·(−1)+0.5=−2.5，a3=0.5·2−1·(−1)+1=3。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="410" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="25" fill="#293e4b" text-anchor="start" font-weight="650">线性层（2 → 3）</text><text x="38" y="75" font-size="18" fill="#71838b" text-anchor="start" font-weight="400">每条连线是一个权重，每个输出是一组加权和</text><path d="M194 190L532 135" fill="none" stroke="#6d9580" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M194 190L532 245" fill="none" stroke="#b0735e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M194 190L532 355" fill="none" stroke="#6d9580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M194 300L532 135" fill="none" stroke="#6d9580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M194 300L532 245" fill="none" stroke="#6d9580" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><path d="M194 300L532 355" fill="none" stroke="#b0735e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/><rect x="256" y="164.25" width="44" height="22" rx="5" fill="#fcfcfa" stroke="none"/><text x="278" y="182.25" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="600">1</text><rect x="256" y="191.75" width="44" height="22" rx="5" fill="#fcfcfa" stroke="none"/><text x="278" y="209.75" font-size="16" fill="#b0735e" text-anchor="middle" font-weight="600">−1</text><rect x="256" y="219.25" width="44" height="22" rx="5" fill="#fcfcfa" stroke="none"/><text x="278" y="237.25" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="600">0.5</text><rect x="256" y="246.75" width="44" height="22" rx="5" fill="#fcfcfa" stroke="none"/><text x="278" y="264.75" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="600">0.5</text><rect x="256" y="274.25" width="44" height="22" rx="5" fill="#fcfcfa" stroke="none"/><text x="278" y="292.25" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="600">1</text><rect x="256" y="301.75" width="44" height="22" rx="5" fill="#fcfcfa" stroke="none"/><text x="278" y="319.75" font-size="16" fill="#b0735e" text-anchor="middle" font-weight="600">−1</text><circle cx="170" cy="190" r="24" fill="#e8eff5" stroke="#9eb4c4" stroke-width="2"/><text x="170" y="198" font-size="22" fill="#4a6a80" text-anchor="middle" font-weight="600">2</text><text x="120" y="198" font-size="22" fill="#71838b" text-anchor="middle" font-weight="400">x₁</text><circle cx="170" cy="300" r="24" fill="#e8eff5" stroke="#9eb4c4" stroke-width="2"/><text x="170" y="308" font-size="22" fill="#4a6a80" text-anchor="middle" font-weight="600">−1</text><text x="120" y="308" font-size="22" fill="#71838b" text-anchor="middle" font-weight="400">x₂</text><circle cx="556" cy="135" r="26" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="556" y="143" font-size="22" fill="#3d7058" text-anchor="middle" font-weight="600">a₁</text><text x="600" y="142" font-size="19" fill="#5c747d" text-anchor="start" font-weight="400">= 1·2 + 0.5·(−1) + 0</text><text x="890" y="142" font-size="21" fill="#293e4b" text-anchor="end" font-weight="650">= 1.5</text><circle cx="556" cy="245" r="26" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="556" y="253" font-size="22" fill="#3d7058" text-anchor="middle" font-weight="600">a₂</text><text x="600" y="252" font-size="19" fill="#5c747d" text-anchor="start" font-weight="400">= −1·2 + 1·(−1) + 0.5</text><text x="890" y="252" font-size="21" fill="#293e4b" text-anchor="end" font-weight="650">= −2.5</text><circle cx="556" cy="355" r="26" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="556" y="363" font-size="22" fill="#3d7058" text-anchor="middle" font-weight="600">a₃</text><text x="600" y="362" font-size="19" fill="#5c747d" text-anchor="start" font-weight="400">= 0.5·2 − 1·(−1) + 1</text><text x="890" y="362" font-size="21" fill="#293e4b" text-anchor="end" font-weight="650">= 3</text><rect x="38" y="388" width="14" height="4" rx="2" fill="#6d9580" stroke="none"/><text x="60" y="395" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">正权重</text><rect x="128" y="388" width="14" height="4" rx="2" fill="#b0735e" stroke="none"/><text x="150" y="395" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">负权重</text><text x="222" y="395" font-size="15" fill="#9aa7ad" text-anchor="start" font-weight="400">线宽表示权重绝对值</text></svg>