<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="title desc"><title id="title">注意力矩阵的显存随长度增长</title><desc id="desc">批量 8、8 个头、float32 时，单层注意力权重矩阵在 L=512、1024、2048、4096、8192 时分别约为 64 MiB、256 MiB、1 GiB、4 GiB、16 GiB。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="468" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">显式存储注意力矩阵的显存</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">B = 8，h = 8，float32；只计单层的权重矩阵，不含梯度与其他激活</text><rect x="110" y="110" width="520" height="260" rx="6" fill="#f6f7f4" stroke="none"/><rect x="126" y="248.7" width="72" height="121.3" rx="5" fill="#d9a797" stroke="none"/><text x="162" y="241.3" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">64 MiB</text><text x="162" y="394.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">512</text><rect x="230" y="214" width="72" height="156" rx="5" fill="#d8c9a8" stroke="none"/><text x="266" y="206.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">256 MiB</text><text x="266" y="394.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">1024</text><rect x="334" y="179.3" width="72" height="190.7" rx="5" fill="#d9a797" stroke="none"/><text x="370" y="171.9" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">1.0 GiB</text><text x="370" y="394.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">2048</text><rect x="438" y="144.7" width="72" height="225.3" rx="5" fill="#d9a797" stroke="none"/><text x="474" y="137.3" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">4.0 GiB</text><text x="474" y="394.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">4096</text><rect x="542" y="110" width="72" height="260" rx="5" fill="#d9a797" stroke="none"/><text x="578" y="102.5" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">16 GiB</text><text x="578" y="394.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">8192</text><text x="370" y="418.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">序列长度 L（每增加一倍，显存 × 4）</text><rect x="660" y="110" width="262" height="260" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="676" y="138" font-size="13" fill="#4a6a80" text-anchor="start" font-weight="650">常用缓解手段</text><text x="676" y="164" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">按长度分桶：减少填充</text><text x="676" y="190" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">混合精度：fp16 / bf16</text><text x="676" y="216" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">激活重计算：以算换存</text><text x="676" y="242" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">FlashAttention：不存 L²</text><text x="676" y="268" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400"></text><text x="676" y="294" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">测性能时区分吞吐量、</text><text x="676" y="320" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">峰值显存与初始化开销；</text><text x="676" y="346" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">GPU 计时前先同步设备。</text><text x="38" y="446" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">L = 1024 时（棕色）为正文中的例子：67,108,864 个元素，单个 float32 张量 256 MiB。纵轴为对数刻度。</text></svg>