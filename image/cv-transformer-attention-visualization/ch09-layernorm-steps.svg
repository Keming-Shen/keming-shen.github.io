<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">LayerNorm 的计算步骤</title><desc id="desc">残差和 r 的四个分量减去均值 0.7321，再除以 0.4340，得到 −1.4770、1.0223、0.8060、−0.3513；最后乘以 γ、加上 β。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="430" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">LayerNorm 的计算步骤（第 3 个位置）</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">对单个位置的 4 个特征统计均值与方差；γ = 1，β = 0</text><rect x="38" y="92" width="210" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="143" y="121.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">① 残差和 r</text><text x="143" y="142.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">x + MHA(x)</text><path d="M54 245L232 245" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="240.4" width="32" height="4.6" rx="3" fill="#91b1c0" stroke="none"/><text x="76" y="234.3" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="650">0.091</text><rect x="104.5" y="186.2" width="32" height="58.8" rx="3" fill="#91b1c0" stroke="none"/><text x="120.5" y="180" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="650">1.176</text><rect x="149" y="190.9" width="32" height="54.1" rx="3" fill="#91b1c0" stroke="none"/><text x="165" y="184.8" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="650">1.082</text><rect x="193.5" y="216" width="32" height="29" rx="3" fill="#91b1c0" stroke="none"/><text x="209.5" y="209.8" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="650">0.580</text><rect x="262" y="92" width="210" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="367" y="121.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">② 减去均值</text><text x="367" y="142.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">μ = 0.7321</text><path d="M278 245L456 245" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="245" width="32" height="32" rx="3" fill="#d9a797" stroke="none"/><text x="300" y="294.9" font-size="11" fill="#a4604b" text-anchor="middle" font-weight="650">−0.641</text><rect x="328.5" y="222.8" width="32" height="22.2" rx="3" fill="#d8c9a8" stroke="none"/><text x="344.5" y="216.7" font-size="11" fill="#8f7857" text-anchor="middle" font-weight="650">0.444</text><rect x="373" y="227.5" width="32" height="17.5" rx="3" fill="#d8c9a8" stroke="none"/><text x="389" y="221.3" font-size="11" fill="#8f7857" text-anchor="middle" font-weight="650">0.350</text><rect x="417.5" y="245" width="32" height="7.6" rx="3" fill="#d9a797" stroke="none"/><text x="433.5" y="270.5" font-size="11" fill="#a4604b" text-anchor="middle" font-weight="650">−0.152</text><rect x="486" y="92" width="210" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="591" y="121.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">③ 除以标准差</text><text x="591" y="142.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">√(σ² + ε) = 0.4340</text><path d="M502 245L680 245" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="508" y="245" width="32" height="73.9" rx="3" fill="#d9a797" stroke="none"/><text x="524" y="336.8" font-size="11" fill="#a4604b" text-anchor="middle" font-weight="650">−1.477</text><rect x="552.5" y="193.9" width="32" height="51.1" rx="3" fill="#94b79a" stroke="none"/><text x="568.5" y="187.8" font-size="11" fill="#3d7058" text-anchor="middle" font-weight="650">1.022</text><rect x="597" y="204.7" width="32" height="40.3" rx="3" fill="#94b79a" stroke="none"/><text x="613" y="198.5" font-size="11" fill="#3d7058" text-anchor="middle" font-weight="650">0.806</text><rect x="641.5" y="245" width="32" height="17.6" rx="3" fill="#d9a797" stroke="none"/><text x="657.5" y="280.5" font-size="11" fill="#a4604b" text-anchor="middle" font-weight="650">−0.351</text><path d="M250 236H256" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M474 236H480" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="710" y="92" width="212" height="286" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="816" y="121.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">④ 仿射 γ⊙z + β</text><text x="726" y="154" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">γ、β 为每个特征维</text><text x="726" y="176" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">上的可学习参数，</text><text x="726" y="198" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">让网络能恢复需要的</text><text x="726" y="220" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">尺度与偏移。</text><text x="726" y="262" font-size="13" fill="#3d7058" text-anchor="start" font-weight="650">输出均值：0</text><text x="726" y="284" font-size="13" fill="#3d7058" text-anchor="start" font-weight="650">输出方差：0.99995</text><text x="726" y="306" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">（因 ε 略小于 1）</text><text x="38" y="408" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">统计量在每次前向计算时由当前输入求得（σ² = 0.188304，分母为 d）。各分量相对均值的正负关系在归一化后保持不变。</text></svg>