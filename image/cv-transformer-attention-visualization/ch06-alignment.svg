<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="title desc"><title id="title">源序列与目标序列的对应关系</title><desc id="desc">英文 I like you very much 有 5 个 token，中文“我很喜欢你”有 4 个。I 对应我，like 对应喜欢，you 对应你，very much 一起对应“很”，并从句末移到动词之前。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="432" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">源序列与目标序列的对应关系</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">长度不同、顺序不同，不能按位置逐个替换</text><rect x="102" y="111" width="96" height="38" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="150" y="136.3" font-size="18" fill="#4a6a80" text-anchor="middle" font-weight="500">I</text><rect x="242" y="111" width="96" height="38" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="290" y="136.3" font-size="18" fill="#4a6a80" text-anchor="middle" font-weight="500">like</text><rect x="382" y="111" width="96" height="38" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="430" y="136.3" font-size="18" fill="#4a6a80" text-anchor="middle" font-weight="500">you</text><rect x="522" y="111" width="96" height="38" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="570" y="136.3" font-size="18" fill="#4a6a80" text-anchor="middle" font-weight="500">very</text><rect x="662" y="111" width="96" height="38" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="710" y="136.3" font-size="18" fill="#4a6a80" text-anchor="middle" font-weight="500">much</text><rect x="142" y="281" width="96" height="38" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="190" y="306.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="500">我</text><rect x="312" y="281" width="96" height="38" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="360" y="306.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="500">很</text><rect x="482" y="281" width="96" height="38" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="530" y="306.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="500">喜欢</text><rect x="652" y="281" width="96" height="38" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="700" y="306.3" font-size="18" fill="#3d7058" text-anchor="middle" font-weight="500">你</text><path d="M150 150C150 220 190 210 190 280" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 150C290 220 530 210 530 280" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 150C430 220 700 210 700 280" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M570 150C570 220 360 210 360 280" fill="none" stroke="#8f7857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M710 150C710 220 360 210 360 280" fill="none" stroke="#8f7857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><text x="50" y="136" font-size="16" fill="#71838b" text-anchor="start" font-weight="400">源</text><text x="50" y="306" font-size="16" fill="#71838b" text-anchor="start" font-weight="400">目标</text><text x="780" y="130" font-size="15" fill="#4a6a80" text-anchor="start" font-weight="400">5 个 token</text><text x="780" y="300" font-size="15" fill="#3d7058" text-anchor="start" font-weight="400">4 个 token</text><rect x="38" y="346" width="884" height="66" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="58" y="374" font-size="15" fill="#8f7857" text-anchor="start" font-weight="400">very much → 很：两个源 token 对应一个目标 token，并且从句末移到了动词之前（棕色虚线）。</text><text x="58" y="398" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">连线表示人工标注的词对齐，仅用于说明；模型并不需要显式地学习这种一一对应。</text></svg>