<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">序列的逐位置负对数似然</title><desc id="desc">四个位置在正确前缀下的条件概率为 0.70、0.80、0.75、0.90，对应的负对数概率为 0.3567、0.2231、0.2877、0.1054，总和 0.9729，按 4 个位置平均为 0.2432。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="440" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">序列损失 = 逐位置负对数概率之和</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">一次序列预测被拆成 T 次词表分类</text><text x="160" y="114.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">t = 1</text><rect x="112" y="124" width="96" height="36" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="160" y="148.3" font-size="18" fill="#4a6a80" text-anchor="middle" font-weight="500">我</text><text x="160" y="191.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">p = 0.70</text><rect x="134" y="227.3" width="52" height="92.7" rx="4" fill="#d9a797" stroke="none"/><text x="160" y="224.2" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="650">0.3567</text><text x="160" y="346.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">−log p</text><text x="340" y="114.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">t = 2</text><rect x="292" y="124" width="96" height="36" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="340" y="148.3" font-size="18" fill="#4a6a80" text-anchor="middle" font-weight="500">喜欢</text><text x="340" y="191.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">p = 0.80</text><rect x="314" y="262" width="52" height="58" rx="4" fill="#d9a797" stroke="none"/><text x="340" y="258.9" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="650">0.2231</text><text x="340" y="346.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">−log p</text><text x="520" y="114.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">t = 3</text><rect x="472" y="124" width="96" height="36" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="520" y="148.3" font-size="18" fill="#4a6a80" text-anchor="middle" font-weight="500">你</text><text x="520" y="191.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">p = 0.75</text><rect x="494" y="245.2" width="52" height="74.8" rx="4" fill="#d9a797" stroke="none"/><text x="520" y="242.1" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="650">0.2877</text><text x="520" y="346.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">−log p</text><text x="700" y="114.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">t = 4</text><rect x="652" y="124" width="96" height="36" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="700" y="148.3" font-size="18" fill="#8f7857" text-anchor="middle" font-weight="500">&lt;eos&gt;</text><text x="700" y="191.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">p = 0.90</text><rect x="674" y="292.6" width="52" height="27.4" rx="4" fill="#d9a797" stroke="none"/><text x="700" y="289.5" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="650">0.1054</text><text x="700" y="346.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">−log p</text><path d="M70 320L800 320" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="366" width="700" height="50" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="440" y="396.6" font-size="16" fill="#a4604b" text-anchor="middle" font-weight="650">总损失 = 0.3567 + 0.2231 + 0.2877 + 0.1054 = 0.9729；平均 0.2432</text><text x="820" y="160" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">&lt;eos&gt; 也是</text><text x="820" y="180" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">一个预测目标</text></svg>