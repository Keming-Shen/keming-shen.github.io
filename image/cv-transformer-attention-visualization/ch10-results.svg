<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-labelledby="title desc"><title id="title">原论文的翻译结果</title><desc id="desc">WMT 2014 英德翻译：Base 27.3，Big 28.4；英法翻译：Base 38.1，Big 41.8。Base 训练 10 万步约 12 小时，Big 训练 30 万步约 3.5 天。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="462" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">原论文报告的结果（WMT 2014）</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">BLEU 越高越好；训练设备为 8 块 NVIDIA P100</text><rect x="110" y="100" width="460" height="260" rx="6" fill="#f6f7f4" stroke="none"/><path d="M110 302.2L570 302.2" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="102" y="307.2" font-size="12" fill="#9aa7ad" text-anchor="end" font-weight="400">10</text><path d="M110 244.4L570 244.4" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="102" y="249.4" font-size="12" fill="#9aa7ad" text-anchor="end" font-weight="400">20</text><path d="M110 186.7L570 186.7" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="102" y="191.7" font-size="12" fill="#9aa7ad" text-anchor="end" font-weight="400">30</text><path d="M110 128.9L570 128.9" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="102" y="133.9" font-size="12" fill="#9aa7ad" text-anchor="end" font-weight="400">40</text><rect x="150" y="202.3" width="70" height="157.7" rx="4" fill="#91b1c0" stroke="none"/><text x="185" y="195.6" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="700">27.3</text><text x="185" y="382.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">Base</text><rect x="265" y="195.9" width="70" height="164.1" rx="4" fill="#94b79a" stroke="none"/><text x="300" y="189.2" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="700">28.4</text><text x="300" y="382.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">Big</text><text x="225" y="409.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">英→德</text><rect x="380" y="139.9" width="70" height="220.1" rx="4" fill="#91b1c0" stroke="none"/><text x="415" y="133.2" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="700">38.1</text><text x="415" y="382.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">Base</text><rect x="495" y="118.5" width="70" height="241.5" rx="4" fill="#94b79a" stroke="none"/><text x="530" y="111.8" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="700">41.8</text><text x="530" y="382.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">Big</text><text x="455" y="409.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">英→法</text><rect x="600" y="100" width="322" height="260" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="616" y="128" font-size="13" fill="#8f7857" text-anchor="start" font-weight="650">训练成本</text><text x="616" y="151" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">Base：10 万步，约 12 小时</text><text x="616" y="174" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">Big：30 万步，约 3.5 天</text><text x="616" y="197" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400"></text><text x="616" y="220" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">每批约 25000 个源 token</text><text x="616" y="243" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">与 25000 个目标 token</text><text x="616" y="266" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400"></text><text x="616" y="289" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">Big 在英→德上比此前最好</text><text x="616" y="312" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">结果（含集成模型）高出</text><text x="616" y="335" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">2 BLEU 以上</text><text x="38" y="440" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">数值取自 Vaswani 等（2017）表 2。其意义不止于翻译质量：它证明了不含循环结构的模型可以高效地大规模训练。</text></svg>