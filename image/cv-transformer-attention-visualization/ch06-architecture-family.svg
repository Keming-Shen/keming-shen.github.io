<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">编码器—解码器与相关结构</title><desc id="desc">编码器—解码器建模 p(y|x)，用于翻译；自编码器以重建误差训练；仅编码器结构利用双向上下文做分类与标注，如 BERT；仅解码器结构用因果自注意力预测下一个 token，如 GPT。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="440" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">编码器—解码器、自编码器与拆分用法</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">结构分工相同，训练目标与信息可见范围不同</text><rect x="38" y="90" width="210" height="300" rx="12" fill="#e8eff5" stroke="#9eb4c4"/><text x="143" y="124" font-size="17" fill="#4a6a80" text-anchor="middle" font-weight="700">编码器—解码器</text><rect x="58" y="142" width="170" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="143" y="162.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">源序列 x</text><path d="M143 175L143 192" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="58" y="194" width="170" height="32" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="143" y="214.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="500">编码 → memory</text><path d="M143 227L143 244" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="58" y="246" width="170" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="143" y="266.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">解码 → 目标 y</text><text x="54" y="338" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">训练目标</text><text x="54" y="358" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">p(y | x)</text><text x="54" y="380" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">翻译、摘要、T5</text><rect x="262" y="90" width="210" height="300" rx="12" fill="#f1f0e9" stroke="#b9a98a"/><text x="367" y="124" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="700">自编码器</text><rect x="282" y="142" width="170" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="367" y="162.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">输入 x</text><path d="M367 175L367 192" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="282" y="194" width="170" height="32" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="367" y="214.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="500">压缩表示 z</text><path d="M367 227L367 244" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="282" y="246" width="170" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="367" y="266.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">重建 x̂</text><text x="278" y="338" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">训练目标</text><text x="278" y="358" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">重建误差 ‖x − x̂‖</text><text x="278" y="380" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">降维、去噪</text><rect x="486" y="90" width="210" height="300" rx="12" fill="#edf3ed" stroke="#6d9580"/><text x="591" y="124" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="700">仅编码器</text><rect x="506" y="142" width="170" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="591" y="162.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">完整输入 x</text><path d="M591 175L591 192" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="506" y="194" width="170" height="32" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="591" y="214.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="500">双向上下文</text><path d="M591 227L591 244" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="506" y="246" width="170" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="591" y="266.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">分类 / 逐位置标注</text><text x="502" y="338" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">训练目标</text><text x="502" y="358" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">掩码语言建模等</text><text x="502" y="380" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">BERT</text><rect x="710" y="90" width="210" height="300" rx="12" fill="#f6ebe7" stroke="#c99787"/><text x="815" y="124" font-size="17" fill="#a4604b" text-anchor="middle" font-weight="700">仅解码器</text><rect x="730" y="142" width="170" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="815" y="162.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">已有前缀 y&lt;ₜ</text><path d="M815 175L815 192" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="730" y="194" width="170" height="32" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="815" y="214.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="500">因果自注意力</text><path d="M815 227L815 244" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="730" y="246" width="170" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="815" y="266.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">下一个 token</text><text x="726" y="338" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">训练目标</text><text x="726" y="358" font-size="14" fill="#5c747d" text-anchor="start" font-weight="600">p(yₜ | y&lt;ₜ)</text><text x="726" y="380" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">GPT 系列</text><text x="38" y="418" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">Transformer 编码器的每一层都保持序列长度与维度不变：编码的目的是得到适合任务的表示，而不是更小的表示。</text></svg>