<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" role="img" aria-labelledby="title desc"><title id="title">XXᵀ 与 QKᵀ 的对称性</title><desc id="desc">左：嵌入矩阵的 XXᵀ 是对称矩阵，对角线元素较大。右：QKᵀ 不对称，例如“我”对“喜欢”的分数与“喜欢”对“我”的分数不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="446" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">为什么需要独立的 W^Q 与 W^K</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">直接用 XXᵀ 打分必然对称；QKᵀ 可以不对称</text><text x="238" y="114" font-size="17" fill="#293e4b" text-anchor="middle" font-weight="650">XXᵀ（以嵌入向量为例）</text><text x="192" y="140.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">我</text><text x="282" y="140.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">喜欢</text><text x="372" y="140.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">你</text><text x="136" y="192" font-size="14" fill="#5c747d" text-anchor="end" font-weight="400">我</text><text x="136" y="262" font-size="14" fill="#5c747d" text-anchor="end" font-weight="400">喜欢</text><text x="136" y="332" font-size="14" fill="#5c747d" text-anchor="end" font-weight="400">你</text><rect x="148" y="150" width="88" height="68" rx="3" fill="rgba(74,106,128,0.80)" stroke="none"/><text x="192" y="189.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="700">1.50</text><rect x="238" y="150" width="88" height="68" rx="3" fill="rgba(176,115,94,0.30)" stroke="none"/><text x="282" y="189.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="400">−0.50</text><rect x="328" y="150" width="88" height="68" rx="3" fill="rgba(176,115,94,0.50)" stroke="none"/><text x="372" y="189.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="400">−1.00</text><rect x="148" y="220" width="88" height="68" rx="3" fill="rgba(176,115,94,0.30)" stroke="none"/><text x="192" y="259.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="400">−0.50</text><rect x="238" y="220" width="88" height="68" rx="3" fill="rgba(74,106,128,0.80)" stroke="none"/><text x="282" y="259.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="700">1.50</text><rect x="328" y="220" width="88" height="68" rx="3" fill="rgba(74,106,128,0.10)" stroke="none"/><text x="372" y="259.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="400">0.00</text><rect x="148" y="290" width="88" height="68" rx="3" fill="rgba(176,115,94,0.50)" stroke="none"/><text x="192" y="329.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="400">−1.00</text><rect x="238" y="290" width="88" height="68" rx="3" fill="rgba(74,106,128,0.10)" stroke="none"/><text x="282" y="329.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="400">0.00</text><rect x="328" y="290" width="88" height="68" rx="3" fill="rgba(74,106,128,0.80)" stroke="none"/><text x="372" y="329.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="700">1.50</text><text x="283" y="386.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">Gᵢⱼ = Gⱼᵢ，对角线往往最大</text><text x="700" y="114" font-size="17" fill="#293e4b" text-anchor="middle" font-weight="650">QKᵀ（未缩放）</text><text x="654" y="140.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">我</text><text x="744" y="140.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">喜欢</text><text x="834" y="140.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">你</text><text x="598" y="192" font-size="14" fill="#5c747d" text-anchor="end" font-weight="400">我</text><text x="598" y="262" font-size="14" fill="#5c747d" text-anchor="end" font-weight="400">喜欢</text><text x="598" y="332" font-size="14" fill="#5c747d" text-anchor="end" font-weight="400">你</text><rect x="610" y="150" width="88" height="68" rx="3" fill="rgba(61,112,88,0.38)" stroke="none"/><text x="654" y="189.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="700">1.04</text><rect x="700" y="150" width="88" height="68" rx="3" fill="rgba(61,112,88,0.41)" stroke="none"/><text x="744" y="189.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="400">1.16</text><rect x="790" y="150" width="88" height="68" rx="3" fill="rgba(61,112,88,0.65)" stroke="none"/><text x="834" y="189.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="400">2.04</text><rect x="610" y="220" width="88" height="68" rx="3" fill="rgba(61,112,88,0.30)" stroke="none"/><text x="654" y="259.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="400">0.76</text><rect x="700" y="220" width="88" height="68" rx="3" fill="rgba(176,115,94,0.13)" stroke="none"/><text x="744" y="259.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="700">−0.13</text><rect x="790" y="220" width="88" height="68" rx="3" fill="rgba(61,112,88,0.62)" stroke="none"/><text x="834" y="259.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="400">1.92</text><rect x="610" y="290" width="88" height="68" rx="3" fill="rgba(61,112,88,0.42)" stroke="none"/><text x="654" y="329.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="400">1.20</text><rect x="700" y="290" width="88" height="68" rx="3" fill="rgba(61,112,88,0.80)" stroke="none"/><text x="744" y="329.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="400">2.60</text><rect x="790" y="290" width="88" height="68" rx="3" fill="rgba(61,112,88,0.58)" stroke="none"/><text x="834" y="329.6" font-size="16" fill="#fcfcfa" text-anchor="middle" font-weight="700">1.80</text><text x="745" y="386.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">“我”→“喜欢” ≠ “喜欢”→“我”</text><rect x="700" y="150" width="90" height="70" rx="4" fill="none" stroke="#a4604b" stroke-width="2"/><rect x="610" y="220" width="90" height="70" rx="4" fill="none" stroke="#a4604b" stroke-width="2"/><text x="38" y="424" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">左图 X 取第 03 章“我／喜欢／你”的嵌入；右图红框中 QKᵀ[1,2] = 1.16，QKᵀ[2,1] = 0.76。行表示查询，列表示键。</text></svg>