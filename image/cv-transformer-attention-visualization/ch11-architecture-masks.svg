="none"/><text x="482" y="368.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="600">GPT 系列：生成、对话、代码</text><rect x="700" y="142" width="210" height="196" rx="8" fill="#f6f7f4" stroke="none"/><text x="805" y="109.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="700">编码器—解码器</text><text x="805" y="130.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">双向 + 因果 + 交叉</text><rect x="716" y="150" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="742" y="150" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="768" y="150" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="716" y="176" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="742" y="176" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="768" y="176" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="716" y="202" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="742" y="202" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="768" y="202" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><text x="755" y="247.8" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">编码器</text><rect x="812" y="150" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="838" y="150" width="24" height="24" rx="3" fill="#eceeed" stroke="none"/><rect x="864" y="150" width="24" height="24" rx="3" fill="#eceeed" stroke="none"/><rect x="812" y="176" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="838" y="176" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="864" y="176" width="24" height="24" rx="3" fill="#eceeed" stroke="none"/><rect x="812" y="202" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="838" y="202" width="24" height="24" rx="3" fill="#94b79a" stroke="none"/><rect x="864" y="202" width="24" height="24" rx="3" fill="#94b79a" stroke="n