<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-labelledby="title desc"><title id="title">Q、K、V 的线性投影</title><desc id="desc">3×4 的输入 X 分别乘以三个 4×2 的投影矩阵，得到 3×2 的 Q、K、V。Q 与 K 用于计算匹配分数，V 为被取回的内容。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="462" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">Q、K、V 由同一输入经三组线性投影得到</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">投影矩阵在所有位置共享；n = 3，d_model = 4，dₖ = d_v = 2</text><text x="120" y="111.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="600">X ∈ ℝ³ˣ⁴</text><rect x="48" y="122" width="34" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="65" y="145.6" font-size="13" fill="#293e4b" text-anchor="middle" font-weight="400">1</text><rect x="84" y="122" width="34" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="101" y