293e4b" text-anchor="middle" font-weight="400">0.0</text><path d="M486 104H480V179H486M608 104H614V179H608" fill="none" stroke="#5c747d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="148" font-size="15" fill="#3d7058" text-anchor="start" font-weight="650">Q ∈ ℝ³ˣ²</text><path d="M212 182C260 182 260 262 300 262" fill="none" stroke="#b9a98a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="306" y="236" width="120" height="52" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="366" y="259.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="700">× W^K</text><text x="366" y="278.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">ℝ⁴ˣ²</text><path d="M430 262L470 262" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="488" y="228" width="58" height="21" rx="3" fill="#f1f0e9" stroke="none"/><text x="517" y="242.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">1.2</text><rect x="548" y="228" width="58" height="21" rx="3" fill="#f1f0e9" stroke="none"/><text x="577" y="242.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">0.4</text><rect x="488" y="251" width="58" height="21" rx="3" fill="#f1f0e9" stroke="none"/><text x="517" y="265.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">2.6</text><rect x="548" y="251" width="58" height="21" rx="3" fill="#f1f0e9" stroke="none"/><text x="577" y="265.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">−0.5</text><rect x="488" y="274" width="58" height="21" rx="3" fill="#f1f0e9" stroke="none"/><text x="517" y="288.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">1.8</text><rect x="548" y="274" width="58" height="21" rx="3" fill="#f1f0e9" stroke="none"/><text x="577" y="288.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">1.2</text><path d="M486 224H480V299H486M608 224H614V299H608" fill="none" stroke="#5c747d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="268" font-size="15" fill="#8f7857" text-anchor="start" font-weight="650">K ∈ ℝ³ˣ²</text><path d="M212 182C260 182 260 382 300 382" fill="none" stroke="#9eb4c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="306" y="356" width="120" height="52" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="366" y="379.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="700">× W^V</text><text x="366" y="398.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">ℝ⁴ˣ²</text><path d="M430 382L470 382" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="488" y="348" width="58" height="21" rx="3" fill="#e8eff5" stroke="none"/><text x="517" y="362.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">1.0</text><rect x="548" y="348" width="58" height="21" rx="3" fill="#e8eff5" stroke="none"/><text x="577" y="362.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">0.0</text><rect x="488" y="371" width="58" height="21" rx="3" fill="#e8eff5" stroke="none"/><text x="517" y="385.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">0.0</text><rect x="548" y="371" width="58" height="21" rx="3" fill="#e8eff5" stroke="none"/><text x="577" y="385.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">2.0</text><rect x="488" y="394" width="58" height="21" rx="3" fill="#e8eff5" stroke="none"/><text x="517" y="408.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">−1.0</text><rect x="548" y="394" width="58" height="21" rx="3" fill="#e8eff5" stroke="none"/><text x="577" y="408.7" font-size="12" fill="#293e4b" text-anchor="middle" font-weight="400">1.0</text><path d="M486 344H480V419H486M608 344H614V419H608" fill="none" stroke="#5c747d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="388" font-size="15" fill="#4a6a80" text-anchor="start" font-weight="650">V ∈ ℝ³ˣ²</text><rect x="760" y="110" width="162" height="300" rx="8" fill="#f6f7f4" stroke="none"/><text x="774" y="150" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">Q：用来“提问”</text><text x="774" y="190" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">K：用来被匹配</text><text x="774" y="230" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="650">V：被取回的内容</text><text x="774" y="290" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">Q 与 K 必须同维</text><text x="774" y="312" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">才能做点积；</text><text x="774" y="334" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">V 的维度可以不同。</text><text x="38" y="440" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">输入取标准基向量，因此投影结果恰好等于参数矩阵的前三行；参数为示意，与第 08 章的第一个头相同。</text></svg>