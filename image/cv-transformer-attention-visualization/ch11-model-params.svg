<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="title desc"><title id="title">模型结构与参数量</title><desc id="desc">源嵌入 480、目标嵌入 384、编码器层 8544、解码器层 12832、输出投影 396，合计 22,636 个参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="468" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">模型结构与参数量</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">d_model = 32，4 个头，FFN 64，编码器与解码器各 1 层</text><text x="38" y="126" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">源嵌入</text><text x="150" y="126" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">15 × 32</text><rect x="430" y="108" width="14.2" height="30" rx="5" fill="#91b1c0" stroke="none"/><text x="450.214463840399" y="128" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="650">480</text><text x="38" y="178" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">目标嵌入</text><text x="150" y="178" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">12 × 32</text><rect x="430" y="160" width="11.4" height="30" rx="5" fill="#94b79a" stroke="none"/><text x="447.3715710723192" y="180" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">384</text><text x="38" y="230" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">编码器层</text><text x="150" y="230" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">自注意力 + FFN + 2 LN</text><rect x="430" y="212" width="253" height="30" rx="5" fill="#91b1c0" stroke="none"/><text x="689.0174563591022" y="232" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="650">8,544</text><text x="38" y="282" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">解码器层</text><text x="150" y="282" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">自注意力 + 交叉注意力 + FFN + 3 LN</text><rect x="430" y="264" width="380" height="30" rx="5" fill="#94b79a" stroke="none"/><text x="816" y="284" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">12,832</text><text x="38" y="334" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">输出投影</text><text x="150" y="334" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">32 × 12 + 12</text><rect x="430" y="316" width="11.7" height="30" rx="5" fill="#d8c9a8" stroke="none"/><text x="447.7269326683292" y="336" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">396</text><rect x="38" y="370" width="884" height="50" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="56" y="400" font-size="15" fill="#3d7058" text-anchor="start" font-weight="400">合计 22,636 个参数，与脚本输出一致。源与目标使用不同词表，因此三处嵌入不共享（与原论文不同）。</text><text x="38" y="448" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">位置编码表用 register_buffer 注册：随模型移动设备、写入 state_dict，但不被优化器更新；预先生成 64 个位置。</text></svg>