<svg xmlns="http://www.w3.org/2000/svg" width="960" height="482" viewBox="0 0 960 482" role="img" aria-labelledby="title desc"><title id="title">时间反向传播中的梯度尺度</title><desc id="desc">对数纵轴上，回传 k 步后的梯度尺度为 λ 的 k 次方。λ=1.2 时 20 步后放大约 38 倍；λ=0.8 时缩小到约 0.012；λ=0.5 时缩小到约 10⁻⁶。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="482" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">时间反向传播中的梯度尺度</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">梯度每回传一步乘一个雅可比矩阵；设其范数为常数 λ</text><rect x="110" y="96" width="560" height="290" rx="6" fill="#f6f7f4" stroke="none"/><path d="M110 349.8L670 349.8" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="100" y="354.8" font-size="13" fill="#9aa7ad" text-anchor="end" font-weight="400">10⁻⁴</text><path d="M110 277.3L670 277.3" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="100" y="282.3" font-size="13" fill="#9aa7ad" text-anchor="end" font-weight="400">10⁻²</text><path d="M110 204.8L670 204.8" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="100" y="209.8" font-size="13" fill="#9aa7ad" text-anchor="end" font-weight="400">10⁰</text><path d="M110 132.3L670 132.3" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="100" y="137.3" font-size="13" fill="#9aa7ad" text-anchor="end" font-weight="400">10²</text><text x="110" y="408.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">0</text><text x="250" y="408.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">5</text><text x="390" y="408.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">10</text><text x="530" y="408.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">15</text><text x="670" y="408.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">20</text><text x="390" y="432.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">回传的时间步数 k</text><path d="M110 204.8L119.3 203.8L128.7 202.8L138 201.9L147.3 200.9L156.7 200L166 199L175.3 198.1L184.7 197.1L194 196.1L203.3 195.2L212.7 194.2L222 193.3L231.3 192.3L240.7 191.4L250 190.4L259.3 189.4L268.7 188.5L278 187.5L287.3 186.6L296.7 185.6L306 184.7L315.3 183.7L324.7 182.7L334 181.8L343.3 180.8L352.7 179.9L362 178.9L371.3 178L380.7 177L390 176L399.3 175.1L408.7 174.1L418 173.2L427.3 172.2L436.7 171.3L446 170.3L455.3 169.3L464.7 168.4L474 167.4L483.3 166.5L492.7 165.5L502 164.6L511.3 163.6L520.7 162.7L530 161.7L539.3 160.7L548.7 159.8L558 158.8L567.3 157.9L576.7 156.9L586 156L595.3 155L604.7 154L614 153.1L623.3 152.1L632.7 151.2L642 150.2L651.3 149.3L660.7 148.3L670 147.3" fill="none"