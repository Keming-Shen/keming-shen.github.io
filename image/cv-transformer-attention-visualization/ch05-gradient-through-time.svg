0">λ²⁰ ≈ 9.5 × 10⁻⁷</text><text x="38" y="460" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">LSTM、GRU 与第 09 章的残差连接都引入近似加法的路径，使梯度不必只经过连乘，从而缓解梯度消失；梯度爆炸通常用梯度裁剪应对。</text></svg>