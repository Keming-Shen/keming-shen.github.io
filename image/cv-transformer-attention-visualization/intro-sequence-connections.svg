<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">循环网络与自注意力的连接方式</title><desc id="desc">循环网络在相邻状态间依次传递信息。编码器自注意力中的一个查询位置可以直接读取完整序列中的各个位置，包括自身。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#748d9c" stroke-width="1.7"/></marker><style>text{font-family:Inter,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="1" y="1" width="958" height="418" rx="18" fill="#fbfcfe" stroke="#dfe6ed"/><rect x="24" y="24" width="444" height="344" rx="12" fill="#eef5fd" stroke="none"/><rect x="492" y="24" width="444" height="344" rx="12" fill="#eef7f3" stroke="none"/><text x="48" y="66" font-size="26" fill="#263b4b" font-weight="650" text-anchor="start">循环网络</text><text x="516" y="66" font-size="26" fill="#263b4b" font-weight="650" text-anchor="start">编码器自注意力</text><text x="48" y="100" font-size="20" fill="#617e95" font-weight="400" text-anchor="start">状态沿序列逐步传递</text><text x="516" y="100" font-size="20" fill="#648675" font-weight="400" text-anchor="start">当前位置直接读取各位置</text><circle cx="87" cy="208" r="27" fill="#d5e6f8" stroke="#96b7d4" stroke-width="2"/><text x="87" y="283" font-size="23" fill="#263b4b" font-weight="500" text-anchor="middle">我</text><path d="M87 253V242" fill="none" stroke="#748d9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M121 208H157" fill="none" stroke="#748d9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="191" cy="208" r="27" fill="#d5e6f8" stroke="#96b7d4" stroke-width="2"/><text x="191" y="283" font-size="23" fill="#263b4b" font-weight="500" text-anchor="middle">很</text><path d="M191 253V242" fill="none" stroke="#748d9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M225 208H261" fill="none" stroke="#748d9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="295" cy="208" r="27" fill="#d5e6f8" stroke="#96b7d4" stroke-width="2"/><text x="295" y="283" font-size="23" fill="#263b4b" font-weight="500" text-anchor="middle">喜欢</text><path d="M295 253V242" fill="none" stroke="#748d9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M329 208H365" fill="none" stroke="#748d9c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="399" cy="208" r="27" fill="#d5e6f8" stroke="#96b7d4" stroke-width="2"/><text x="399" y="283" font-size="23" fill="#263b4b" font-weight="500" text-anchor="middle">你</text><path d="M399 253V242" fill="none" stroke="#748d9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="552" cy="267" r="26" fill="#dceee5" stroke="#9bbdac" stroke-width="2"/><text x="552" y="275" font-size="21" fill="#365c4b" font-weight="500" text-anchor="middle">我</text><path d="M552 232L864 174" fill="none" stroke="#91afa1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="656" cy="267" r="26" fill="#dceee5" stroke="#9bbdac" stroke-width="2"/><text x="656" y="275" font-size="21" fill="#365c4b" font-weight="500" text-anchor="middle">很</text><path d="M656 232L864 174" fill="none" stroke="#91afa1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="760" cy="267" r="26" fill="#dceee5" stroke="#9bbdac" stroke-width="2"/><text x="760" y="275" font-size="21" fill="#365c4b" font-weight="500" text-anchor="middle">喜欢</text><path d="M760 232L864 174" fill="none" stroke="#91afa1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="864" cy="267" r="26" fill="#dceee5" stroke="#9bbdac" stroke-width="2"/><text x="864" y="275" font-size="21" fill="#365c4b" font-weight="500" text-anchor="middle">你</text><path d="M864 232L864 174" fill="none" stroke="#91afa1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><circle cx="864" cy="145" r="28" fill="#417c68" stroke="none" stroke-width="2"/><text x="864" y="153" font-size="23" fill="#fff" font-weight="600" text-anchor="middle">你</text><text x="87" y="337" font-size="19" fill="#617e95" font-weight="400" text-anchor="start">前缀信息经过中间状态</text><text x="516" y="337" font-size="19" fill="#648675" font-weight="400" text-anchor="start">以“你”所在的查询位置为例</text><text x="480" y="402" font-size="18" fill="#6c7e8c" font-weight="400" text-anchor="middle">连线表示信息可传递的方向，不表示实际注意力权重。</text></svg>