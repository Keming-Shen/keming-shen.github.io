<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="title desc"><title id="title">受控的序列转换任务</title><desc id="desc">we help them today 翻译为“今天 我们 帮助 他们”：三个词按位置错开一位映射，today 从句末移到句首。规则共生成 96 个句对，按 72、12、12 划分为训练、验证与测试集。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="424" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">受控的序列转换任务</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">4 × 3 × 4 × 2 = 96 个句对：逐词映射，并把 today 移到句首</text><rect x="75" y="104" width="90" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="120" y="125.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">we</text><rect x="185" y="104" width="90" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="230" y="125.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">help</text><rect x="295" y="104" width="90" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="340" y="125.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">them</text><rect x="405" y="104" width="90" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="450" y="125.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">today</text><rect x="75" y="234" width="90" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="120" y="255.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">今天</text><rect x="185" y="234" width="90" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="230" y="255.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">我们</text><rect x="295" y="234" width="90" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="340" y="255.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">帮助</text><rect x="405" y="234" width="90" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="450" y="255.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">他们</text><path d="M120 138C120 190 230 190 230 232" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M230 138C230 190 340 190 340 232" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M340 138C340 190 450 190 450 232" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M450 138C450 200 120 180 120 232" fill="none" stroke="#8f7857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)" stroke-dasharray="6 6"/><text x="285" y="300.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="650">三条对角映射 + 一次远距离的语序调整</text><text x="38" y="126" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">源</text><text x="38" y="256" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">目标</text><rect x="540" y="92" width="382" height="210" rx="10" fill="#f6f7f4" stroke="none"/><text x="558" y="126" font-size="14" fill="#293e4b" text-anchor="start" font-weight="650">主语</text><text x="610" y="126" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">i / you / we / they</text><text x="900" y="126" font-size="14" fill="#8f7857" text-anchor="end" font-weight="650">× 4</text><text x="558" y="166" font-size="14" fill="#293e4b" text-anchor="start" font-weight="650">动词</text><text x="610" y="166" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">like / see / help</text><text x="900" y="166" font-size="14" fill="#8f7857" text-anchor="end" font-weight="650">× 3</text><text x="558" y="206" font-size="14" fill="#293e4b" text-anchor="start" font-weight="650">宾语</text><text x="610" y="206" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">me / you / us / them</text><text x="900" y="206" font-size="14" fill="#8f7857" text-anchor="end" font-weight="650">× 4</text><text x="558" y="246" font-size="14" fill="#293e4b" text-anchor="start" font-weight="650">时间</text><text x="610" y="246" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">无 / today</text><text x="900" y="246" font-size="14" fill="#8f7857" text-anchor="end" font-weight="650">× 2</text><text x="558" y="288" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">逐位置替换无法完成含 today 的样本</text><rect x="60" y="330" width="627" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="375" y="354.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">训练 72</text><rect x="690" y="330" width="102" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="742.5" y="354.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="650">验证 12</text><rect x="795" y="330" width="102" height="40" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="847.5" y="354.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">测试 12</text><text x="38" y="404" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">词表只由训练集建立，验证与测试集没有未知词：测试评价的是“同一规则下未见过的组合”，而不是更长的句子或新词。</text></svg>