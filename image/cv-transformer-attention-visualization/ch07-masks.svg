">0</text><rect x="728" y="270" width="50" height="42" rx="3" fill="#f3e4df" stroke="none"/><text x="753" y="295.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="800" y="120" width="122" height="200" rx="8" fill="#f6f7f4" stroke="none"/><text x="812" y="146" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">行 = 查询</text><text x="812" y="168" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">列 = 键</text><text x="812" y="204" font-size="13" fill="#a4604b" text-anchor="start" font-weight="600">&lt;pad&gt; 列：</text><text x="812" y="224" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">任何查询都</text><text x="812" y="244" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">不能读取</text><text x="812" y="280" font-size="13" fill="#3d7058" text-anchor="start" font-weight="600">上三角：</text><text x="812" y="300" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">不能读未来</text><text x="38" y="368" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">以“喜欢”这一行为例：</text><text x="38" y="396" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">分数 [0.8, 0.4, 1.1, 0.3]  +  掩码 [0, 0, 0, −∞]  →  softmax  →  权重 [0.331, 0.222, 0.447, 0.000]</text><text x="38" y="430" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">被屏蔽位置的权重恰好为 0，剩余权重自动在允许的位置之间重新归一化；若在 softmax 之后才置零，权重之和不再为 1。分数为示意。</text></svg>