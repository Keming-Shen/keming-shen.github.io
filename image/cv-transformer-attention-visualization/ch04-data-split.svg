<svg xmlns="http://www.w3.org/2000/svg" width="960" height="516" viewBox="0 0 960 516" role="img" aria-labelledby="title desc"><title id="title">数据划分与标准化</title><desc id="desc">2400 个样本被划分为 1680 个训练样本、360 个验证样本、360 个测试样本。标准化的均值与标准差只由训练集估计，再同样作用于三个集合；训练集用于更新参数，验证集用于选择检查点，测试集只做最终评价。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="516" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">数据划分与标准化统计量</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">μ、σ 只从训练集估计，再用于全部三个集合</text><rect x="60" y="96" width="584" height="52" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="354" y="128" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="650">训练集 1680</text><rect x="648" y="96" width="122" height="52" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="711" y="128" font-size="17" fill="#4a6a80" text-anchor="middle" font-weight="650">验证集 360</text><rect x="774" y="96" width="122" height="52" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="837" y="128" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="650">测试集 360</text><text x="900" y="176" font-size="14" fill="#71838b" text-anchor="end" font-weight="400">2400 个样本，按固定种子随机打乱后互不重叠地划分</text><rect x="244" y="206" width="220" height="56" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="354" y="230.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">估计 μ_train、σ_train</text><text x="354" y="251.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">只使用训练样本</text><path d="M354 150L354 202" fill="none" stroke="#6d9580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="300" y="300" width="360" height="56" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="480" y="324.6" font-size="16" fill="#8a979d" text-anchor="middle" font-weight="650">x̃ = (x − μ_train) / σ_train</text><text x="480" y="345.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">同一个变换作用于三个集合</text><path d="M354 266V282H480V296" fill="none" stroke="#6d9580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M480 360V376H354V396" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="354" y="424.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">计算梯度、更新参数</text><path d="M480 360V376H711V396" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="711" y="424.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">选择检查点与超参数</text><path d="M480 360V376H837V396" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="837" y="424.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="600">最终评价一次</text><rect x="46" y="446" width="868" height="50" rx="8" fill="#f6ebe7" stroke="#c99787"/><text x="64" y="476" font-size="15" fill="#a4604b" text-anchor="start" font-weight="400">数据泄露：若用全部 2400 个样本估计 μ、σ，验证集与测试集的信息就进入了训练流程，评价结果会偏乐观。</text></svg>