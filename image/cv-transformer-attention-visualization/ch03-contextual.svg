<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">静态嵌入与上下文化表示</title><desc id="desc">“苹果发布了新手机”和“把苹果削皮”中的“苹果”查出相同的嵌入向量；经过读取其他位置的上下文计算后，两者得到不同的表示。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="470" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">静态嵌入与上下文化表示</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">同一个 token 查出同一个向量，经过跨位置计算后才出现差异</text><text x="38" y="104" font-size="16" fill="#71838b" text-anchor="start" font-weight="400">语境一：科技公司</text><rect x="90" y="144" width="54" height="32" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="117" y="165.9" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="500">苹果</text><rect x="162" y="144" width="54" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="189" y="165.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">发布</text><rect x="234" y="144" width="37" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="252.5" y="165.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">了</text><rect x="289" y="144" width="37" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="307.5" y="165.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">新</text><rect x="344" y="144" width="54" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="371" y="165.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">手机</text><path d="M117 178L117 204" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="73" y="210" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="95" y="210" width="20" height="20" rx="3" fill="#e8e0cf" stroke="none"/><rect x="117" y="210" width="20" height="20" rx="3" fill="#efe7d6" stroke="none"/><rect x="139" y="210" width="20" height="20" rx="3" fill="#8f7857" stroke="none"/><text x="175" y="214" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">查表得到初始向量</text><path d="M189 144C189 120 117 120 117 142" fill="none" stroke="#9eb4c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M252.5 144C252.5 120 117 120 117 142" fill="none" stroke="#9eb4c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M307.5 144C307.5 120 117 120 117 142" fill="none" stroke="#9eb4c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M371 144C371 120 117 120 117 142" fill="none" stroke="#9eb4c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M167 220H560" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="570" y="192" width="150" height="56" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="645" y="216.9" font-size="17" fill="#4a6a80" text-anchor="middle" font-weight="650">上下文计算</text><text x="645" y="237.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">读取其他位置</text><path d="M724 220H770" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="780" y="210" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="802" y="210" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="824" y="210" width="20" height="20" rx="3" fill="#dce7ee" stroke="none"/><rect x="846" y="210" width="20" height="20" rx="3" fill="#4a6a80" stroke="none"/><text x="780" y="255" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">偏向“公司”</text><text x="38" y="274" font-size="16" fill="#71838b" text-anchor="start" font-weight="400">语境二：水果</text><rect x="90" y="314" width="37" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="108.5" y="335.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">把</text><rect x="145" y="314" width="54" height="32" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="172" y="335.9" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="500">苹果</text><rect x="217" y="314" width="37" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="235.5" y="335.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">削</text><rect x="272" y="314" width="37" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="290.5" y="335.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="500">皮</text><path d="M172 348L172 374" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="128" y="380" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="150" y="380" width="20" height="20" rx="3" fill="#e8e0cf" stroke="none"/><rect x="172" y="380" width="20" height="20" rx="3" fill="#efe7d6" stroke="none"/><rect x="194" y="380" width="20" height="20" rx="3" fill="#8f7857" stroke="none"/><text x="230" y="384" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">查表得到初始向量</text><path d="M108.5 314C108.5 290 172 290 172 312" fill="none" stroke="#9eb4c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M235.5 314C235.5 290 172 290 172 312" fill="none" stroke="#9eb4c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M290.5 314C290.5 290 172 290 172 312" fill="none" stroke="#9eb4c4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M222 390H560" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="570" y="362" width="150" height="56" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="645" y="386.9" font-size="17" fill="#4a6a80" text-anchor="middle" font-weight="650">上下文计算</text><text x="645" y="407.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">读取其他位置</text><path d="M724 390H770" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="780" y="380" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="802" y="380" width="20" height="20" rx="3" fill="#e3eee3" stroke="none"/><rect x="824" y="380" width="20" height="20" rx="3" fill="#3d7058" stroke="none"/><rect x="846" y="380" width="20" height="20" rx="3" fill="#c9dcc9" stroke="none"/><text x="780" y="425" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">偏向“水果”</text><text x="38" y="448" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">两处“苹果”的编号相同，查出的初始向量完全相同（棕色）；虚线表示上下文计算读取的其他位置，输出向量因此不同。色块为示意。</text></svg>