<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-labelledby="title desc"><title id="title">右移与因果掩码的作用</title><desc id="desc">三种设置下第 2 个位置能读到的信息。不右移时输入本身就是标签；右移但不加掩码时，可以读取右侧恰好等于标签的输入；右移并加因果掩码时，只能读取 &lt;bos&gt; 与“我”。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="476" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">右移与因果掩码缺一不可</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">以预测“喜欢”的第 2 个位置为例</text><rect x="38" y="86" width="284" height="340" rx="10" fill="#f6f7f4" stroke="none"/><text x="180" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">① 不右移</text><rect x="41" y="285" width="62" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="72" y="304.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="500">我</text><rect x="41" y="145" width="62" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="72" y="164.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">我</text><path d="M72 284L72 178" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="113" y="285" width="62" height="30" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="144" y="304.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="500">喜欢</text><rect x="113" y="145" width="62" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="144" y="164.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">喜欢</text><path d="M144 284L144 178" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="185" y="285" width="62" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="216" y="304.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="500">你</text><rect x="185" y="145" width="62" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="216" y="164.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">你</text><path d="M216 284L216 178" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="257" y="285" width="62" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="288" y="304.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="500">&lt;eos&gt;</text><rect x="257" y="145" width="62" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="288" y="164.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">&lt;eos&gt;</text><path d="M288 284L288 178" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M72 284C72 250 144 250 144 284" fill="none" stroke="#9eb4c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M216 284C216 250 144 250 144 284" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M288 284C288 250 144 250 144 284" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><text x="180" y="216.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">位置 2 可以读取的输入</text><rect x="56" y="340" width="248" height="70" rx="8" fill="#f6ebe7" stroke="#c99787"/><text x="180" y="367.3" font-size="15" fill="#a4604b" text-anchor="middle" font-weight="650">标签泄露</text><text x="180" y="392.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">输入 2 本身就是答案“喜欢”</text><text x="180" y="190.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">↑ 标签</text><text x="180" y="330.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">↓ 输入</text><rect x="338" y="86" width="284" height="340" rx="10" fill="#f6f7f4" stroke="none"/><text x="480" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">② 右移，但无掩码</text><rect x="341" y="285" width="62" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="372" y="304.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><rect x="341" y="145" width="62" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="372" y="164.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">我</text><path d="M372 284L372 178" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="413" y="285" width="62" height="30" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="444" y="304.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="500">我</text><rect x="413" y="145" width="62" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="444" y="164.9" font-size="14" fill="