<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title desc"><title id="title">注意力三步计算的数值示例</title><desc id="desc">以“你”为查询，三个分数 1.2、2.6、1.8 经 softmax 得到权重 0.1454、0.5896、0.2649，再对三个 Value 加权求和得到 [−0.1195, 1.4442]。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="442" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">注意力的三个步骤（以第 3 个位置“你”为查询）</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">打分 → softmax 归一化 → 对 Value 加权求和</text><rect x="38" y="90" width="200" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="138" y="121.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">① 匹配分数 sᵢⱼ</text><rect x="290" y="90" width="200" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="390" y="121.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">② 权重 αᵢⱼ</text><rect x="542" y="90" width="200" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="642" y="121.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">③ 加权 Value</text><text x="58" y="165" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">我</text><rect x="110" y="146" width="48" height="28" rx="4" fill="#d8c9a8" stroke="none"/><text x="164" y="165" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">1.2</text><text x="310" y="165" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">我</text><rect x="352" y="146" width="21.8" height="28" rx="4" fill="#94b79a" stroke="none"/><text x="379.81082556688045" y="165" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">0.1454</text><text x="562" y="156" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">0.145 × [1, 0]</text><text x="562" y="178" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="600">= [0.145, 0.000]</text><text x="58" y="237" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">喜欢</text><rect x="110" y="218" width="104" height="28" rx="4" fill="#d8c9a8" stroke="none"/><text x="220" y="237" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">2.6</text><text x="310" y="237" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">喜欢</text><rect x="352" y="218" width="88.4" height="28" rx="4" fill="#94b79a" stroke="none"/><text x="446.44725911566866" y="237" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">0.5896</text><text x="562" y="228" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">0.590 × [0, 2]</text><text x="562" y="250" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="600">= [0.000, 1.179]</text><text x="58" y="309" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">你</text><rect x="110" y="290" width="72" height="28" rx="4" fill="#d8c9a8" stroke="none"/><text x="188" y="309" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">1.8</text><text x="310" y="309" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">你</text><rect x="352" y="290" width="39.7" height="28" rx="4" fill="#94b79a" stroke="none"/><text x="397.7419153174509" y="309" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">0.2649</text><text x="562" y="300" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">0.265 × [−1, 1]</text><text x="562" y="322" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="600">= [−0.265, 0.265]</text><path d="M242 240H284" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M494 240H536" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="140" y="376.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">可正可负，无总和约束</text><text x="390" y="376.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">非负，和为 1</text><text x="642" y="376.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">按行相加</text><path d="M746 240H780" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="786" y="196" width="136" height="88" rx="10" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="854" y="229.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="700">输出 o₃</text><text x="854" y="258.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="650">[−0.1195, 1.4442]</text><text x="38" y="420" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">此处分数未除以 √dₖ，与第 1.2 节一致；第 4 节给出缩放后的结果。</text></svg>