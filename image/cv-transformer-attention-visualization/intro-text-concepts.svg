<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-labelledby="title desc"><title id="title">文本表示的三个概念</title><desc id="desc">Token是文本切分的基本单位，Embedding为每个Token提供可学习的向量，位置编码提供其在序列中的位置线索。条形图仅示意向量包含多个分量，不表示具体参数。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#748d9c" stroke-width="1.7"/></marker><style>text{font-family:Inter,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="1" y="1" width="958" height="406" rx="18" fill="#fbfcfe" stroke="#dfe6ed"/><rect x="24" y="24" width="280" height="306" rx="12" fill="#eef5fd" stroke="none"/><text x="48" y="67" font-size="26" fill="#263b4b" font-weight="650" text-anchor="start">Token</text><text x="48" y="100" font-size="20" fill="#677e8c" font-weight="400" text-anchor="start">文本的基本单位</text><rect x="340" y="24" width="280" height="306" rx="12" fill="#eef7f3" stroke="none"/><text x="364" y="67" font-size="26" fill="#263b4b" font-weight="650" text-anchor="start">Embedding</text><text x="364" y="100" font-size="20" fill="#677e8c" font-weight="400" text-anchor="start">可学习的向量表示</text><rect x="656" y="24" width="280" height="306" rx="12" fill="#f7f1e8" stroke="none"/><text x="680" y="67" font-size="26" fill="#263b4b" font-weight="650" text-anchor="start">位置编码</text><text x="680" y="100" font-size="20" fill="#677e8c" font-weight="400" text-anchor="start">序列中的位置线索</text><rect x="56" y="164" width="65" height="53" rx="8" fill="#fff" stroke="#d4e0e8"/><text x="88" y="199" font-size="22" fill="#4d6576" font-weight="600" text-anchor="middle">我</text><rect x="129" y="164" width="65" height="53" rx="8" fill="#427b69" stroke="#d4e0e8"/><text x="161" y="199" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">喜欢</text><rect x="202" y="164" width="65" height="53" rx="8" fill="#fff" stroke="#d4e0e8"/><text x="234" y="199" font-size="22" fill="#4d6576" font-weight="600" text-anchor="middle">你</text><text x="164" y="281" font-size="19" fill="#617e95" font-weight="400" text-anchor="middle">例如：“我／喜欢／你”</text><rect x="430" y="127" width="100" height="44" rx="12" fill="#427b69" stroke="none"/><text x="480" y="157" font-size="22" fill="#fff" font-weight="600" text-anchor="middle">喜欢</text><rect x="386" y="203" width="22" height="43" rx="4" fill="#82bda5" stroke="none"/><rect x="418" y="174" width="22" height="72" rx="4" fill="#518c75" stroke="none"/><rect x="450" y="217" width="22" height="29" rx="4" fill="#a8cfbd" stroke="none"/><rect x="482" y="188" width="22" height="58" rx="4" fill="#82bda5" stroke="none"/><rect x="514" y="164" width="22" height="82" rx="4" fill="#518c75" stroke="none"/><rect x="546" y="207" width="22" height="39" rx="4" fill="#a8cfbd" stroke="none"/><text x="480" y="281" font-size="19" fill="#648675" font-weight="400" text-anchor="middle">一个 token 对应一个向量</text><path d="M690 190H898" fill="none" stroke="#c5ae8b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M712 181V199" fill="none" stroke="#b09b7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="712" y="230" font-size="21" fill="#856e51" font-weight="400" text-anchor="middle">0</text><path d="M778 181V199" fill="none" stroke="#b09b7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="778" y="230" font-size="21" fill="#856e51" font-weight="400" text-anchor="middle">1</text><path d="M844 181V199" fill="none" stroke="#b09b7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="844" y="230" font-size="21" fill="#856e51" font-weight="400" text-anchor="middle">2</text><circle cx="778" cy="190" r="13" fill="#427b69" stroke="none" stroke-width="2"/><rect x="728" y="127" width="100" height="40" rx="12" fill="#fff" stroke="none"/><text x="778" y="155" font-size="22" fill="#427b69" font-weight="600" text-anchor="middle">喜欢</text><text x="796" y="281" font-size="18" fill="#927853" font-weight="400" text-anchor="middle">相同的词可以处于不同位置</text><text x="480" y="374" font-size="23" fill="#3b5668" font-weight="500" text-anchor="middle">词嵌入提供内容表示，位置编码提供顺序信息。</text></svg>