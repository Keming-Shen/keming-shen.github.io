<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc"><title id="title">两层 MLP 的一次前向计算</title><desc id="desc">输入2和负1，经三个ReLU隐藏单元得到1.5、0、3，最终输出负1.4和1.4。绿色为正权重，红色为负权重，灰色虚线为当前未激活单元的输出连接。</desc><defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.7"/></marker><linearGradient id="mic" x1="0" x2="1"><stop stop-color="#153b5a"/><stop offset=".5" stop-color="#438ab8"/><stop offset="1" stop-color="#153b5a"/></linearGradient><linearGradient id="soft" x2="0" y2="1"><stop stop-color="#edf7ff"/><stop offset="1" stop-color="#dceef8"/></linearGradient></defs><rect width="1000" height="475" fill="#fff"/><text x="152" y="42" text-anchor="middle" font-size="24" fill="#182e43" font-weight="600">输入 x</text><text x="493" y="42" text-anchor="middle" font-size="24" fill="#182e43" font-weight="600">隐藏层：仿射变换 + ReLU</text><text x="848" y="42" text-anchor="middle" font-size="24" fill="#182e43" font-weight="600">输出 z</text><path d="M197 155L435 108" fill="none" stroke="#3a8c75" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 155L435 240" fill="none" stroke="#cc654e" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 155L435 372" fill="none" stroke="#3a8c75" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 322L435 108" fill="none" stroke="#3a8c75" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 322L435 240" fill="none" stroke="#3a8c75" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 322L435 372" fill="none" stroke="#cc654e" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M549 108L803 170" fill="none" stroke="#3a8c75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M549 108L803 315" fill="none" stroke="#cc654e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M549 240L803 170" fill="none" stroke="#b9c3cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><path d="M549 240L803 315" fill="none" stroke="#b9c3cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><path d="M549 372L803 170" fill="none" stroke="#cc654e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M549 372L803 315" fill="none" stroke="#3a8c75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="152" cy="155" r="43" fill="#e4f1fa" stroke="#347bb8" stroke-width="2"/><text x="152" y="165" text-anchor="middle" font-size="30" fill="#182e43" font-weight="600">2</text><circle cx="152" cy="322" r="43" fill="#e4f1fa" stroke="#347bb8" stroke-width="2"/><text x="152" y="332" text-anchor="middle" font-size="30" fill="#182e43" font-weight="600">−1</text><rect x="435" y="66" width="114" height="84" rx="12" fill="#e4f1fa" stroke="#347bb8" stroke-width="1.8"/><text x="492" y="99" text-anchor="middle" font-size="17" fill="#587086" font-weight="400">a = 1.5</text><text x="492" y="131" text-anchor="middle" font-size="24" fill="#182e43" font-weight="600">h = 1.5</text><rect x="435" y="198" width="114" height="84" rx="12" fill="#f3f5f7" stroke="#bdc8d0" stroke-width="1.8"/><text x="492" y="231" text-anchor="middle" font-size="17" fill="#587086" font-weight="400">a = −2.5</text><text x="492" y="263" text-anchor="middle" font-size="24" fill="#587086" font-weight="600">h = 0</text><rect x="435" y="330" width="114" height="84" rx="12" fill="#e4f1fa" stroke="#347bb8" stroke-width="1.8"/><text x="492" y="363" text-anchor="middle" font-size="17" fill="#587086" font-weight="400">a = 3</text><text x="492" y="395" text-anchor="middle" font-size="24" fill="#182e43" font-weight="600">h = 3</text><circle cx="848" cy="170" r="43" fill="#edf7f3" stroke="#3a8c75" stroke-width="2"/><text x="848" y="179" text-anchor="middle" font-size="27" fill="#182e43" font-weight="600">−1.4</text><circle cx="848" cy="315" r="43" fill="#edf7f3" stroke="#3a8c75" stroke-width="2"/><text x="848" y="324" text-anchor="middle" font-size="27" fill="#182e43" font-weight="600">1.4</text><text x="500" y="447" text-anchor="middle" font-size="18" fill="#3a8c75" font-weight="500">正权重</text><path d="M345 441H398" fill="none" stroke="#3a8c75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="662" y="447" text-anchor="middle" font-size="18" fill="#cc654e" font-weight="500">负权重</text><path d="M552 441H604" fill="none" stroke="#cc654e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>