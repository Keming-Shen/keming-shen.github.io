<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="title desc"><title id="title">机器翻译的编码器与解码器</title><desc id="desc">输入中文雨停了。编码器产生多个源位置的表示，解码器结合源表示和目标前缀，输出英文The rain has stopped。梯形用于表示两类模块。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="372" rx="14" fill="#fcfcfa" stroke="none"/><text x="113" y="86" font-size="21" fill="#71838b" text-anchor="middle" font-weight="400">输入</text><text x="847" y="86" font-size="21" fill="#71838b" text-anchor="middle" font-weight="400">输出</text><text x="113" y="187" font-size="30" fill="#405d71" text-anchor="middle" font-weight="400">雨停了。</text><text x="847" y="170" font-size="24" fill="#59785e" text-anchor="middle" font-weight="400">The rain</text><text x="847" y="209" font-size="24" fill="#59785e" text-anchor="middle" font-weight="400">has stopped.</text><path d="M214 176H258" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M277 98L420 139V213L277 254Z" fill="#e4eff6" stroke="#92b0c3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="333" y="179" font-size="25" fill="#3f6981" text-anchor="middle" font-weight="600">编码器</text><text x="338" y="283" font-size="18" fill="#7c94a3" text-anchor="middle" font-weight="400">Encoder</text><path d="M430 176H466" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="481" y="123" width="58" height="19" rx="3" fill="#a5c2cf" stroke="none"/><rect x="481" y="152" width="58" height="19" rx="3" fill="#b6ccd8" stroke="none"/><rect x="481" y="181" width="58" height="19" rx="3" fill="#91b1c0" stroke="none"/><rect x="481" y="210" width="58" height="19" rx="3" fill="#c4d6df" stroke="none"/><text x="510" y="80" font-size="21" fill="#6e8593" text-anchor="middle" font-weight="400">源序列表示</text><path d="M550 176H587" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M605 139L747 98V254L605 213Z" fill="#ebf1e5" stroke="#a5b99d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="683" y="179" font-size="25" fill="#5a7651" text-anchor="middle" font-weight="600">解码器</text><text x="680" y="283" font-size="18" fill="#8b9b7e" text-anchor="middle" font-weight="400">Decoder</text><path d="M755 176H785" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="337" font-size="21" fill="#6c808b" text-anchor="middle" font-weight="400">编码器表示源句，解码器结合源表示与目标前缀生成译文。</text></svg>