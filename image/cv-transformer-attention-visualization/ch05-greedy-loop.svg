<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-labelledby="title desc"><title id="title">贪心生成的循环</title><desc id="desc">前缀初始化为开始标记；每一步把源句与前缀送入模型，取最后一个位置的 logits 做 argmax，把结果拼接到前缀；若生成结束标记则停止，否则回到模型继续，直到达到最大长度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="462" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">贪心生成的循环</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">每一步只取最后一个位置的 logits</text><rect x="40" y="120" width="150" height="62" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="115" y="147.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="650">prefix = [&lt;bos&gt;]</text><text x="115" y="168.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">初始化</text><rect x="240" y="120" width="170" height="62" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="325" y="147.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">model(src, prefix)</text><text x="325" y="168.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">→ [1, t, V]</text><rect x="460" y="120" width="170" height="62" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="545" y="147.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">logits[:, −1, :]</text><text x="545" y="168.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">最后一个位置 → [1, V]</text><rect x="680" y="120" width="120" height="62" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="740" y="147.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">argmax</text><text x="740" y="168.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">→ next_id</text><path d="M192 151L236 151" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M412 151L456 151" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M632 151L676 151" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="680" y="236" width="120" height="62" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="740" y="263.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">拼接</text><text x="740" y="284.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">prefix += next_id</text><path d="M740 184L740 232" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M740 300V332" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M740 336L800 366L740 396L680 366Z" fill="#f6ebe7" stroke="#c99787" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="740" y="370.9" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="650">&lt;eos&gt;？</text><path d="M802 366H850" fill="none" stroke="#6d9580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="856" y="338" width="86" height="56" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="899" y="362.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">结束</text><text x="899" y="383.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">返回</text><text x="810" y="356" font-size="13" fill="#3d7058" text-anchor="start" font-weight="400">是</text><path d="M678 366H325V188" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="470" y="356" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">否，且未达到 max_new_tokens：回到模型</text><text x="38" y="440" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">本实现每一步都把完整前缀重新送入模型，第 t 步的计算量随 t 增长；第 11 章的 KV 缓存只为新位置计算键和值。</text></svg>