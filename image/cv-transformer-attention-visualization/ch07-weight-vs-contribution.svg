<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">注意力权重与实际贡献</title><desc id="desc">三个位置的权重为 0.1、0.2、0.7，Value 范数为 2.0、1.5、0.1，贡献分别为 0.20、0.30、0.07。权重最大的位置贡献最小。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="440" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">权重大 ≠ 贡献大</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">输出 = Σ αⱼ vⱼ：贡献同时取决于权重与 Value 的大小</text><rect x="38" y="92" width="280" height="270" rx="10" fill="#f6f7f4" stroke="none"/><text x="178" y="123.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">注意力权重 αⱼ</text><rect x="78" y="297.1" width="50" height="22.9" rx="4" fill="#94b79a" stroke="none"/><text x="103" y="293.7" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">0.1</text><text x="103" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 1</text><rect x="154" y="274.3" width="50" height="45.7" rx="4" fill="#94b79a" stroke="none"/><text x="179" y="270.8" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">0.2</text><text x="179" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 2</text><rect x="230" y="160" width="50" height="160" rx="4" fill="#94b79a" stroke="none"/><text x="255" y="156.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">0.7</text><text x="255" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 3</text><path d="M62 320L294 320" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="92" width="280" height="270" rx="10" fill="#f6f7f4" stroke="none"/><text x="480" y="123.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">Value 的范数 ‖vⱼ‖</text><rect x="380" y="160" width="50" height="160" rx="4" fill="#91b1c0" stroke="none"/><text x="405" y="156.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">2.0</text><text x="405" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 1</text><rect x="456" y="200" width="50" height="120" rx="4" fill="#91b1c0" stroke="none"/><text x="481" y="196.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">1.5</text><text x="481" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 2</text><rect x="532" y="312" width="50" height="8" rx="4" fill="#91b1c0" stroke="none"/><text x="557" y="308.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="650">0.1</text><text x="557" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 3</text><path d="M364 320L596 320" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="642" y="92" width="280" height="270" rx="10" fill="#f6f7f4" stroke="none"/><text x="782" y="123.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">贡献 αⱼ‖vⱼ‖</text><rect x="682" y="213.3" width="50" height="106.7" rx="4" fill="#d8c9a8" stroke="none"/><text x="707" y="209.9" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="650">0.20</text><text x="707" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 1</text><rect x="758" y="160" width="50" height="160" rx="4" fill="#d8c9a8" stroke="none"/><text x="783" y="156.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="650">0.30</text><text x="783" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 2</text><rect x="834" y="282.7" width="50" height="37.3" rx="4" fill="#d8c9a8" stroke="none"/><text x="859" y="279.2" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="650">0.07</text><text x="859" y="344.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置 3</text><path d="M666 320L898 320" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="394" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">位置 3 的权重最大（0.7），但它的 Value 很小，实际贡献只有 0.07，反而是权重最小的位置 1 贡献最多。数值为示意。</text><text x="38" y="418" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">此外，输出还要经过输出投影、残差与后续各层，因此注意力权重只能作为分析线索。</text></svg>