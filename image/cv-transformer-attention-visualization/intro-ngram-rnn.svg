<svg xmlns="http://www.w3.org/2000/svg" width="960" height="449" viewBox="0 0 960 449" role="img" aria-labelledby="title desc"><title id="title">n-gram 与循环神经网络</title><desc id="desc">给定今天深圳天气很，三元模型只以天气和很两个词为条件。循环网络依次读取前缀，将隐藏状态传至下一位置。图中好只是一种下一词候选。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="449" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="47" font-size="25" fill="#293e4b" text-anchor="start" font-weight="650">三元语言模型</text><text x="38" y="78" font-size="18" fill="#71838b" text-anchor="start" font-weight="400">固定长度的上下文</text><rect x="412" y="87" width="216" height="63" rx="8" fill="#edf3ed" stroke="none"/><text x="245" y="128" font-size="29" fill="#aeb6ba" text-anchor="middle" font-weight="400">今天</text><text x="355" y="128" font-size="29" fill="#aeb6ba" text-anchor="middle" font-weight="400">深圳</text><text x="465" y="128" font-size="29" fill="#3d7058" text-anchor="middle" font-weight="600">天气</text><text x="575" y="128" font-size="29" fill="#3d7058" text-anchor="middle" font-weight="600">很</text><path d="M421 161V169H622V161" fill="none" stroke="#6d9580" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="522" y="199" font-size="18" fill="#648674" text-anchor="middle" font-weight="400">前两个词</text><path d="M650 116H745" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="802" y="128" font-size="29" fill="#3d7058" text-anchor="middle" font-weight="600">好</text><text x="802" y="170" font-size="18" fill="#71838b" text-anchor="middle" font-weight="400">下一词候选</text><path d="M38 221H922" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x=