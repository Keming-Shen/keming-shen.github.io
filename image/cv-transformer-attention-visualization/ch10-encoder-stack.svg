<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="title desc"><title id="title">编码器逐层吸收上下文</title><desc id="desc">5 个源位置经过 3 层编码器。每一层中，第 3 个位置都读取上一层全部 5 个位置的表示，层数越多，可组合的上下文关系越复杂。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="472" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">编码器层层交互：同一位置的表示逐层吸收上下文</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">以 5 个源位置为例，展示第 3 个位置在各层中的依赖（示意）</text><text x="90" y="405" font-size="14" fill="#5c747d" text-anchor="end" font-weight="600">输入</text><circle cx="180" cy="400" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><text x="180" y="438.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">I</text><circle cx="300" cy="400" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><text x="300" y="438.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">like</text><circle cx="420" cy="400" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><text x="420" y="438.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">you</text><circle cx="540" cy="400" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><text x="540" y="438.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">very</text><circle cx="660" cy="400" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><text x="660" y="438.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">much</text><text x="90" y="315" font-size="14" fill="#5c747d" text-anchor="end" font-weight="600">第 1 层</text><circle cx="180" cy="310" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="300" cy="310" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="420" cy="310" r="18" fill="#edf3ed" stroke="#3d7058" stroke-width="2.4"/><circle cx="540" cy="310" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="660" cy="310" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><path d="M180 382L420 328" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M300 382L420 328" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M420 382L420 328" fill="none" stroke="#6d9580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 382L420 328" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M660 382L420 328" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><text x="90" y="225" font-size="14" fill="#5c747d" text-anchor="end" font-weight="600">第 2 层</text><circle cx="180" cy="220" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="300" cy="220" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="420" cy="220" r="18" fill="#edf3ed" stroke="#3d7058" stroke-width="2.4"/><circle cx="540" cy="220" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="660" cy="220" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><path d="M180 292L420 238" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M300 292L420 238" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M420 292L420 238" fill="none" stroke="#6d9580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 292L420 238" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M660 292L420 238" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><text x="90" y="135" font-size="14" fill="#5c747d" text-anchor="end" font-weight="600">第 3 层</text><circle cx="180" cy="130" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="300" cy="130" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="420" cy="130" r="18" fill="#edf3ed" stroke="#3d7058" stroke-width="2.4"/><circle cx="540" cy="130" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><circle cx="660" cy="130" r="18" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4"/><path d="M180 202L420 148" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M300 202L420 148" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M420 202L420 148" fill="none" stroke="#6d9580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 202L420 148" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="M660 202L420 148" fill="none" stroke="#6d9580" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><rect x="720" y="110" width="202" height="300" rx="8" fill="#f6f7f4" stroke="none"/><text x="734" y="140" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">自注意力让每层的每个</text><text x="734" y="166" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">位置都能读取全部位置。</text><text x="734" y="192" font-size="13" fill="#71838b" text-anchor="start" font-weight="400"></text><text x="734" y="218" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">第 2 层读到的已经是</text><text x="734" y="244" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">“包含上下文的表示”，</text><text x="734" y="270" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">因此能组合出更复杂的</text><text x="734" y="296" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">关系，例如先确定 very</text><text x="734" y="322" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">修饰 much，再判断二者</text><text x="734" y="348" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">共同修饰 like。</text><text x="38" y="452" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">为简洁起见，图中只画出第 3 个位置在每一层的输入连线；每层还包括逐位置 FFN、残差与 LayerNorm。</text></svg>