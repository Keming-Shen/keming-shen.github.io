<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" role="img" aria-labelledby="title desc"><title id="title">位置编码方案的作用位置</title><desc id="desc">正余弦编码与可学习绝对位置加在 token 嵌入上；RoPE 作用在投影后的 Q、K 上；相对位置偏置（T5、ALiBi）直接加在点积分数上。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="446" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">位置信息注入在哪里</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">四类方案作用于注意力计算的不同位置</text><text x="38" y="104" font-size="15" fill="#4a6a80" text-anchor="start" font-weight="650">正余弦（原始 Transformer）</text><text x="38" y="124" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">固定函数，加到输入上</text><rect x="54" y="133" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="110" y="152.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">token 嵌入</text><text x="210" y="155" font-size="20" fill="#71838b" text-anchor="middle" font-weight="700">+</text><rect x="264" y="133" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="320" y="152.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">投影 Q、K</text><path d="M378 148L422 148" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="424" y="133" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="480" y="152.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">点积 QKᵀ</text><path d="M538 148L582 148" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="584" y="133" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="640" y="152.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">softmax</text><rect x="50" y="130" width="120" height="36" rx="8" fill="none" stroke="#4a6a80" stroke-width="2.4"/><text x="720" y="153" font-size="13" fill="#4a6a80" text-anchor="start" font-weight="400">可外推，但分数含绝对位置项</text><text x="38" y="188" font-size="15" fill="#8f7857" text-anchor="start" font-weight="650">可学习绝对位置（BERT、GPT-2、ViT）</text><text x="38" y="208" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">每个位置一个可训练向量</text><rect x="54" y="217" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="110" y="236.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">token 嵌入</text><text x="210" y="239" font-size="20" fill="#71838b" text-anchor="middle" font-weight="700">+</text><rect x="264" y="217" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="320" y="236.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">投影 Q、K</text><path d="M378 232L422 232" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="424" y="217" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="480" y="236.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">点积 QKᵀ</text><path d="M538 232L582 232" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="584" y="217" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="640" y="236.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">softmax</text><rect x="50" y="214" width="120" height="36" rx="8" fill="none" stroke="#8f7857" stroke-width="2.4"/><text x="720" y="237" font-size="13" fill="#8f7857" text-anchor="start" font-weight="400">受限于预设的最大长度</text><text x="38" y="272" font-size="15" fill="#3d7058" text-anchor="start" font-weight="650">相对位置偏置（T5、ALiBi）</text><text x="38" y="292" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">按距离给分数加偏置</text><rect x="54" y="301" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="110" y="320.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">token 嵌入</text><text x="210" y="323" font-size="20" fill="#71838b" text-anchor="middle" font-weight="700">+</text><rect x="264" y="301" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="320" y="320.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">投影 Q、K</text><path d="M378 316L422 316" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="424" y="301" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="480" y="320.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">点积 QKᵀ</text><path d="M538 316L582 316" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="584" y="301" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="640" y="320.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">softmax</text><rect x="420" y="298" width="120" height="36" rx="8" fill="none" stroke="#3d7058" stroke-width="2.4"/><text x="720" y="321" font-size="13" fill="#3d7058" text-anchor="start" font-weight="400">ALiBi 偏置 = −m·|i − j|，无参数</text><text x="38" y="356" font-size="15" fill="#a4604b" text-anchor="start" font-weight="650">RoPE（LLaMA 等）</text><text x="38" y="376" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">按位置旋转 Q、K</text><rect x="54" y="385" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="110" y="404.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">token 嵌入</text><text x="210" y="407" font-size="20" fill="#71838b" text-anchor="middle" font-weight="700">+</text><rect x="264" y="385" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="320" y="404.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">投影 Q、K</text><path d="M378 400L422 400" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="424" y="385" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="480" y="404.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">点积 QKᵀ</text><path d="M538 400L582 400" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="584" y="385" width="112" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="640" y="404.6" font-size="13" fill="#8a979d" text-anchor="middle" font-weight="500">softmax</text><rect x="260" y="382" width="120" height="36" rx="8" fill="none" stroke="#a4604b" stroke-width="2.4"/><text x="720" y="405" font-size="13" fill="#a4604b" text-anchor="start" font-weight="400">点积只依赖相对距离，不改 V</text></svg>