<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="title desc"><title id="title">Post-LN 与 Pre-LN 的结构对比</title><desc id="desc">Post-LN 中输入经子层后与短路相加，再经 LayerNorm，归一化位于残差主干上。Pre-LN 中输入先经 LayerNorm 再进子层，结果与短路相加，主干上没有归一化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="526" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">Post-LN 与 Pre-LN</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">区别在于 LayerNorm 位于残差主干上，还是位于分支内部</text><rect x="38" y="86" width="430" height="390" rx="10" fill="#f6f7f4" stroke="none"/><text x="253" y="118" font-size="17" fill="#a4604b" text-anchor="middle" font-weight="700">Post-LN（原始 Transformer）</text><rect x="88" y="425" width="60" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="118" y="445.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">x</text><text x="118" y="140.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">输出</text><path d="M118 424L118 268" fill="none" stroke="#3d7058" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M118 390H243V342" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="173" y="290" width="140" height="50" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="243" y="311.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">子层</text><text x="243" y="332.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">MHA / FFN</text><path d="M243 288V250H138" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="118" cy="250" r="17" fill="#fcfcfa" stroke="#293e4b" stroke-width="2"/><text x="118" y="257" font-size="20" fill="#293e4b" text-anchor="middle" font-weight="700">+</text><path d="M118 232L118 212" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="74" y="170" width="88" height="40" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="118" y="195.3" font-size="15" fill="#a4604b" text-anchor="middle" font-weight="650">LN</text><path d="M118 168L118 148" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="338" y="150" width="118" height="130" rx="8" fill="#f6ebe7" stroke="#c99787"/><text x="348" y="172" font-size="12" fill="#a4604b" text-anchor="start" font-weight="650">y = LN(x + F(x))</text><text x="348" y="194" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">LN 在主干上</text><text x="348" y="216" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">打断恒等路径</text><text x="348" y="238" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">需学习率预热</text><text x="348" y="260" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">成功时效果常略好</text><rect x="492" y="86" width="430" height="390" rx="10" fill="#f6f7f4" stroke="none"/><text x="707" y="118" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="700">Pre-LN（GPT-2 及多数大模型）</text><rect x="542" y="425" width="60" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="572" y="445.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">x</text><text x="572" y="140.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">输出</text><path d="M572 424L572 188" fill="none" stroke="#3d7058" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M572 390H697V372" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="647" y="330" width="100" height="40" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="697" y="355.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="650">LN</text><path d="M697 328L697 300" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="627" y="248" width="140" height="50" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="697" y="269.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">子层</text><text x="697" y="290.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">MHA / FFN</text><path d="M697 246V170H592" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="572" cy="170" r="17" fill="#fcfcfa" stroke="#293e4b" stroke-width="2"/><text x="572" y="177" font-size="20" fill="#293e4b" text-anchor="middle" font-weight="700">+</text><path d="M572 152L572 148" fill="none" stroke="#3d7058" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="792" y="150" width="118" height="152" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="802" y="172" font-size="12" fill="#3d7058" text-anchor="start" font-weight="650">y = x + F(LN(x))</text><text x="802" y="194" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">主干上无归一化</text><text x="802" y="216" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">恒等路径贯通</text><text x="802" y="238" font-size="12" fill="#5c747d" text-anchor="start" font-weight="400">深层训练更稳定</text><text x="802" y="260" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">末尾再加一个 LN</text><text x="802" y="282" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">norm_first=True</text><text x="38" y="504" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">绿色粗线为残差主干。PyTorch 的 TransformerEncoderLayer 用 norm_first 参数在两种结构之间切换。</text></svg>