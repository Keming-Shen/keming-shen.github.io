<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img" aria-labelledby="title desc"><title id="title">transpose 与 reshape 的区别</title><desc id="desc">形状 [2,3] 的张量，元素标为 (b,l)。transpose 后每一行包含同一位置的两个样本；reshape 按内存顺序切分，第二行变成 (b0,l2) 与 (b1,l0)，混合了两个样本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="368" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">transpose 与 reshape 的区别</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">同样得到 [3, 2]，元素的对应关系却不同</text><text x="170" y="113.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">原张量 [B=2, L=3]</text><rect x="56" y="130" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="93" y="155.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l0</text><rect x="134" y="130" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="171" y="155.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l1</text><rect x="212" y="130" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="249" y="155.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l2</text><rect x="56" y="176" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="93" y="201.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l0</text><rect x="134" y="176" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="171" y="201.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l1</text><rect x="212" y="176" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="249" y="201.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l2</text><text x="56" y="250" font-size="14" fill="#9aa7ad" text-anchor="start" font-weight="400">内存中的顺序：</text><rect x="56" y="262" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="81" y="287.3" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l0</text><rect x="110" y="262" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="135" y="287.3" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l1</text><rect x="164" y="262" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="189" y="287.3" font-size="11" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l2</text><rect x="218" y="262" width="50" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="243" y="287.3" font-size="11" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l0</text><rect x="272" y="262" width="50" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="297" y="287.3" font-size="11" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l1</text><rect x="326" y="262" width="50" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="351" y="287.3" font-size="11" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l2</text><text x="560" y="113.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">transpose(0, 1) → [L=3, B=2]</text><rect x="482" y="130" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="519" y="155.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l0</text><rect x="560" y="130" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="597" y="155.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l0</text><rect x="482" y="176" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="519" y="201.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l1</text><rect x="560" y="176" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="597" y="201.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l1</text><rect x="482" y="222" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="519" y="247.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l2</text><rect x="560" y="222" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="597" y="247.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l2</text><text x="560" y="294.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">每一行是同一位置的两个样本</text><text x="820" y="113.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">reshape(3, 2) → [3, 2]</text><rect x="742" y="130" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="779" y="155.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l0</text><rect x="820" y="130" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="857" y="155.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l1</text><rect x="742" y="176" width="74" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="779" y="201.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="600">b0, l2</text><rect x="820" y="176" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="857" y="201.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l0</text><rect x="742" y="222" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="779" y="247.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l1</text><rect x="820" y="222" width="74" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="857" y="247.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="600">b1, l2</text><rect x="736" y="172" width="162" height="50" rx="8" fill="none" stroke="#a4604b" stroke-width="2" stroke-dasharray="6 6"/><text x="820" y="294.9" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="500">第 2 行混合了两个样本</text><path d="M300 176H468" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="38" y="346" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">reshape 按内存顺序重新切分，不交换轴；它只在需要合并或拆分相邻轴（例如 [B, L, V] → [B·L, V]）时才等价于正确的操作。</text></svg>