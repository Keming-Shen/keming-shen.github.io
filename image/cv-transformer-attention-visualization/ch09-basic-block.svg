<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">ResNet 基本块的结构</title><desc id="desc">主分支依次为步幅 2 的 3×3 卷积、BatchNorm、ReLU、3×3 卷积、BatchNorm；短路分支为步幅 2 的 1×1 卷积加 BatchNorm；两路相加后经过 ReLU。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="400" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">ResNet 基本块：BasicBlock(16, 32, stride=2)</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">输入 [2, 16, 32, 32] → 输出 [2, 32, 16, 16]</text><rect x="45" y="132" width="50" height="36" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="70" y="155.9" font-size="17" fill="#4a6a80" text-anchor="middle" font-weight="500">x</text><rect x="120" y="120" width="112" height="60" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="176" y="146.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">Conv 3×3</text><text x="176" y="166.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">步幅 2 → [32, 16, 16]</text><path d="M106 150L118 150" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="248" y="120" width="112" height="60" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="304" y="155.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="650">BatchNorm</text><path d="M234 150L246 150" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="376" y="120" width="112" height="60" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="432" y="155.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">ReLU</text><path d="M362 150L374 150" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="504" y="120" width="112" height="60" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="560" y="146.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">Conv 3×3</text><text x="560" y="166.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">步幅 1 → [32, 16, 16]</text><path d="M490 150L502 150" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="632" y="120" width="112" height="60" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="688" y="155.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="650">BatchNorm</text><path d="M618 150L630 150" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="770" cy="150" r="16" fill="#fcfcfa" stroke="#293e4b" stroke-width="2"/><text x="770" y="157" font-size="20" fill="#293e4b" text-anchor="middle" font-weight="700">+</text><path d="M746 150L752 150" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="120" y="250" width="320" height="60" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="280" y="275.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">短路：Conv 1×1（步幅 2）+ BatchNorm</text><text x="280" y="297.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">[16, 32, 32] → [32, 16, 16]</text><path d="M70 170V280H116" fill="none" stroke="#6d9580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M444 280H770V168" fill="none" stroke="#6d9580" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M788 150L816 150" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="820" y="120" width="80" height="60" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="860" y="155.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">ReLU</text><text x="38" y="352" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">当步幅为 1 且通道数不变时，短路退化为恒等映射（nn.Identity）。50 层及更深的 ResNet 改用 1×1 → 3×3 → 1×1 的瓶颈块。</text><text x="38" y="378" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">与原始 Transformer 相同，基本块也在相加之后再接一个操作：这里是 ReLU，Transformer 中是 LayerNorm。</text></svg>