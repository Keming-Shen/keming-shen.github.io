<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc"><title id="title">计算图的前向与反向</title><desc id="desc">前向：w=2，u=3w=6，v=u−1=5，L=v²=25。反向：∂L/∂v=2v=10，∂L/∂u=10，∂L/∂w=10×3=30，写入 w.grad。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="404" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">计算图：前向求值，反向求梯度</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">L = (3w − 1)²，w = 2</text><rect x="30" y="130" width="160" height="64" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="110" y="158.9" font-size="17" fill="#4a6a80" text-anchor="middle" font-weight="650">w</text><text x="110" y="179.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">值 = 2</text><path d="M194 152L246 152" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="250" y="130" width="160" height="64" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="330" y="158.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="650">u = 3w</text><text x="330" y="179.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">值 = 6</text><path d="M414 152L466 152" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="470" y="130" width="160" height="64" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="550" y="158.9" font-size="17" fill="#8a979d" text-anchor="middle" font-weight="650">v = u − 1</text><text x="550" y="179.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">值 = 5</text><path d="M634 152L686 152" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="690" y="130" width="160" height="64" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="770" y="158.9" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="650">L = v²</text><text x="770" y="179.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">值 = 25</text><text x="38" y="112" font-size="15" fill="#708794" text-anchor="start" font-weight="650">前向</text><rect x="30" y="232" width="160" height="60" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="110" y="259.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">∂L/∂w = 30</text><text x="110" y="282.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">× ∂u/∂w = 3</text><rect x="250" y="232" width="160" height="60" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="330" y="259.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">∂L/∂u = 10</text><text x="330" y="282.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">× ∂v/∂u = 1</text><path d="M246 270L194 270" fill="none" stroke="#a88f63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><rect x="470" y="232" width="160" height="60" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="550" y="259.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">∂L/∂v = 10</text><text x="550" y="282.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">= 2v</text><path d="M466 270L414 270" fill="none" stroke="#a88f63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><rect x="690" y="232" width="160" height="60" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="770" y="259.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">∂L/∂L = 1</text><text x="770" y="282.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">起点</text><path d="M686 270L634 270" fill="none" stroke="#a88f63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="38" y="318" font-size="15" fill="#a88f63" text-anchor="start" font-weight="650">反向</text><rect x="30" y="338" width="160" height="46" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="110" y="366.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">w.grad = 30</text><path d="M110 296V334" fill="none" stroke="#9eb4c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><text x="214" y="366" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">每个节点的梯度 = 下游传来的梯度 × 本节点的局部导数；backward() 自动完成这一链式计算。</text></svg>