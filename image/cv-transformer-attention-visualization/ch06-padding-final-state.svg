<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" role="img" aria-labelledby="title desc"><title id="title">补齐对 RNN 最终状态的影响</title><desc id="desc">源句 I like you 被补齐到长度 5。RNN 在两个 &lt;pad&gt; 上继续递推得到 h5，它不等于真实句末状态 h3；需要记录有效长度并打包序列。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="416" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">补齐之后的“最终状态”并不是句末状态</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">RNN 会在 &lt;pad&gt; 上继续递推</text><rect x="71" y="285" width="78" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="110" y="305.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">I</text><path d="M110 284L110 236" fill="none" stroke="#9eb4c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><circle cx="110" cy="210" r="24" fill="#fcfcfa" stroke="#9eb4c4" stroke-width="2"/><text x="110" y="215.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₁</text><path d="M136 210L222 210" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="211" y="285" width="78" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="250" y="305.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">like</text><path d="M250 284L250 236" fill="none" stroke="#9eb4c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><circle cx="250" cy="210" r="24" fill="#fcfcfa" stroke="#9eb4c4" stroke-width="2"/><text x="250" y="215.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₂</text><path d="M276 210L362 210" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="351" y="285" width="78" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="390" y="305.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">you</text><path d="M390 284L390 236" fill="none" stroke="#9eb4c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><circle cx="390" cy="210" r="24" fill="#fcfcfa" stroke="#9eb4c4" stroke-width="2"/><text x="390" y="215.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₃</text><path d="M416 210L502 210" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="491" y="285" width="78" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="530" y="305.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="500">&lt;pad&gt;</text><path d="M530 284L530 236" fill="none" stroke="#9aa7ad" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="530" cy="210" r="24" fill="#f3f4f2" stroke="#c9d0d3" stroke-width="2"/><text x="530" y="215.6" font-size="16" fill="#9aa7ad" text-anchor="middle" font-weight="650">h₄</text><path d="M556 210L642 210" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="631" y="285" width="78" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="670" y="305.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="500">&lt;pad&gt;</text><path d="M670 284L670 236" fill="none" stroke="#9aa7ad" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="670" cy="210" r="24" fill="#f3f4f2" stroke="#c9d0d3" stroke-width="2"/><text x="670" y="215.6" font-size="16" fill="#9aa7ad" text-anchor="middle" font-weight="650">h₅</text><rect x="346" y="160" width="88" height="100" rx="10" fill="none" stroke="#3d7058" stroke-width="2"/><text x="390" y="150.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">真实句末 h₃</text><rect x="626" y="160" width="88" height="100" rx="10" fill="none" stroke="#a4604b" stroke-width="2" stroke-dasharray="6 6"/><text x="670" y="150.9" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="650">直接取最后一个</text><rect x="760" y="170" width="164" height="80" rx="8" fill="#f6f7f4" stroke="none"/><text x="774" y="198" font-size="16" fill="#a4604b" text-anchor="start" font-weight="650">h₅ ≠ h₃</text><text x="774" y="222" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">即使 &lt;pad&gt; 嵌入为零，</text><text x="774" y="240" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">状态仍经过两次递推</text><rect x="38" y="346" width="884" height="50" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="58" y="376" font-size="15" fill="#3d7058" text-anchor="start" font-weight="400">做法：记录每条序列的有效长度，用 pack_padded_sequence 打包，RNN 只在有效位置上递推。</text></svg>