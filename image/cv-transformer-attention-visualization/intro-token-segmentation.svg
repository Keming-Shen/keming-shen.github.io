<svg xmlns="http://www.w3.org/2000/svg" width="960" height="246" viewBox="0 0 960 246" role="img" aria-labelledby="title desc"><title id="title">中文词元切分示意</title><desc id="desc">我来自深圳大学计算机与软件学院的一种词级切分为我、来自、深圳大学、计算机、与、软件、学院，共七个词元。具体切分由分词器决定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="246" rx="14" fill="#fcfcfa" stroke="none"/><text x="480" y="66" font-size="32" fill="#344c5b" text-anchor="middle" font-weight="400">我来自深圳大学计算机与软件学院</text><text x="55" y="146" font-size="19" fill="#7b8c94" text-anchor="start" font-weight="400">词元</text><text x="188" y="149" font-size="34" fill="#557c91" text-anchor="middle" font-weight="400">我</text><path d="M170 165V173H206V165" fill="none" stroke="#557c91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="257" y="149" font-size="34" fill="#688a74" text-anchor="middle" font-weight="400">来自</text><path d="M222 165V173H292V165" fill="none" stroke="#688a74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="149" font-size="34" fill="#8f7857" text-anchor="middle" font-weight="400">深圳大学</text><path d="M308 165V173H446V165" fill="none" stroke="#8f7857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="514" y="149" font-size="34" fill="#557c91" text-anchor="middle" font-weight="400">计算机</text><path d="M462 165V173H566V165" fill="none" stroke="#557c91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="149" font-size="34" fill="#688a74" text-anchor="middle" font-weight="400">与</text><path d="M582 165V173H618V165" fill="none" stroke="#688a74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="669" y="149" font-size="34" fill="#8f7857" text-anchor="middle" font-weight="400">软件</text><path d="M634 165V173H704V165" fill="none" stroke="#8f7857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="755" y="149" font-size="34" fill="#557c91" text-anchor="middle" font-weight="400">学院</text><path d="M720 165V173H790V165" fill="none" stroke="#557c91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="218" font-size="21" fill="#73838b" text-anchor="middle" font-weight="400">一种词级切分：7 个词元</text></svg>