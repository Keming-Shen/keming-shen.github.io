<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">上下文向量的几何意义</title><desc id="desc">三个源表示 h1=[1,0]、h2=[0,2]、h3=[−1,1] 构成三角形；以权重 0.1、0.2、0.7 加权求和得到 c=[−0.6,1.1]，位于三角形内部。棕色与绿色箭头表示依次累加的过程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="440" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">上下文向量是源表示的加权平均</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">正文数值：权重 [0.1, 0.2, 0.7]</text><rect x="90" y="90" width="380" height="330" rx="6" fill="#f6f7f4" stroke="none"/><path d="M90 372.9L470 372.9" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 420L280 90" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M398.8 372.9L280 137.1L161.3 255Z" fill="#e8eff5" stroke="#9eb4c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><circle cx="398.8" cy="372.9" r="7" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="408.8" y="362.9" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="600">h₁ [1, 0]</text><circle cx="280" cy="137.1" r="7" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="290" y="127.1" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="600">h₂ [0, 2]</text><circle cx="161.3" cy="255" r="7" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="149.3" y="245" font-size="14" fill="#4a6a80" text-anchor="end" font-weight="600">h₃ [−1, 1]</text><circle cx="208.8" cy="243.2" r="8" fill="#edf3ed" stroke="#3d7058" stroke-width="2.5"/><text x="222.8" y="271.2" font-size="15" fill="#3d7058" text-anchor="start" font-weight="700">c [−0.6, 1.1]</text><path d="M280 372.9L291.9 372.9" fill="none" stroke="#8f7857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><path d="M291.9 372.9L291.9 325.7" fill="none" stroke="#8f7857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><path d="M291.9 325.7L208.8 243.2" fill="none" stroke="#3d7058" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="500" y="96" width="422" height="150" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="518" y="126" font-size="16" fill="#3d7058" text-anchor="start" font-weight="650">c = 0.1·h₁ + 0.2·h₂ + 0.7·h₃</text><text x="518" y="156" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">= [0.1, 0] + [0, 0.4] + [−0.7, 0.7]</text><text x="518" y="184" font-size="16" fill="#3d7058" text-anchor="start" font-weight="650">= [−0.6, 1.1]</text><text x="518" y="222" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">权重非负且和为 1，c 落在三角形内</text><rect x="500" y="264" width="422" height="150" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="518" y="294" font-size="16" fill="#8f7857" text-anchor="start" font-weight="650">权重大 ≠ 该源词决定了译文</text><text x="518" y="322" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">· h₃ 本身可能已经混合了其他位置的信息</text><text x="518" y="348" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">· c 还要经过解码器的后续计算</text><text x="518" y="374" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">· 才能影响输出概率</text></svg>