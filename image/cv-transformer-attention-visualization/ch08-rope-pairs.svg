<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">RoPE 的多频率旋转</title><desc id="desc">一个 8 维查询向量被分成 4 对坐标。在位置 0、1、3，每对坐标分别旋转 p 乘以各自频率的角度：第 0 对转得最快，第 3 对几乎不转。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="480" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">RoPE：把 Q、K 的每对坐标按位置旋转</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">dₖ = 8 时有 4 对坐标，第 r 对的旋转角为 p·ωᵣ（此处 ωᵣ = 10000^(−2r/8)）</text><text x="210" y="111.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">位置 p = 0</text><circle cx="210" cy="158" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M210 158L235.2 149.6" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M210 158L235.2 149.6" fill="none" stroke="#a4604b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="252" y="163" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.00 rad</text><text x="80" y="163" font-size="13" fill="#a4604b" text-anchor="end" font-weight="650">第 0 对</text><circle cx="210" cy="234" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M210 234L215.6 211.6" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M210 234L215.6 211.6" fill="none" stroke="#8f7857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="252" y="239" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.00 rad</text><text x="80" y="239" font-size="13" fill="#8f7857" text-anchor="end" font-weight="650">第 1 对</text><circle cx="210" cy="310" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M210 310L196 293.2" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M210 310L196 293.2" fill="none" stroke="#3d7058" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="252" y="315" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.00 rad</text><text x="80" y="315" font-size="13" fill="#3d7058" text-anchor="end" font-weight="650">第 2 对</text><circle cx="210" cy="386" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M210 386L229.6 397.2" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M210 386L229.6 397.2" fill="none" stroke="#4a6a80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="252" y="391" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.00 rad</text><text x="80" y="391" font-size="13" fill="#4a6a80" text-anchor="end" font-weight="650">第 3 对</text><text x="490" y="111.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">位置 p = 1</text><circle cx="490" cy="158" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M490 158L515.2 149.6" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M490 158L496.5472618354908 132.25639181354865" fill="none" stroke="#a4604b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="532" y="163" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 1.00 rad</text><circle cx="490" cy="234" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M490 234L495.6 211.6" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M490 234L493.335754792668 211.15283956455" fill="none" stroke="#8f7857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="532" y="239" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.10 rad</text><circle cx="490" cy="310" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M490 310L476 293.2" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M490 310L475.8327027941527 293.34083765967836" fill="none" stroke="#3d7058" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="532" y="315" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.01 rad</text><circle cx="490" cy="386" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M490 386L509.6 397.2" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M490 386L509.6111901981341 397.18039440326714" fill="none" stroke="#4a6a80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="532" y="391" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.00 rad</text><text x="770" y="111.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">位置 p = 3</text><circle cx="770" cy="158" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M770 158L795.2 149.6" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M770 158L743.8667810179659 162.75971276833508" fill="none" stroke="#a4604b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="812" y="163" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 3.00 rad</text><circle cx="770" cy="234" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M770 234L775.6 211.6" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M770 234L768.7302317098894 210.9455494862829" fill="none" stroke="#8f7857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="812" y="239" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.30 rad</text><circle cx="770" cy="310" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M770 310L756 293.2" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M770 310L755.5023751241123 293.6274964358519" fill="none" stroke="#3d7058" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="812" y="315" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.03 rad</text><circle cx="770" cy="386" r="28" fill="none" stroke="#c9d0d3" stroke-width="1"/><path d="M770 386L789.6 397.2" fill="none" stroke="#9aa7ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M770 386L789.6335117496661 397.14114968823776" fill="none" stroke="#4a6a80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="812" y="391" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">转 0.00 rad</text><text x="38" y="460" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">虚线为原始坐标，实线为旋转后坐标。同一对坐标在 q 与 k 上转过 pω 与 rω，点积中只留下差 (r − p)ω，因此注意力分数只依赖相对位置。</text></svg>