<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-labelledby="title desc"><title id="title">训练与推理中的数据流</title><desc id="desc">左：训练时编码器输出 memory 给解码器，损失的梯度同时传回解码器和编码器参数。右：推理时源句只编码一次，得到的 memory 在每个解码步骤中复用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="408" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">训练与推理中的数据流</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">训练：梯度经注意力回到编码器；推理：memory 只计算一次</text><rect x="38" y="86" width="420" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="248" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">训练：端到端反向传播</text><rect x="70" y="280" width="140" height="56" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="140" y="304.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">编码器</text><text x="140" y="325.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">θ_enc</text><rect x="286" y="280" width="140" height="56" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="356" y="304.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">解码器</text><text x="356" y="325.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">θ_dec</text><rect x="286" y="150" width="140" height="56" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="356" y="174.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="650">损失 ℒ</text><text x="356" y="195.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">−Σ log p</text><path d="M212 308L282 308" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="247" y="300.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">memory</text><path d="M356 276L356 210" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M330 206V250H150V276" fill="none" stroke="#a4604b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowR)" stroke-dasharray="6 6"/><text x="160" y="240" font-size="14" fill="#a4604b" text-anchor="start" font-weight="650">∂ℒ/∂θ_enc</text><path d="M382 206V276" fill="none" stroke="#a4604b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowR)" stroke-dasharray="6 6"/><text x="390" y="244" font-size="14" fill="#a4604b" text-anchor="start" font-weight="650">∂ℒ/∂θ_dec</text><text x="248" y="370.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">一次 loss.backward() 同时更新两部分</text><rect x="498" y="86" width="424" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="710" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">推理：encode 一次，decode 多次</text><rect x="520" y="150" width="130" height="56" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="585" y="174.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">encode(src)</text><text x="585" y="195.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">只执行 1 次</text><rect x="670" y="160" width="92" height="36" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="716" y="182.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">memory</text><path d="M652 178L666 178" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="780" y="226" width="124" height="28" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="842" y="244.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">decode 第 1 步</text><path d="M716 198V240H776" fill="none" stroke="#b9a98a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="780" y="262" width="124" height="28" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="842" y="280.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">decode 第 2 步</text><path d="M716 198V276H776" fill="none" stroke="#b9a98a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="780" y="298" width="124" height="28" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="842" y="316.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">decode 第 3 步</text><path d="M716 198V312H776" fill="none" stroke="#b9a98a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="780" y="334" width="124" height="28" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="842" y="352.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">decode 第 4 步</text><path d="M716 198V348H776" fill="none" stroke="#b9a98a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640" y="304.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="400">每一步复用</text><text x="640" y="322.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="400">同一个 memory</text><text x="710" y="370.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">若每步都调用 model(src, prefix)，会重复编码源句</text></svg>