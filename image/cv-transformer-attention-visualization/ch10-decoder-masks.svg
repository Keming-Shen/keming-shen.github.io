<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">解码器层的子层与掩码</title><desc id="desc">第一个子层为带因果掩码的自注意力，权重矩阵 4×4，上三角被屏蔽；第二个子层为交叉注意力，权重矩阵 4×5，只屏蔽源端填充列；第三个子层 FFN 不需要掩码。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="450" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">解码器层的三个子层与各自的掩码</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">T = 4 个目标位置，S = 5 个源位置（最后一个为 &lt;pad&gt;）</text><rect x="40" y="104" width="330" height="86" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="58" y="136" font-size="16" fill="#4a6a80" text-anchor="start" font-weight="700">① 带因果掩码的自注意力</text><text x="58" y="162" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">Q、K、V 都来自目标前缀</text><rect x="40" y="214" width="330" height="86" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="58" y="246" font-size="16" fill="#8f7857" text-anchor="start" font-weight="700">② 交叉注意力</text><text x="58" y="272" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">Q 来自目标，K、V 来自 memory</text><rect x="40" y="324" width="330" height="86" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="58" y="356" font-size="16" fill="#8a979d" text-anchor="start" font-weight="700">③ FFN</text><text x="58" y="382" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">逐位置，无跨位置交互</text><path d="M205 190L205 214" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M205 300L205 324" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="470" y="110" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="510" y="110" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="529" y="122.2" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="550" y="110" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="569" y="122.2" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="590" y="110" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="609" y="122.2" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="470" y="130" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="510" y="130" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="550" y="130" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="569" y="142.2" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="590" y="130" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="609" y="142.2" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="470" y="150" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="510" y="150" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="550" y="150" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="590" y="150" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="609" y="162.2" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="470" y="170" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="510" y="170" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="550" y="170" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><rect x="590" y="170" width="38" height="18" rx="3" fill="#c4d6df" stroke="none"/><text x="640" y="126" font-size="13" fill="#4a6a80" text-anchor="start" font-weight="650">[T, T] = 4 × 4</text><text x="640" y="148" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">上三角屏蔽：不能读未来</text><text x="640" y="168" font-size="12" fill="#9aa7ad" text-anchor="start" font-weight="400">tgt_mask + tgt_key_padding_mask</text><rect x="470" y="220" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="510" y="220" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="550" y="220" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="590" y="220" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="630" y="220" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="649" y="232.2" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="470" y="240" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="510" y="240" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="550" y="240" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="590" y="240" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="630" y="240" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="649" y="252.2" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="470" y="260" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="510" y="260" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="550" y="260" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="590" y="260" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="630" y="260" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="649" y="272.1" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><rect x="470" y="280" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="510" y="280" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="550" y="280" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="590" y="280" width="38" height="18" rx="3" fill="#e8e0cf" stroke="none"/><rect x="630" y="280" width="38" height="18" rx="3" fill="#f3e4df" stroke="none"/><text x="649" y="292.1" font-size="9" fill="#a4604b" text-anchor="middle" font-weight="400">−∞</text><text x="690" y="236" font-size="13" fill="#8f7857" text-anchor="start" font-weight="650">[T, S] = 4 × 5</text><text x="690" y="258" font-size="12" fill="#71838b" text-anchor="start" font-weight="400">只屏蔽源端 &lt;pad&gt; 列</text><text x="690" y="278" font-size="12" fill="#9aa7ad" text-anchor="start" font-weight="400">memory_key_padding_mask</text><rect x="470" y="330" width="200" height="54" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="570" y="361.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">无注意力矩阵，无需掩码</text><path d="M374 150L462 150" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M374 262L462 262" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M374 358L462 358" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="38" y="428" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">每个子层之后都有 Dropout、残差相加与 LayerNorm（Post-LN）。交叉注意力不需要三角掩码：完整的源句是已知条件。</text></svg>