<svg xmlns="http://www.w3.org/2000/svg" width="960" height="466" viewBox="0 0 960 466" role="img" aria-labelledby="title desc"><title id="title">训练与推理的计算方式</title><desc id="desc">训练时右移的目标序列一次输入，4 个位置并行得到预测与损失。推理时源句只编码一次，解码器逐步生成，每一步依赖前一步的输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="466" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">训练一次前向，推理逐步生成</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">同一个模型、同一组参数，两种计算方式</text><rect x="38" y="86" width="420" height="330" rx="10" fill="#f6f7f4" stroke="none"/><text x="248" y="117.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">训练：teacher forcing + 因果掩码</text><rect x="53" y="356" width="70" height="28" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="88" y="374.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><path d="M88 354L88 300" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="53" y="146" width="70" height="28" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="88" y="164.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">我</text><path d="M88 280L88 178" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="149" y="356" width="70" height="28" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="184" y="374.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="500">我</text><path d="M184 354L184 300" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="149" y="146" width="70" height="28" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="184" y="164.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">喜欢</text><path d="M184 280L184 178" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="245" y="356" width="70" height="28" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="280" y="374.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="500">喜欢</text><path d="M280 354L280 300" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="245" y="146" width="70" height="28" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="280" y="164.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">你</text><path d="M280 280L280 178" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="341" y="356" width="70" height="28" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="376" y="374.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="500">你</text><path d="M376 354L376 300" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="341" y="146" width="70" height="28" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="376" y="164.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">&lt;eos&gt;</text><path d="M376 280L376 178" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="58" y="196" width="380" height="90" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="248" y="237.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">编码器 + 解码器（6 + 6 层）</text><text x="248" y="262.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">一次前向计算，4 个位置并行</text><text x="248" y="404.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">1 次前向 → 4 个位置的损失</text><rect x="498" y="86" width="424" height="330" rx="10" fill="#f6f7f4" stroke="none"/><text x="710" y="117.3" font-size="15" fill="#293e4b" text-anchor="middle" font-weight="650">推理：束搜索（束宽 4，长度惩罚 0.6）</text><rect x="520" y="136" width="140" height="52" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="590" y="157.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="650">编码源句</text><text x="590" y="179.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">只执行 1 次</text><rect x="560" y="210" width="340" height="34" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="576" y="232" font-size="13" fill="#3d7058" text-anchor="start" font-weight="600">第 1 步：&lt;bos&gt; → 我</text><path d="M730 246L730 252" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="560" y="254" width="340" height="34" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="576" y="276" font-size="13" fill="#3d7058" text-anchor="start" font-weight="600">第 2 步：&lt;bos&gt; 我 → 喜欢</text><path d="M730 290L730 296" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="560" y="298" width="340" height="34" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="576" y="320" font-size="13" fill="#3d7058" text-anchor="start" font-weight="600">第 3 步：… 喜欢 → 你</text><path d="M730 334L730 340" fill="none" stroke="#708794" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="560" y="342" width="340" height="34" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="576" y="364" font-size="13" fill="#3d7058" text-anchor="start" font-weight="600">第 4 步：… 你 → &lt;eos&gt;</text><path d="M660 162H880V204" fill="none" stroke="#b9a98a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="770" y="154" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="400">memory 复用</text><text x="710" y="404.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">T 次前向，后一步依赖前一步的输出</text><text x="38" y="444" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">最大输出长度为输入长度加 50；束搜索在每一步保留 4 条累计对数概率最高的候选（第 05 章）。</text></svg>