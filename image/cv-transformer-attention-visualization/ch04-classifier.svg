<svg xmlns="http://www.w3.org/2000/svg" width="960" height="376" viewBox="0 0 960 376" role="img" aria-labelledby="title desc"><title id="title">分类器的层结构与参数量</title><desc id="desc">输入 [B,2] 依次经过 Linear(2,32)、ReLU、Dropout、Linear(32,32)、ReLU、Linear(32,2)，输出 [B,2] 的 logits。三个线性层分别有 96、1056、66 个参数，共 1218 个。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="376" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">分类器的层结构</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">形状与参数量逐层统计</text><rect x="38" y="110" width="112" height="72" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="94" y="141.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="650">输入</text><text x="94" y="163.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[B, 2]</text><text x="94" y="214.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">—</text><path d="M152 146L164 146" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="166" y="110" width="112" height="72" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="222" y="141.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">Linear(2, 32)</text><text x="222" y="163.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[B, 32]</text><text x="222" y="214.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">96 个参数</text><text x="222" y="236.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">2×32 + 32</text><path d="M280 146L292 146" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="294" y="110" width="112" height="72" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="350" y="141.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">ReLU</text><text x="350" y="163.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[B, 32]</text><text x="350" y="214.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">无参数</text><path d="M408 146L420 146" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="422" y="110" width="112" height="72" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="478" y="141.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="650">Dropout(0.1)</text><text x="478" y="163.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[B, 32]</text><text x="478" y="214.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">无参数</text><path d="M536 146L548 146" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="550" y="110" width="112" height="72" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="606" y="141.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">Linear(32, 32)</text><text x="606" y="163.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[B, 32]</text><text x="606" y="214.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">1056 个参数</text><text x="606" y="236.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">32×32 + 32</text><path d="M664 146L676 146" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="678" y="110" width="112" height="72" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="734" y="141.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="650">ReLU</text><text x="734" y="163.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[B, 32]</text><text x="734" y="214.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">无参数</text><path d="M792 146L804 146" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="806" y="110" width="112" height="72" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="862" y="141.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="650">Linear(32, 2)</text><text x="862" y="163.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[B, 2]</text><text x="862" y="214.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="650">66 个参数</text><text x="862" y="236.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">32×2 + 2</text><rect x="38" y="262" width="884" height="58" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="480" y="296.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="650">总参数量 = 96 + 1056 + 66 = 1218，与脚本输出一致</text><text x="38" y="354" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">最后一层输出两个类别的 logits，不接激活函数；softmax 在损失函数内部完成（第 02 章）。</text></svg>