<svg xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" aria-labelledby="title desc"><title id="title">填充位置作为查询时的输出</title><desc id="desc">四个目标位置中最后一个为填充。填充位置作为查询仍会产生非零输出，因此其标签需要通过 ignore_index 在损失中排除；有效位置正常计入损失。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="412" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">屏蔽键 ≠ 屏蔽查询</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">&lt;pad&gt; 作为查询时仍有输出，必须在损失中排除</text><rect x="48" y="124" width="84" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="90" y="144.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><path d="M134 140L190 140" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="196" y="120" width="250" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="321" y="144.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">正常的隐藏表示</text><path d="M450 140L500 140" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="506" y="120" width="160" height="40" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="586" y="144.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="650">计入损失</text><rect x="48" y="186" width="84" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="90" y="206.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">我</text><path d="M134 202L190 202" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="196" y="182" width="250" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="321" y="206.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">正常的隐藏表示</text><path d="M450 202L500 202" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="506" y="182" width="160" height="40" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="586" y="206.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="650">计入损失</text><rect x="48" y="248" width="84" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="90" y="268.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">喜欢</text><path d="M134 264L190 264" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="196" y="244" width="250" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="321" y="268.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">正常的隐藏表示</text><path d="M450 264L500 264" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="506" y="244" width="160" height="40" rx="6" fill="#f1f0e9" stroke="#b9a98a"/><text x="586" y="268.2" font-size="12" fill="#8f7857" text-anchor="middle" font-weight="650">计入损失</text><rect x="48" y="310" width="84" height="32" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="90" y="330.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">&lt;pad&gt;</text><path d="M134 326L190 326" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="196" y="306" width="250" height="40" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="321" y="330.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">输出非零（受 PE、偏置、LN 影响）</text><path d="M450 326L500 326" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="506" y="306" width="160" height="40" rx="6" fill="#f3e4df" stroke="#c99787"/><text x="586" y="330.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="650">标签 &lt;pad&gt;：忽略</text><rect x="700" y="120" width="222" height="226" rx="8" fill="#f6f7f4" stroke="none"/><text x="714" y="146" font-size="13" fill="#8f7857" text-anchor="start" font-weight="650">CrossEntropyLoss(</text><text x="714" y="168" font-size="13" fill="#8f7857" text-anchor="start" font-weight="650">  ignore_index=PAD)</text><text x="714" y="190" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400"></text><text x="714" y="212" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">损失按有效 token 数</text><text x="714" y="234" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">平均：</text><text x="714" y="256" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">ℒ = −(1/|𝓘|) Σ log p</text><text x="714" y="278" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400"></text><text x="714" y="300" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">&lt;eos&gt; 是需要学习的</text><text x="714" y="322" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">结束决策，计入损失</text><text x="38" y="392" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">统计整个 epoch 的损失时，应以每批有效 token 数为权重累加，而不是直接平均各批的均值。</text></svg>