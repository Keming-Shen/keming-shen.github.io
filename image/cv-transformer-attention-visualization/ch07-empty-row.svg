<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc"><title id="title">全部被屏蔽的一行</title><desc id="desc">若一行四个分数全部为负无穷，softmax 得到 NaN；若全部改为 −10⁹，softmax 得到均匀分布 0.25，错误地读取了被屏蔽的位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="404" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">全部被屏蔽的一行：两种错误结果</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">每个有效查询至少需要一个可访问的键</text><text x="38" y="136" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">全部填 −∞</text><rect x="250" y="114" width="56" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="278" y="135.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">−∞</text><rect x="312" y="114" width="56" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="340" y="135.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">−∞</text><rect x="374" y="114" width="56" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="402" y="135.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">−∞</text><rect x="436" y="114" width="56" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="464" y="135.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">−∞</text><path d="M500 131L540 131" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="520" y="121.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">softmax</text><rect x="550" y="114" width="56" height="34" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="578" y="135.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">NaN</text><rect x="612" y="114" width="56" height="34" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="640" y="135.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">NaN</text><rect x="674" y="114" width="56" height="34" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="702" y="135.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">NaN</text><rect x="736" y="114" width="56" height="34" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="764" y="135.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">NaN</text><text x="560" y="170" font-size="13" fill="#a4604b" text-anchor="start" font-weight="400">0 / 0：NaN 会沿梯度传遍整个网络</text><text x="38" y="242" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">全部填 −10⁹</text><rect x="250" y="220" width="56" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="278" y="241.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">−10⁹</text><rect x="312" y="220" width="56" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="340" y="241.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">−10⁹</text><rect x="374" y="220" width="56" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="402" y="241.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">−10⁹</text><rect x="436" y="220" width="56" height="34" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="464" y="241.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">−10⁹</text><path d="M500 237L540 237" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="520" y="227.8" font-size="11" fill="#71838b" text-anchor="middle" font-weight="400">softmax</text><rect x="550" y="220" width="56" height="34" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="578" y="241.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">0.25</text><rect x="612" y="220" width="56" height="34" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="640" y="241.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">0.25</text><rect x="674" y="220" width="56" height="34" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="702" y="241.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">0.25</text><rect x="736" y="220" width="56" height="34" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="764" y="241.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="650">0.25</text><text x="560" y="276" font-size="13" fill="#a4604b" text-anchor="start" font-weight="400">悄悄变成均匀分布，读取了本应屏蔽的位置</text><rect x="38" y="310" width="884" height="74" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="58" y="338" font-size="15" fill="#3d7058" text-anchor="start" font-weight="400">常见做法：构造掩码时先检查每行至少有一个 True（本章代码中直接报错）；</text><text x="58" y="364" font-size="15" fill="#3d7058" text-anchor="start" font-weight="400">对于本身就是填充的查询行，保留任意有限输出，并在池化与损失中按掩码排除。</text></svg>