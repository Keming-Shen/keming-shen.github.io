<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">位置位移与旋转</title><desc id="desc">位置 0 到 6 的编码在单位圆上等角度排列。从位置 1 到 3 与从位置 3 到 5 转过相同的角度，说明固定位移对应一个与起点无关的旋转。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="420" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">固定位移对应一个与起点无关的旋转</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">第 r 对坐标 (sin pωᵣ, cos pωᵣ) 落在单位圆上；此处取 ωᵣ = 0.5</text><circle cx="250" cy="260" r="140" fill="none" stroke="#c9d0d3" stroke-width="1.4"/><path d="M90 260L410 260" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 100L250 420" fill="none" stroke="#e0e5e6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="120" r="7" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="262" y="112" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">p=0</text><circle cx="317.11957540458843" cy="137.1384413353478" r="7" fill="#edf3ed" stroke="#3d7058" stroke-width="2"/><text x="329.11957540458843" y="129.1384413353478" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">p=1</text><circle cx="367.8059378731055" cy="184.35767717846045" r="7" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="379.8059378731055" y="176.35767717846045" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">p=2</text><circle cx="389.6492981245676" cy="250.0967917665216" r="7" fill="#edf3ed" stroke="#3d7058" stroke-width="2"/><text x="401.6492981245676" y="242.0967917665216" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">p=3</text><circle cx="377.30163975559543" cy="318.26055711659995" r="7" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="389.30163975559543" y="336.26055711659995" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">p=4</text><circle cx="333.7861001745539" cy="372.1601061765707" r="7" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="345.7861001745539" y="390.1601061765707" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">p=5</text><circle cx="269.7568011283814" cy="398.5989495240624" r="7" fill="#e8eff5" stroke="#4a6a80" stroke-width="2"/><text x="281.7568011283814" y="416.5989495240624" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">p=6</text><path d="M304.7 160.0A114 114 0 0 1 363.7 251.9" fill="none" stroke="#3d7058" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M345.8 253.2A96 96 0 0 1 307.5 336.9" fill="none" stroke="#8f7857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><text x="412" y="280" font-size="13" fill="#9aa7ad" text-anchor="end" font-weight="400">sin(pω)</text><text x="240" y="112" font-size="13" fill="#9aa7ad" text-anchor="end" font-weight="400">cos(pω)</text><rect x="470" y="110" width="452" height="132" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="488" y="140" font-size="15" fill="#3d7058" text-anchor="start" font-weight="650">从任意位置 p 移动到 p + Δ：</text><text x="488" y="170" font-size="16" fill="#5c747d" text-anchor="start" font-weight="600">uᵣ(p + Δ) = uᵣ(p) · Rot(Δωᵣ)</text><text x="488" y="200" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">旋转角 Δωᵣ 只取决于 Δ，与起点 p 无关</text><text x="488" y="224" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">例：p = 1 → 3 与 p = 3 → 5 转过相同的角度 1 弧度</text><rect x="470" y="258" width="452" height="132" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="488" y="288" font-size="15" fill="#4a6a80" text-anchor="start" font-weight="650">不同维度对的旋转速度不同：</text><text x="488" y="318" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">高频对转得快，低频对转得慢；把所有维度对</text><text x="488" y="342" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">的旋转组合起来，就得到整个位置向量的</text><text x="488" y="366" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">线性位移变换。</text></svg>