<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">残差块与逐分量相加</title><desc id="desc">输入1、2沿恒等路径保留，残差分支产生0.1、负0.2，逐分量相加后得到1.1、1.8。</desc><defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.7"/></marker><linearGradient id="mic" x1="0" x2="1"><stop stop-color="#153b5a"/><stop offset=".5" stop-color="#438ab8"/><stop offset="1" stop-color="#153b5a"/></linearGradient><linearGradient id="soft" x2="0" y2="1"><stop stop-color="#edf7ff"/><stop offset="1" stop-color="#dceef8"/></linearGradient></defs><rect width="1000" height="340" fill="#fff"/><rect x="35" y="154" width="178" height="75" rx="10" fill="#edf5fb" stroke="#347bb8" stroke-width="1.8"/><text x="124" y="184" text-anchor="middle" font-size="19" fill="#347bb8" font-weight="600">输入 x</text><text x="124" y="214" text-anchor="middle" font-size="25" fill="#182e43" font-weight="500">[1, 2]</text><path d="M218 191H349" fill="none" stroke="#cc654e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="362" y="142" width="234" height="99" rx="10" fill="#fcf0eb" stroke="#cc654e" stroke-width="1.8"/><text x="479" y="179" text-anchor="middle" font-size="21" fill="#cc654e" font-weight="600">残差分支 F(x)</text><text x="479" y="217" text-anchor="middle" font-size="25" fill="#182e43" font-weight="500">[0.1, −0.2]</text><path d="M600 191H699" fill="none" stroke="#cc654e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="729" cy="191" r="23" fill="#fff" stroke="#182e43" stroke-width="2"/><text x="729" y="201" text-anchor="middle" font-size="30" fill="#182e43" font-weight="500">+</text><path d="M238 191V81H729V157" fill="none" stroke="#3a8c75" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="61" text-anchor="middle" font-size="20" fill="#3a8c75" font-weight="600">恒等短路：直接传递 x</text><path d="M759 191H790" fill="none" stroke="#347bb8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="804" y="154" width="177" height="75" rx="10" fill="#edf7f3" stroke="#3a8c75" stroke-width="1.8"/><text x="892" y="184" text-anchor="middle" font-size="19" fill="#3a8c75" font-weight="600">输出 x + F(x)</text><text x="892" y="214" text-anchor="middle" font-size="25" fill="#182e43" font-weight="500">[1.1, 1.8]</text><text x="500" y="306" text-anchor="middle" font-size="26" fill="#182e43" font-weight="500">[1, 2] + [0.1, −0.2] = [1.1, 1.8]</text></svg>