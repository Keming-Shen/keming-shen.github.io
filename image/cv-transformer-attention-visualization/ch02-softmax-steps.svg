<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="title desc"><title id="title">Softmax 的计算步骤</title><desc id="desc">四个类别的 logits 为 2.0、1.0、0.1、−1.0。取指数后得到 7.39、2.72、1.11、0.37，除以总和 11.58 后得到概率 0.638、0.235、0.095、0.032。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="432" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">Softmax 的三步计算</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">任意实数 → 正数 → 总和为 1 的分布</text><rect x="38" y="92" width="262" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="169" y="124.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">① logits z</text><path d="M58 262.5L280 262.5" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="66" y="169.8" width="40" height="92.7" rx="3" fill="#91b1c0" stroke="none"/><text x="86" y="162.7" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">2.0</text><text x="86" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">猫</text><rect x="121.5" y="216.1" width="40" height="46.4" rx="3" fill="#91b1c0" stroke="none"/><text x="141.5" y="209" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">1.0</text><text x="141.5" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">狗</text><rect x="177" y="257.9" width="40" height="4.6" rx="3" fill="#91b1c0" stroke="none"/><text x="197" y="250.8" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.1</text><text x="197" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鱼</text><rect x="232.5" y="262.5" width="40" height="46.3" rx="3" fill="#d9a797" stroke="none"/><text x="252.5" y="329.7" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="600">−1.0</text><text x="252.5" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鸟</text><rect x="349" y="92" width="262" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="480" y="124.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">② exp(z)</text><path d="M369 332L591 332" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="377" y="160.8" width="40" height="171.2" rx="3" fill="#d8c9a8" stroke="none"/><text x="397" y="153.7" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="600">7.39</text><text x="397" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">猫</text><rect x="432.5" y="269" width="40" height="63" rx="3" fill="#d8c9a8" stroke="none"/><text x="452.5" y="261.9" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="600">2.72</text><text x="452.5" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">狗</text><rect x="488" y="306.4" width="40" height="25.6" rx="3" fill="#d8c9a8" stroke="none"/><text x="508" y="299.3" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="600">1.11</text><text x="508" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鱼</text><rect x="543.5" y="323.5" width="40" height="8.5" rx="3" fill="#d8c9a8" stroke="none"/><text x="563.5" y="316.4" font-size="14" fill="#8f7857" text-anchor="middle" font-weight="600">0.37</text><text x="563.5" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鸟</text><rect x="660" y="92" width="262" height="286" rx="10" fill="#f6f7f4" stroke="none"/><text x="791" y="124.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">③ exp(z) / Σ</text><path d="M680 332L902 332" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="688" y="170.4" width="40" height="161.6" rx="3" fill="#94b79a" stroke="none"/><text x="708" y="163.3" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.638</text><text x="708" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">猫</text><rect x="743.5" y="272.5" width="40" height="59.5" rx="3" fill="#94b79a" stroke="none"/><text x="763.5" y="265.4" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.235</text><text x="763.5" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">狗</text><rect x="799" y="307.8" width="40" height="24.2" rx="3" fill="#94b79a" stroke="none"/><text x="819" y="300.7" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.095</text><text x="819" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鱼</text><rect x="854.5" y="324" width="40" height="8" rx="3" fill="#94b79a" stroke="none"/><text x="874.5" y="316.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.032</text><text x="874.5" y="357.6" font-size="16" fill="#5c747d" text-anchor="middle" font-weight="400">鸟</text><path d="M303 235H343" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M614 235H654" fill="none" stroke="#708794" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="415.9" font-size="17" fill="#71838b" text-anchor="middle" font-weight="400">Σ exp(z) = 11.58；输出之和为 1，且大小顺序与 logits 保持一致。</text></svg>