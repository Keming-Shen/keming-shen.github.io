<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">跨注意力的权重矩阵</title><desc id="desc">4 行对应目标位置我、很、喜欢、你，6 列对应源位置 I、like、you、very、much 与 &lt;pad&gt;。每行权重和为 1，填充列被屏蔽为 0；“很”一行的权重主要落在 very 与 much 上。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="420" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">跨注意力的权重矩阵</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">行 = 目标位置（查询），列 = 源位置（被读取），每行和为 1</text><text x="208" y="101.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">I</text><text x="308" y="101.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">like</text><text x="408" y="101.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">you</text><text x="508" y="101.3" font-size="15" fill="#5c747d" text-