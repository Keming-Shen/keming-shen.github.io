<svg xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" aria-labelledby="title desc"><title id="title">时间序列自回归与语言模型</title><desc id="desc">左：AR(3) 模型用最近三天的气温线性组合预测下一天。右：语言模型以“今天深圳天气很”为前缀，通过神经网络输出下一个 token 在词表上的分布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="412" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">从时间序列自回归到语言模型</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">都以“自身的过去”为条件预测下一个值</text><rect x="38" y="92" width="420" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="248" y="123.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">AR(3)：用前 3 天的气温预测今天</text><path d="M86.6 286.2L127.7 256.9L168.8 271.5L209.9 227.7L251 242.3L292.1 213.1L333.2 198.5L374.3 227.7L415.4 183.8" fill="none" stroke="#9eb4c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="roun