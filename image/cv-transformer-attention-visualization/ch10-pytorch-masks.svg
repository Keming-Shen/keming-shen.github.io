="#a4604b" text-anchor="middle" font-weight="400">True</text><rect x="498" y="140" width="44" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="520" y="157.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">True</text><rect x="360" y="170" width="44" height="28" rx="3" fill="#f1f0e9" stroke="none"/><text x="382" y="187.5" font-size="10" fill="#8f7857" text-anchor="middle" font-weight="400">False</text><rect x="406" y="170" width="44" height="28" rx="3" fill="#f1f0e9" stroke="none"/><text x="428" y="187.5" font-size="10" fill="#8f7857" text-anchor="middle" font-weight="400">False</text><rect x="452" y="170" width="44" height="28" rx="3" fill="#f1f0e9" stroke="none"/><text x="474" y="187.5" font-size="10" fill="#8f7857" text-anchor="middle" font-weight="400">False</text><rect x="498" y="170" width="44" height="28" rx="3" fill="#f3e4df" stroke="none"/><text x="520" y="187.5" font-size="10" fill="#a4604b" text-anchor="middle" font-weight="400">True</text><rect x="360" y="200" width="44" height="28" rx="3" fill="#f1f0e9" stroke="none"/><text x="382" y="217.5" font-size="10" fill="#8f7857" text-anchor="middle" font-weight="400">False</text><rect x="406" y="200" width="44" height="28" rx="3" fill="#f1f0e9" stroke="none"/><text x="428" y="217.5" font-size="10" fill="#8f7857" text-anchor="middle" font-weight="400">False</text><rect x="452" y="200" width="44" height="28" rx="3" fill="#f1f0e9" stroke="none"/><text x="474" y="217.5" font-size="10" fill="#8f7857" text-anchor="middle" font-weight="400">False</text><rect x="498" y="200" width="44" height="28" rx="3" fill="#f1f0e9" stroke="none"/><text x="520" y="217.5" font-size="10" fill="#8f7857" text-anchor="middle" font-weight="400">False</text><text x="360" y="248" font-size="12" fill="#8f7857" text-anchor="start" font-weight="400">ones(T, T).triu(1)，[T, T]</text><rect x="360" y="300" width="562" height="36" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="376" y="323" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="650">编码器自注意力</text><text x="520" y="323" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">src_key_padding_mask = 源填充</text><rect x="360" y="344" width="562" height="36" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="376" y="367" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">解码器自注意力</text><text x="520" y="367" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">tgt_mask = 因果；tgt_key_padding_mask = 目标填充</text><rect x="360" y="388" width="562" height="36" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="376" y="411" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">解码器交叉注意力</text><text x="520" y="411" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">memory_key_padding_mask = 源填充</text><rect x="600" y="110" width="322" height="150" rx="8" fill="#f6ebe7" stroke="#c99787"/><text x="616" y="138" font-size="15" fill="#a4604b" text-anchor="start" font-weight="650">注意语义相反</text><text x="616" y="166" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">本系列第 07 章手写函数与</text><text x="616" y="188" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">F.scaled_dot_product_attention</text><text x="616" y="210" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">中 True 表示“允许”；</text><text x="616" y="234" font-size="13" fill="#5c747d" text-anchor="start" font-weight="400">替换实现时必须取反。</text></svg>