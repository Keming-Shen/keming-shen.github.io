<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">PyTorch forward 中的三种掩码</title><desc id="desc">源填充掩码 [B,S] 与目标填充掩码 [B,T] 在填充位置为 True；因果掩码 [T,T] 在上三角为 True。编码器自注意力用源填充掩码，解码器自注意力用因果掩码与目标填充掩码，交叉注意力用源填充掩码。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="440" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">forward() 中的三种掩码</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">PyTorch 的 Transformer 层中，布尔掩码 True 表示禁止访问</text><text x="40" y="96" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">源填充掩码</text><text x="40" y="172" font-size="12" fill="#4a6a80" text-anchor="start" font-weight="400">source.eq(pad_id)</text><text x="40" y="190" font-size="12" fill="#9aa7ad" text-anchor="start" font-weight="400">[B, S]</text><rect x="40" y="110" widt