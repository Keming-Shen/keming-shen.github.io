<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-labelledby="title desc"><title id="title">多头注意力的张量变形</title><desc id="desc">输入 [2,5,512] 经线性层投影后 view 成 [2,5,8,64]，transpose 为 [2,8,5,64]，按头并行计算注意力；结果 transpose 回 [2,5,8,64]，reshape 为 [2,5,512]，再经输出投影。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="452" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">多头注意力的张量变形</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">以 B = 2，L = 5，d = 512，H = 8，dₕ = 64 为例</text><rect x="38" y="96" width="196" height="76" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="136" y="130.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">x</text><text x="136" y="151.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[B, L, d]</text><text x="136" y="194.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[2, 5, 512]</text><path d="M236 134L258 134" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="260" y="96" width="196" height="76" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="358" y="130.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">Linear(d, d)</text><text x="358" y="151.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[B, L, d]</text><text x="358" y="194.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[2, 5, 512]</text><path d="M458 134L480 134" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="482" y="96" width="196" height="76" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="580" y="130.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="650">view(B, L, H, dₕ)</text><text x="580" y="151.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[B, L, H, dₕ]</text><text x="580" y="194.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[2, 5, 8, 64]</text><path d="M680 134L702 134" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="704" y="96" width="196" height="76" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="802" y="130.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">transpose(1, 2)</text><text x="802" y="151.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[B, H, L, dₕ]</text><text x="802" y="194.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[2, 8, 5, 64]</text><path d="M802 202V232" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="704" y="240" width="196" height="76" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="802" y="274.3" font-size="15" fill="#a4604b" text-anchor="middle" font-weight="650">注意力（按头并行）</text><text x="802" y="295.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[B, H, L, dₕ]</text><text x="802" y="338.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">分数 [B, H, L, L]</text><path d="M702 278L680 278" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="482" y="240" width="196" height="76" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="580" y="274.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">transpose(1, 2)</text><text x="580" y="295.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[B, L, H, dₕ]</text><text x="580" y="338.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[2, 5, 8, 64]</text><path d="M480 278L458 278" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="260" y="240" width="196" height="76" rx="10" fill="#f3f4f2" stroke="#c9d0d3"/><text x="358" y="274.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="650">reshape(B, L, d)</text><text x="358" y="295.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[B, L, d]</text><text x="358" y="338.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[2, 5, 512]</text><path d="M258 278L236 278" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="38" y="240" width="196" height="76" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="136" y="274.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">W^O：Linear(d, d)</text><text x="136" y="295.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">[B, L, d]</text><text x="136" y="338.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">[2, 5, 512]</text><rect x="38" y="360" width="884" height="72" rx="8" fill="#f6f7f4" stroke="none"/><text x="56" y="388" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">Q、K、V 各做一次上一行的变形；H 被移到第 1 维后，8 个头的注意力就是一次批量矩阵乘法。</text><text x="56" y="414" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">transpose 之后张量不再连续，合并前需要 .contiguous() 或直接使用 reshape。</text></svg>