<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-labelledby="title desc"><title id="title">分头发生在投影之后</title><desc id="desc">正确做法：输入 X [3,8] 乘以 8×8 的投影矩阵得到 Q [3,8]，再把输出的前 4 列作为头 1、后 4 列作为头 2。错误理解：把输入的前 4 列和后 4 列分别交给两个头。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="476" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">“分头”发生在投影之后</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">每个头的投影都读取输入的全部 d 个分量；d = 8，H = 2，dₖ = 4</text><rect x="38" y="86" width="884" height="170" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="56" y="112" font-size="15" fill="#3d7058" text-anchor="start" font-weight="650">正确：先投影，再把输出的列划分给各个头</text><rect x="60" y="140" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="82" y="140" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="104" y="140" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="126" y="140" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="148" y="140" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="170" y="140" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="192" y="140" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="214" y="140" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="60" y="162" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="82" y="162" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="104" y="162" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="126" y="162" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="148" y="162" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="170" y="162" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="192" y="162" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="214" y="162" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="60" y="184" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="82" y="184" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="104" y="184" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="126" y="184" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="148" y="184" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="170" y="184" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="192" y="184" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="214" y="184" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><text x="148" y="226.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">X [3, 8]</text><text x="262" y="185" font-size="20" fill="#71838b" text-anchor="middle" font-weight="400">×</text><rect x="290" y="128" width="176" height="88" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="378" y="170.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="650">W^Q [8, 8]</text><text x="378" y="194.2" font-size="12" fill="#71838b" text-anchor="middle" font-weight="400">读取全部 8 列</text><path d="M474 172L510 172" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="520" y="140" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="542" y="140" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="564" y="140" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="586" y="140" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="608" y="140" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="630" y="140" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="652" y="140" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="674" y="140" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="520" y="162" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="542" y="162" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="564" y="162" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="586" y="162" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="608" y="162" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="630" y="162" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="652" y="162" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="674" y="162" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="520" y="184" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="542" y="184" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="564" y="184" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="586" y="184" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="608" y="184" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="630" y="184" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="652" y="184" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="674" y="184" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><text x="608" y="226.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">Q [3, 8]</text><path d="M704 152L744 140" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M704 192L744 204" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="752" y="108" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="774" y="108" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="796" y="108" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="818" y="108" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="752" y="130" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="774" y="130" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="796" y="130" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="818" y="130" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="752" y="152" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="774" y="152" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="796" y="152" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><rect x="818" y="152" width="20" height="20" rx="3" fill="#94b79a" stroke="none"/><text x="848" y="130" font-size="14" fill="#3d7058" text-anchor="start" font-weight="650">Q₁</text><rect x="752" y="192" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="774" y="192" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="796" y="192" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="818" y="192" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="752" y="214" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="774" y="214" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="796" y="214" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="818" y="214" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="752" y="236" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="774" y="236" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="796" y="236" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><rect x="818" y="236" width="20" height="20" rx="3" fill="#d8c9a8" stroke="none"/><text x="848" y="236" font-size="14" fill="#8f7857" text-anchor="start" font-weight="650">Q₂</text><rect x="38" y="276" width="884" height="150" rx="10" fill="#f6ebe7" stroke="#c99787"/><text x="56" y="302" font-size="15" fill="#a4604b" text-anchor="start" font-weight="650">并非如此：把输入的列预先分给各个头</text><rect x="60" y="330" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="82" y="330" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="104" y="330" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="126" y="330" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="148" y="330" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="170" y="330" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="192" y="330" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="214" y="330" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="60" y="352" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="82" y="352" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="104" y="352" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="126" y="352" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="148" y="352" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="170" y="352" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="192" y="352" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="214" y="352" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="60" y="374" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="82" y="374" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="104" y="374" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="126" y="374" width="20" height="20" rx="3" fill="#91b1c0" stroke="none"/><rect x="148" y="374" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="170" y="374" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="192" y="374" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><rect x="214" y="374" width="20" height="20" rx="3" fill="#c4d6df" stroke="none"/><text x="148" y="416.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">X [3, 8]</text><rect x="60" y="326" width="88" height="70" rx="4" fill="none" stroke="#a4604b" stroke-dasharray="6 6"/><rect x="148" y="326" width="88" height="70" rx="4" fill="none" stroke="#a4604b" stroke-dasharray="6 6"/><text x="270" y="366" font-size="14" fill="#a4604b" text-anchor="start" font-weight="400">头 1 只能看到前 4 个特征，头 2 只能看到后 4 个特征；</text><text x="270" y="390" font-size="14" fill="#a4604b" text-anchor="start" font-weight="400">不同头之间无法组合输入的全部信息。</text><text x="38" y="454" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">正确做法中，把 H 个 d × dₖ 的矩阵并排拼成一个 d × d 的矩阵，一次乘法即可得到所有头的投影；这与逐头计算完全等价。</text></svg>