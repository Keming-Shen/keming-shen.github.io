" stroke="#c9d0d3"/><rect x="622" y="220" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="656" y="220" width="31" height="27" rx="3" fill="#d8c9a8" stroke="#8f7857"/><rect x="690" y="220" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="724" y="220" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="588" y="250" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="622" y="250" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="656" y="250" width="31" height="27" rx="3" fill="#d8c9a8" stroke="#8f7857"/><rect x="690" y="250" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="724" y="250" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="560" y="180" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="594" y="180" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="628" y="180" width="31" height="27" rx="3" fill="#d8c9a8" stroke="#8f7857"/><rect x="662" y="180" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="696" y="180" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="560" y="210" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="594" y="210" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="628" y="210" width="31" height="27" rx="3" fill="#d8c9a8" stroke="#8f7857"/><rect x="662" y="210" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="696" y="210" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="560" y="240" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="594" y="240" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="628" y="240" width="31" height="27" rx="3" fill="#d8c9a8" stroke="#8f7857"/><rect x="662" y="240" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="696" y="240" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="560" y="270" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="594" y="270" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="628" y="270" width="31" height="27" rx="3" fill="#d8c9a8" stroke="#8f7857"/><rect x="662" y="270" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><rect x="696" y="270" width="31" height="27" rx="3" fill="#f3f4f2" stroke="#c9d0d3"/><text x="645" y="356.2" font-size="12" fill="#9aa7ad" text-anchor="middle" font-weight="400">特征 d →</text><text x="550" y="250" font-size="12" fill="#9aa7ad" text-anchor="end" font-weight="400">位置 L ↓</text><text x="790" y="150" font-size="12" fill="#9aa7ad" text-anchor="start" font-weight="400">样本 B ↗</text><text x="690" y="390.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">同一特征，跨所有样本与位置</text><rect x="38" y="404" width="884" height="52" rx="8" fill="#f6f7f4" stroke="none"/><text x="56" y="428" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">LayerNorm 不依赖批量：批量为 1、序列长度不一或含填充时都能稳定工作；BatchNorm 需要批统计量，推理时改用滑动平均。</text><text x="56" y="448" font-size="13" fill="#71838b" text-anchor="start" font-weight="400">后来的大模型常用 RMSNorm：去掉减均值，只按均方根缩放。</text></svg>