<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" aria-labelledby="title desc"><title id="title">LayerNorm 与 BatchNorm 的统计范围</title><desc id="desc">在形状为 [B,L,d] 的张量中，LayerNorm 对同一样本同一位置的全部特征计算统计量；BatchNorm 对同一特征跨所有样本与位置计算统计量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="476" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">LayerNorm 与 BatchNorm 的统计范围</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">以序列张量 [B, L, d] 为例，高亮的格子共同计算一组均值与方差</text><text x="230" y="114" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="650">LayerNorm</text><rect x="156" y="140" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="190" y="140" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3"/><rect x="224" y="140" width="31" height="27" rx="3" fill="#eef0ef" stroke="#c9d0d3