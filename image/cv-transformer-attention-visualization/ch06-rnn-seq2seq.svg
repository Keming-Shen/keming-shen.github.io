<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="title desc"><title id="title">RNN 编码器—解码器</title><desc id="desc">编码器依次读入 I、like、you，得到 h1 到 h3；最后一个状态 h3 作为上下文向量 c，初始化解码器。解码器以右移的目标 &lt;bos&gt;、我、喜欢、你为输入，依次输出我、喜欢、你、&lt;eos&gt;。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="432" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">RNN 编码器—解码器（固定长度上下文）</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">源句的全部信息只能经由最后一个状态 c 传给解码器</text><rect x="52" y="96" width="318" height="280" rx="12" fill="#e8eff5" stroke="none" opacity=".6"/><text x="211" y="125.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">编码器</text><rect x="512" y="96" width="428" height="280" rx="12" fill="#edf3ed" stroke="none" opacity=".6"/><text x="726" y="125.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">解码器</text><rect x="55" y="325" width="70" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="90" y="345.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">I</text><path d="M90 324L90 262" fill="none" stroke="#9eb4c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><circle cx="90" cy="236" r="24" fill="#fcfcfa" stroke="#9eb4c4" stroke-width="2"/><text x="90" y="241.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₁</text><path d="M116 236L172 236" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="165" y="325" width="70" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="200" y="345.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">like</text><path d="M200 324L200 262" fill="none" stroke="#9eb4c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><circle cx="200" cy="236" r="24" fill="#fcfcfa" stroke="#9eb4c4" stroke-width="2"/><text x="200" y="241.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₂</text><path d="M226 236L282 236" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="275" y="325" width="70" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="310" y="345.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">you</text><path d="M310 324L310 262" fill="none" stroke="#9eb4c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><circle cx="310" cy="236" r="24" fill="#fcfcfa" stroke="#9eb4c4" stroke-width="2"/><text x="310" y="241.6" font-size="16" fill="#4a6a80" text-anchor="middle" font-weight="650">h₃</text><rect x="400" y="208" width="76" height="56" rx="10" fill="#f1f0e9" stroke="#8f7857" stroke-width="2"/><text x="438" y="241.6" font-size="16" fill="#8f7857" text-anchor="middle" font-weight="700">c = h₃</text><path d="M336 236L396 236" fill="none" stroke="#8f7857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><path d="M480 236L530 236" fill="none" stroke="#8f7857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><rect x="524" y="325" width="72" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="560" y="344.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">&lt;bos&gt;</text><path d="M560 324L560 262" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="560" cy="236" r="24" fill="#fcfcfa" stroke="#6d9580" stroke-width="2"/><text x="560" y="241.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">s₁</text><path d="M586 236L642 236" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M560 210L560 172" fill="none" stroke="#6d9580" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="524" y="137" width="72" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="560" y="156.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">我</text><rect x="634" y="325" width="72" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="670" y="344.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">我</text><path d="M670 324L670 262" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="670" cy="236" r="24" fill="#fcfcfa" stroke="#6d9580" stroke-width="2"/><text x="670" y="241.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">s₂</text><path d="M696 236L752 236" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M670 210L670 172" fill="none" stroke="#6d9580" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="634" y="137" width="72" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="670" y="156.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">喜欢</text><rect x="744" y="325" width="72" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="780" y="344.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">喜欢</text><path d="M780 324L780 262" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="780" cy="236" r="24" fill="#fcfcfa" stroke="#6d9580" stroke-width="2"/><text x="780" y="241.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">s₃</text><path d="M806 236L862 236" fill="none" stroke="#708794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M780 210L780 172" fill="none" stroke="#6d9580" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="744" y="137" width="72" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="780" y="156.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">你</text><rect x="854" y="325" width="72" height="30" rx="7" fill="#f3f4f2" stroke="#c9d0d3"/><text x="890" y="344.9" font-size="14" fill="#8a979d" text-anchor="middle" font-weight="500">你</text><path d="M890 324L890 262" fill="none" stroke="#708794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="890" cy="236" r="24" fill="#fcfcfa" stroke="#6d9580" stroke-width="2"/><text x="890" y="241.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">s₄</text><path d="M890 210L890 172" fill="none" stroke="#6d9580" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><rect x="854" y="137" width="72" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="890" y="156.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="500">&lt;eos&gt;</text><text x="38" y="410" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">不论源句长短，c 的维度都相同；Sutskever 等人发现把源句倒序输入能改善效果，因为这缩短了句首信息到解码器的传递距离。</text></svg>