<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">共享注意力分布与多头</title><desc id="desc">左：两个头共用同一个注意力矩阵 A 时，拼接后的结果等于 A 乘以合并后的值投影，多头退化为单头。右：两个头有各自的 A1、A2，无法合并。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="440" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">共享注意力分布时，多头退化为单头</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">区别只在于各头的 A 是否不同</text><rect x="38" y="86" width="430" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="253" y="117.6" font-size="16" fill="#a4604b" text-anchor="middle" font-weight="650">各头共用同一个 A</text><rect x="62" y="150" width="90" height="56" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="107" y="183.9" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="700">A</text><text x="176" y="185.7" font-size="22" fill="#71838b" text-anchor="middle" font-weight="400">·</text><rect x="190" y="160" width="90" height="36" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="235" y="182.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">XW₁ᵛ</text><path d="M284 178L314 226" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="62" y="246" width="90" height="56" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="107" y="279.9" font-size="17" fill="#8f7857" text-anchor="middle" font-weight="700">A</text><text x="176" y="281.7" font-size="22" fill="#71838b" text-anchor="middle" font-weight="400">·</text><rect x="190" y="256" width="90" height="36" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="235" y="278.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">XW₂ᵛ</text><path d="M284 274L314 226" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="320" y="196" width="62" height="60" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="351" y="230.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">拼接</text><path d="M384 226L402 226" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="406" y="202" width="48" height="48" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="430" y="230.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="650">Wᴼ</text><text x="253" y="356.9" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="600">= A · X[W₁ᵛ | W₂ᵛ]Wᴼ：可合并为一个头</text><rect x="492" y="86" width="430" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="707" y="117.6" font-size="16" fill="#3d7058" text-anchor="middle" font-weight="650">各头有各自的 A₁、A₂</text><rect x="516" y="150" width="90" height="56" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="561" y="183.9" font-size="17" fill="#3d7058" text-anchor="middle" font-weight="700">A₁</text><text x="630" y="185.7" font-size="22" fill="#71838b" text-anchor="middle" font-weight="400">·</text><rect x="644" y="160" width="90" height="36" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="689" y="182.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">XW₁ᵛ</text><path d="M738 178L768 226" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="516" y="246" width="90" height="56" rx="8" fill="#e8eff5" stroke="#9eb4c4"/><text x="561" y="279.9" font-size="17" fill="#4a6a80" text-anchor="middle" font-weight="700">A₂</text><text x="630" y="281.7" font-size="22" fill="#71838b" text-anchor="middle" font-weight="400">·</text><rect x="644" y="256" width="90" height="36" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="689" y="278.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">XW₂ᵛ</text><path d="M738 274L768 226" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="774" y="196" width="62" height="60" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="805" y="230.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">拼接</text><path d="M838 226L856 226" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="860" y="202" width="48" height="48" rx="8" fill="#f3f4f2" stroke="#c9d0d3"/><text x="884" y="230.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="650">Wᴼ</text><text x="707" y="356.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">无法提出公共的 A：两种关注方式共同作用</text><text x="38" y="418" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">参数独立只是必要条件：训练后的两个头仍可能学到相近的分布，这也是剪除部分头往往几乎不影响效果的原因。</text></svg>