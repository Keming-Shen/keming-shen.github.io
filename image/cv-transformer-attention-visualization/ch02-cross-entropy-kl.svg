<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" aria-labelledby="title desc"><title id="title">交叉熵、熵与 KL 散度的关系</title><desc id="desc">目标分布 P=[0.5,0.5]，模型分布 Q=[0.9,0.1]。熵 H(P)≈0.6931，KL(P‖Q)≈0.5108，二者相加得到交叉熵 H(P,Q)≈1.2040。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="396" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">交叉熵 = 熵 + KL 散度</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">目标分布 P 固定时，最小化交叉熵就是最小化 KL</text><text x="130" y="118.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">目标分布 P</text><rect x="60" y="225" width="60" height="75" rx="3" fill="#91b1c0" stroke="none"/><text x="90" y="220.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">0.5</text><text x="90" y="327.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">类别 1</text><rect x="150" y="225" width="60" height="75" rx="3" fill="#91b1c0" stroke="none"/><text x="180" y="220.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">0.5</text><text x="180" y="327.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">类别 2</text><path d="M50 300L230 300" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="118.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">模型分布 Q</text><rect x="270" y="165" width="60" height="135" rx="3" fill="#d8c9a8" stroke="none"/><text x="300" y="160.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">0.9</text><text x="300" y="327.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">类别 1</text><rect x="360" y="285" width="60" height="15" rx="3" fill="#d8c9a8" stroke="none"/><text x="390" y="280.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">0.1</text><text x="390" y="327.3" font-size="15" fill="#5c747d" text-anchor="middle" font-weight="400">类别 2</text><path d="M260 300L440 300" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="585" y="118.3" font-size="18" fill="#293e4b" text-anchor="middle" font-weight="650">以 nat 计</text><rect x="540" y="198.7" width="90" height="101.3" rx="3" fill="#91b1c0" stroke="none"/><rect x="540" y="124" width="90" height="74.7" rx="3" fill="#d9a797" stroke="none"/><path d="M530 300L640 300" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M644 198.69387361046952H654V300H644" fill="none" stroke="#4a6a80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="662" y="254.34693680523475" font-size="16" fill="#4a6a80" text-anchor="start" font-weight="600">H(P) = 0.6931</text><path d="M644 124.03474398313244H654V198.69387361046952H644" fill="none" stroke="#a4604b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="662" y="166.36430879680097" font-size="16" fill="#a4604b" text-anchor="start" font-weight="600">KL(P‖Q) = 0.5108</text><path d="M526 124.03474398313244H516V300H526" fill="none" stroke="#293e4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="217.01737199156622" font-size="16" fill="#293e4b" text-anchor="end" font-weight="650">H(P,Q) = 1.2040</text><text x="38" y="370" font-size="16" fill="#71838b" text-anchor="start" font-weight="400">熵只与 P 有关，是模型无法消除的不确定性；KL 衡量 Q 偏离 P 的程度，训练时下降的正是这一部分。</text></svg>