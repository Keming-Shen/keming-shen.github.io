<svg xmlns="http://www.w3.org/2000/svg" width="960" height="378" viewBox="0 0 960 378" role="img" aria-labelledby="title desc"><title id="title">Dropout 的训练与评价模式</title><desc id="desc">八个输入激活在训练模式下随机置零一半，其余乘以 2；在评价模式下全部保留，不做缩放。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="378" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">Dropout 在训练与评价模式下的行为</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">p = 0.5 时的示意：训练时随机置零并放大，评价时原样通过</text><text x="38" y="120" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">输入激活</text><rect x="160" y="98" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="185" y="122.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.8</text><rect x="216" y="98" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="241" y="122.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.3</text><rect x="272" y="98" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="297" y="122.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">1.2</text><rect x="328" y="98" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="353" y="122.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.5</text><rect x="384" y="98" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="409" y="122.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.9</text><rect x="440" y="98" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="465" y="122.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.4</text><rect x="496" y="98" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="521" y="122.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">1.0</text><rect x="552" y="98" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="577" y="122.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.6</text><text x="38" y="196" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">训练模式</text><text x="38" y="216" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">model.train()</text><rect x="160" y="176" width="50" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="185" y="200.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">1.6</text><rect x="216" y="176" width="50" height="40" rx="6" fill="#eceeed" stroke="#c9d0d3" stroke-dasharray="6 6"/><text x="241" y="200.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">0</text><rect x="272" y="176" width="50" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="297" y="200.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">2.4</text><rect x="328" y="176" width="50" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="353" y="200.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">1.0</text><rect x="384" y="176" width="50" height="40" rx="6" fill="#eceeed" stroke="#c9d0d3" stroke-dasharray="6 6"/><text x="409" y="200.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">0</text><rect x="440" y="176" width="50" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="465" y="200.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">0.8</text><rect x="496" y="176" width="50" height="40" rx="6" fill="#eceeed" stroke="#c9d0d3" stroke-dasharray="6 6"/><text x="521" y="200.9" font-size="14" fill="#9aa7ad" text-anchor="middle" font-weight="400">0</text><rect x="552" y="176" width="50" height="40" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="577" y="200.9" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="600">1.2</text><text x="620" y="202" font-size="14" fill="#3d7058" text-anchor="start" font-weight="600">保留项 × 1/(1 − p) = × 2</text><text x="38" y="286" font-size="15" fill="#293e4b" text-anchor="start" font-weight="650">评价模式</text><text x="38" y="306" font-size="13" fill="#9aa7ad" text-anchor="start" font-weight="400">model.eval()</text><rect x="160" y="266" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="185" y="290.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.8</text><rect x="216" y="266" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="241" y="290.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.3</text><rect x="272" y="266" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="297" y="290.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">1.2</text><rect x="328" y="266" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="353" y="290.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.5</text><rect x="384" y="266" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="409" y="290.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.9</text><rect x="440" y="266" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="465" y="290.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.4</text><rect x="496" y="266" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="521" y="290.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">1.0</text><rect x="552" y="266" width="50" height="40" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="577" y="290.9" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="600">0.6</text><text x="620" y="292" font-size="14" fill="#4a6a80" text-anchor="start" font-weight="600">全部保留，不缩放</text><text x="38" y="354" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">放大使期望保持一致：每个分量以 1 − p 的概率保留并乘以 1/(1 − p)，期望仍等于原值。本例一次采样的均值为 0.875，原均值为 0.712。</text></svg>