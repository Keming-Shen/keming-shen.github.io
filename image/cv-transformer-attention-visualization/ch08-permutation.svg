<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-labelledby="title desc"><title id="title">置换等变性的数值验证</title><desc id="desc">用头 1 的参数分别计算“我喜欢你”与“你喜欢我”的注意力输出。交换第一、三个位置后，输出的第一、三行随之交换，每个词得到的向量完全相同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="436" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">自注意力的置换等变性（头 1，无位置编码）</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">输入行交换，输出行以同样方式交换，每个向量本身不变</text><text x="158" y="109.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">“我 喜欢 你” 的输出</text><rect x="43" y="132" width="62" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="74" y="153.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">我</text><rect x="118" y="126" width="150" height="44" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="193" y="152.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">[−0.250, 1.022]</text><rect x="43" y="194" width="62" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="74" y="215.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">喜欢</text><rect x="118" y="188" width="150" height="44" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="193" y="214.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">[−0.334, 0.877]</text><rect x="43" y="256" width="62" height="32" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="74" y="277.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="500">你</text><rect x="118" y="250" width="150" height="44" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="193" y="276.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">[−0.101, 1.324]</text><text x="680" y="109.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">“你 喜欢 我” 的输出</text><rect x="565" y="132" width="62" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="596" y="153.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">你</text><rect x="640" y="126" width="150" height="44" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="715" y="152.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">[−0.101, 1.324]</text><rect x="565" y="194" width="62" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="596" y="215.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">喜欢</text><rect x="640" y="188" width="150" height="44" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="715" y="214.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">[−0.334, 0.877]</text><rect x="565" y="256" width="62" height="32" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="596" y="277.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="500">我</text><rect x="640" y="250" width="150" height="44" rx="6" fill="#f3f4f2" stroke="#c9d0d3"/><text x="715" y="276.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="600">[−0.250, 1.022]</text><path d="M272 148C420 148 420 272 636 272" fill="none" stroke="#b9a98a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><path d="M272 210C420 210 420 210 636 210" fill="none" stroke="#9aa7ad" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M272 272C420 272 420 148 636 148" fill="none" stroke="#b9a98a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><text x="450" y="323.3" font-size="15" fill="#a4604b" text-anchor="middle" font-weight="650">同一个词得到完全相同的输出向量，模型无法区分这两句话</text><rect x="38" y="340" width="884" height="74" rx="8" fill="#f6f7f4" stroke="none"/><text x="56" y="368" font-size="15" fill="#5c747d" text-anchor="start" font-weight="400">形式化地，X′ = PX ⇒ A′ = PAPᵀ，O′ = PO。数值由代码实际计算，逐元素相等。</text><text x="56" y="394" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">逐位置的 FFN、LayerNorm 与残差同样保持这一性质，因此必须显式注入位置信息。</text></svg>