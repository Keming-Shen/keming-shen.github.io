<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">填充需要处理的三个位置</title><desc id="desc">5×5 注意力权重矩阵中，填充位置所在的列被屏蔽为 0；填充位置所在的行仍然有输出，需要在池化时排除；损失函数通过 ignore_index 忽略填充标签。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="430" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">填充需要在三个地方分别处理</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">以长度 5、最后一个位置为 &lt;pad&gt; 的序列为例</text><text x="175" y="120.5" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">&lt;bos&gt;</text><text x="227" y="120.5" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">我</text><text x="279" y="120.5" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">喜欢</text><text x="331" y="120.5" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">&lt;eos&gt;</text><text x="383" y="120.5" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="400">&lt;pad&gt;</text><text x="140" y="155" font-size="13" fill="#5c747d" text-anchor="end" font-weight="400">&lt;bos&gt;</text><text x="140" y="195" font-size="13" fill="#5c747d" text-anchor="end" font-weight="400">我</text><text x="140" y="235" font-size="13" fill="#5c747d" text-anchor="end" font-weight="400">喜欢</text><text x="140" y="275" font-size="13" fill="#5c747d" text-anchor="end" font-weight="400">&lt;eos&gt;</text><text x="140" y="315" font-size="13" fill="#a4604b" text-anchor="end" font-weight="400">&lt;pad&gt;</text><rect x="150" y="130" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="175" y="154.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="202" y="130" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="227" y="154.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="254" y="130" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="279" y="154.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="306" y="130" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="331" y="154.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="358" y="130" width="50" height="38" rx="3" fill="#f3e4df" stroke="none"/><text x="383" y="153.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="400">0</text><rect x="150" y="170" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="175" y="194.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="202" y="170" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="227" y="194.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="254" y="170" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="279" y="194.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="306" y="170" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="331" y="194.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="358" y="170" width="50" height="38" rx="3" fill="#f3e4df" stroke="none"/><text x="383" y="193.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="400">0</text><rect x="150" y="210" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="175" y="234.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="202" y="210" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="227" y="234.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="254" y="210" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="279" y="234.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="306" y="210" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="331" y="234.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="358" y="210" width="50" height="38" rx="3" fill="#f3e4df" stroke="none"/><text x="383" y="233.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="400">0</text><rect x="150" y="250" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="175" y="274.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="202" y="250" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="227" y="274.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="254" y="250" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="279" y="274.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="306" y="250" width="50" height="38" rx="3" fill="#e8eff5" stroke="none"/><text x="331" y="274.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="400">·</text><rect x="358" y="250" width="50" height="38" rx="3" fill="#f3e4df" stroke="none"/><text x="383" y="273.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="400">0</text><rect x="150" y="290" width="50" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="175" y="314.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">·</text><rect x="202" y="290" width="50" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="227" y="314.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">·</text><rect x="254" y="290" width="50" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="279" y="314.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">·</text><rect x="306" y="290" width="50" height="38" rx="3" fill="#eceeed" stroke="none"/><text x="331" y="314.3" font-size="15" fill="#9aa7ad" text-anchor="middle" font-weight="400">·</text><rect x="358" y="290" width="50" height="38" rx="3" fill="#f3e4df" stroke="none"/><text x="383" y="313.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="400">0</text><rect x="355" y="126" width="56" height="206" rx="6" fill="none" stroke="#a4604b" stroke-width="2"/><rect x="146" y="287" width="266" height="44" rx="6" fill="none" stroke="#9aa7ad" stroke-width="2" stroke-dasharray="6 6"/><text x="280" y="360.9" font-size="14" fill="#71838b" text-anchor="middle" font-weight="400">行 = Query，列 = Key</text><circle cx="512" cy="122" r="15" fill="#f6ebe7" stroke="#c99787" stroke-width="2"/><text x="512" y="127.3" font-size="15" fill="#a4604b" text-anchor="middle" font-weight="700">1</text><text x="540" y="118" font-size="17" fill="#293e4b" text-anchor="start" font-weight="650">注意力的 Key</text><text x="540" y="142" font-size="14" fill="#a4604b" text-anchor="start" font-weight="600">key_padding_mask / 加性掩码</text><text x="540" y="164" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">把 &lt;pad&gt; 所在的列屏蔽为 0 权重（红框）</text><circle cx="512" cy="214" r="15" fill="#f3f4f2" stroke="#c9d0d3" stroke-width="2"/><text x="512" y="219.3" font-size="15" fill="#8a979d" text-anchor="middle" font-weight="700">2</text><text x="540" y="210" font-size="17" fill="#293e4b" text-anchor="start" font-weight="650">Query 的输出</text><text x="540" y="234" font-size="14" fill="#8a979d" text-anchor="start" font-weight="600">池化时再按掩码排除</text><text x="540" y="256" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">&lt;pad&gt; 所在的行仍有输出（虚线框），不会自动为零</text><circle cx="512" cy="306" r="15" fill="#edf3ed" stroke="#6d9580" stroke-width="2"/><text x="512" y="311.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="700">3</text><text x="540" y="302" font-size="17" fill="#293e4b" text-anchor="start" font-weight="650">损失函数</text><text x="540" y="326" font-size="14" fill="#3d7058" text-anchor="start" font-weight="600">CrossEntropyLoss(ignore_index=PAD)</text><text x="540" y="348" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">&lt;pad&gt; 位置的标签不参与损失与梯度</text><text x="38" y="408" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">三者互不替代：Embedding 的 padding_idx 只让填充行不接收梯度，并不能完成上述任何一项。</text></svg>