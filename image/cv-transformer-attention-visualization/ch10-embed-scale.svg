<svg xmlns="http://www.w3.org/2000/svg" width="960" height="466" viewBox="0 0 960 466" role="img" aria-labelledby="title desc"><title id="title">嵌入缩放的尺度对比</title><desc id="desc">按 d 的负二分之一次方初始化时，512 维嵌入分量的标准差约 0.044；乘以 √512 后约为 1；正余弦位置编码分量的均方根约 0.71。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="466" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">嵌入乘以 √d 的尺度对比</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">常见初始化下嵌入分量的标准差约为 d^(−1/2)，位置编码分量在 [−1, 1] 之间</text><rect x="110" y="110" width="560" height="250" rx="6" fill="#f6f7f4" stroke="none"/><rect x="153.3" y="350" width="100" height="10" rx="6" fill="#d9a797" stroke="none"/><text x="203.3" y="342.9" font-size="14" fill="#a4604b" text-anchor="middle" font-weight="700">0.044</text><text x="203.3" y="390.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">嵌入（未缩放）</text><rect x="340" y="132.7" width="100" height="227.3" rx="6" fill="#94b79a" stroke="none"/><text x="390" y="125.6" font-size="14" fill="#3d7058" text-anchor="middle" font-weight="700">1.000</text><text x="390" y="390.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">嵌入 × √d</text><rect x="526.7" y="199.3" width="100" height="160.7" rx="6" fill="#91b1c0" stroke="none"/><text x="576.7" y="192.2" font-size="14" fill="#4a6a80" text-anchor="middle" font-weight="700">0.707</text><text x="576.7" y="390.6" font-size="13" fill="#5c747d" text-anchor="middle" font-weight="400">位置编码（RMS）</text><text x="390" y="416.6" font-size="13" fill="#9aa7ad" text-anchor="middle" font-weight="400">分量的典型幅度（标准差 / 均方根）</text><rect x="700" y="110" width="222" height="250" rx="10" fill="#f1f0e9" stroke="#b9a98a"/><text x="716" y="140" font-size="14" fill="#8f7857" text-anchor="start" font-weight="400">未缩放时，嵌入约为</text><text x="716" y="164" font-size="14" fill="#8f7857" text-anchor="start" font-weight="400">位置编码的 1/32，</text><text x="716" y="188" font-size="14" fill="#8f7857" text-anchor="start" font-weight="400">相加后内容信号几乎</text><text x="716" y="212" font-size="14" fill="#8f7857" text-anchor="start" font-weight="400">被位置信号淹没。</text><text x="716" y="236" font-size="14" fill="#3d7058" text-anchor="start" font-weight="400"></text><text x="716" y="260" font-size="14" fill="#3d7058" text-anchor="start" font-weight="400">乘以 √512 ≈ 22.6 后，</text><text x="716" y="284" font-size="14" fill="#3d7058" text-anchor="start" font-weight="400">二者处于同一数量级。</text><text x="38" y="444" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">原论文并未解释这一设计；以上是常见的一种解释，结论依赖于初始化方式（这里假设嵌入权重与输出层共享，按 d^(−1/2) 初始化）。</text></svg>