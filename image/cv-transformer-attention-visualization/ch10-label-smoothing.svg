<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="title desc"><title id="title">标签平滑的目标分布</title><desc id="desc">8 个类别、ε=0.1 时，one-hot 目标的正确类别为 1，其余为 0；平滑后正确类别为 0.9125，其余每类为 0.0125。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="464" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">标签平滑：把 one-hot 目标换成略微分散的分布</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">ε = 0.1，以 8 个类别为例：q = (1 − ε)·one-hot + ε·均匀分布</text><rect x="38" y="92" width="420" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="248" y="119.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">one-hot 目标</text><path d="M58 330L438 330" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="66" y="330" width="30" height="1" rx="3" fill="#c4d6df" stroke="none"/><text x="81" y="325.5" font-size="10" fill="#4a6a80" text-anchor="middle" font-weight="650">0</text><text x="81" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c0</text><rect x="113.5" y="330" width="30" height="1" rx="3" fill="#c4d6df" stroke="none"/><text x="128.5" y="325.5" font-size="10" fill="#4a6a80" text-anchor="middle" font-weight="650">0</text><text x="128.5" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c1</text><rect x="161" y="154.8" width="30" height="175.2" rx="3" fill="#91b1c0" stroke="none"/><text x="176" y="150.3" font-size="10" fill="#4a6a80" text-anchor="middle" font-weight="650">1.0000</text><text x="176" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c2</text><rect x="208.5" y="330" width="30" height="1" rx="3" fill="#c4d6df" stroke="none"/><text x="223.5" y="325.5" font-size="10" fill="#4a6a80" text-anchor="middle" font-weight="650">0</text><text x="223.5" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c3</text><rect x="256" y="330" width="30" height="1" rx="3" fill="#c4d6df" stroke="none"/><text x="271" y="325.5" font-size="10" fill="#4a6a80" text-anchor="middle" font-weight="650">0</text><text x="271" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c4</text><rect x="303.5" y="330" width="30" height="1" rx="3" fill="#c4d6df" stroke="none"/><text x="318.5" y="325.5" font-size="10" fill="#4a6a80" text-anchor="middle" font-weight="650">0</text><text x="318.5" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c5</text><rect x="351" y="330" width="30" height="1" rx="3" fill="#c4d6df" stroke="none"/><text x="366" y="325.5" font-size="10" fill="#4a6a80" text-anchor="middle" font-weight="650">0</text><text x="366" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c6</text><rect x="398.5" y="330" width="30" height="1" rx="3" fill="#c4d6df" stroke="none"/><text x="413.5" y="325.5" font-size="10" fill="#4a6a80" text-anchor="middle" font-weight="650">0</text><text x="413.5" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c7</text><rect x="502" y="92" width="420" height="300" rx="10" fill="#f6f7f4" stroke="none"/><text x="712" y="119.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">平滑后的目标 q</text><path d="M522 330L902 330" fill="none" stroke="#c9d0d3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="530" y="327.8" width="30" height="2.2" rx="3" fill="#c9dcc9" stroke="none"/><text x="545" y="323.3" font-size="10" fill="#3d7058" text-anchor="middle" font-weight="650">0.0125</text><text x="545" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c0</text><rect x="577.5" y="327.8" width="30" height="2.2" rx="3" fill="#c9dcc9" stroke="none"/><text x="592.5" y="323.3" font-size="10" fill="#3d7058" text-anchor="middle" font-weight="650">0.0125</text><text x="592.5" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c1</text><rect x="625" y="170.1" width="30" height="159.9" rx="3" fill="#94b79a" stroke="none"/><text x="640" y="165.6" font-size="10" fill="#3d7058" text-anchor="middle" font-weight="650">0.9125</text><text x="640" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c2</text><rect x="672.5" y="327.8" width="30" height="2.2" rx="3" fill="#c9dcc9" stroke="none"/><text x="687.5" y="323.3" font-size="10" fill="#3d7058" text-anchor="middle" font-weight="650">0.0125</text><text x="687.5" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c3</text><rect x="720" y="327.8" width="30" height="2.2" rx="3" fill="#c9dcc9" stroke="none"/><text x="735" y="323.3" font-size="10" fill="#3d7058" text-anchor="middle" font-weight="650">0.0125</text><text x="735" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c4</text><rect x="767.5" y="327.8" width="30" height="2.2" rx="3" fill="#c9dcc9" stroke="none"/><text x="782.5" y="323.3" font-size="10" fill="#3d7058" text-anchor="middle" font-weight="650">0.0125</text><text x="782.5" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c5</text><rect x="815" y="327.8" width="30" height="2.2" rx="3" fill="#c9dcc9" stroke="none"/><text x="830" y="323.3" font-size="10" fill="#3d7058" text-anchor="middle" font-weight="650">0.0125</text><text x="830" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c6</text><rect x="862.5" y="327.8" width="30" height="2.2" rx="3" fill="#c9dcc9" stroke="none"/><text x="877.5" y="323.3" font-size="10" fill="#3d7058" text-anchor="middle" font-weight="650">0.0125</text><text x="877.5" y="353.9" font-size="11" fill="#9aa7ad" text-anchor="middle" font-weight="400">c7</text><text x="38" y="420" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">正确类别的目标概率从 1 降为 0.9125，其余每类为 0.0125。最小化交叉熵不再把正确类别的 logit 推向无穷大，从而抑制过度自信。</text><text x="38" y="442" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">原论文报告：标签平滑使困惑度变差，但提高了准确率与 BLEU。实际词表约 37000 类，每个错误类别分到的概率极小。</text></svg>