<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" role="img" aria-labelledby="title desc"><title id="title">自注意力与交叉注意力的数据流</title><desc id="desc">自注意力中 Q、K、V 都来自同一序列 X，权重矩阵为 L×L。交叉注意力中 Q 来自目标表示 Z，K 与 V 来自编码器输出 H，权重矩阵为 T×S。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="454" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">自注意力与交叉注意力</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">区别只在于 Q 与 K、V 的来源</text><rect x="38" y="86" width="430" height="320" rx="10" fill="#f6f7f4" stroke="none"/><text x="253" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">自注意力（编码器、解码器第一子层）</text><rect x="68" y="330" width="370" height="48" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="253" y="359.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">同一序列 X</text><rect x="100" y="255" width="96" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="148" y="274.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">Q = ·W^Q</text><rect x="205" y="255" width="96" height="30" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="253" y="274.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="500">K = ·W^K</text><rect x="310" y="255" width="96" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="358" y="274.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="500">V = ·W^V</text><path d="M253 326C253 305 148 305 148 288" fill="none" stroke="#6d9580" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M253 326C253 305 253 305 253 288" fill="none" stroke="#b9a98a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><path d="M253 326C253 305 358 305 358 288" fill="none" stroke="#9eb4c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><rect x="188" y="150" width="130" height="72" rx="8" fill="#f1f0e9" stroke="#b9a98a"/><text x="253" y="181.3" font-size="15" fill="#8f7857" text-anchor="middle" font-weight="650">权重 A</text><text x="253" y="204.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">[L, L]</text><path d="M148 254L208 226" fill="none" stroke="#708794" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M253 254L253 226" fill="none" stroke="#708794" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M358 254C358 190 338 186 322 186" fill="none" stroke="#708794" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="253" y="146.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">输出 [L, d_v]：行数由查询决定</text><text x="253" y="400.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">每个位置既发出查询，也提供键和值</text><rect x="492" y="86" width="430" height="320" rx="10" fill="#f6f7f4" stroke="none"/><text x="707" y="117.6" font-size="16" fill="#293e4b" text-anchor="middle" font-weight="650">交叉注意力（解码器第二子层）</text><rect x="522" y="330" width="160" height="48" rx="10" fill="#edf3ed" stroke="#6d9580"/><text x="602" y="359.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">目标表示 Z</text><rect x="732" y="330" width="160" height="48" rx="10" fill="#e8eff5" stroke="#9eb4c4"/><text x="812" y="359.3" font-size="15" fill="#4a6a80" text-anchor="middle" font-weight="650">编码器输出 H</text><rect x="554" y="255" width="96" height="30" rx="7" fill="#edf3ed" stroke="#6d9580"/><text x="602" y="274.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="500">Q = ·W^Q</text><rect x="659" y="255" width="96" height="30" rx="7" fill="#f1f0e9" stroke="#b9a98a"/><text x="707" y="274.6" font-size="13" fill="#8f7857" text-anchor="middle" font-weight="500">K = ·W^K</text><rect x="764" y="255" width="96" height="30" rx="7" fill="#e8eff5" stroke="#9eb4c4"/><text x="812" y="274.6" font-size="13" fill="#4a6a80" text-anchor="middle" font-weight="500">V = ·W^V</text><path d="M602 326C602 305 602 305 602 288" fill="none" stroke="#6d9580" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowG)"/><path d="M812 326C812 305 707 305 707 288" fill="none" stroke="#b9a98a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowW)"/><path d="M812 326C812 305 812 305 812 288" fill="none" stroke="#9eb4c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/><rect x="642" y="150" width="130" height="72" rx="8" fill="#edf3ed" stroke="#6d9580"/><text x="707" y="181.3" font-size="15" fill="#3d7058" text-anchor="middle" font-weight="650">权重 A</text><text x="707" y="204.9" font-size="14" fill="#5c747d" text-anchor="middle" font-weight="400">[T, S]</text><path d="M602 254L662 226" fill="none" stroke="#708794" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M707 254L707 226" fill="none" stroke="#708794" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M812 254C812 190 792 186 776 186" fill="none" stroke="#708794" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="707" y="146.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">输出 [T, d_v]：行数由查询决定</text><text x="707" y="400.6" font-size="13" fill="#71838b" text-anchor="middle" font-weight="400">T 与 S 可以不同，不要求逐词配对</text><text x="38" y="432" font-size="15" fill="#71838b" text-anchor="start" font-weight="400">K 与 V 必须来自同一组位置（数量相同）；Q 与 K 的特征维度必须相同。</text></svg>