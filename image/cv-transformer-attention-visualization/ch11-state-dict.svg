<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">保存最优参数的陷阱</title><desc id="desc">直接把 model.state_dict() 赋给变量只保存了参数张量的引用，之后的训练会继续修改它，最终得到的是最新参数；用 copy.deepcopy 才能保存第 20 轮的最优参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#708794" stroke-width="1.6"/></marker><marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#a88f63" stroke-width="1.6"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#5f8a6f" stroke-width="1.6"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b0735e" stroke-width="1.6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6f8ea3" stroke-width="1.6"/></marker><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}</style></defs><rect x="0" y="0" width="960" height="400" rx="14" fill="#fcfcfa" stroke="none"/><text x="38" y="44" font-size="24" fill="#293e4b" text-anchor="start" font-weight="650">保存“最优参数”的陷阱</text><text x="38" y="74" font-size="17" fill="#71838b" text-anchor="start" font-weight="400">state_dict() 返回的是参数张量的引用，而不是副本</text><text x="38" y="120" font-size="15" fill="#a4604b" text-anchor="start" font-weight="650">错误</text><text x="38" y="144" font-size="12" fill="#a4604b" text-anchor="start" font-weight="400">best = model.state_dict()</text><rect x="340" y="102" width="130" height="48" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="405" y="122.2" font-size="12" fill="#4a6a80" text-anchor="middle" font-weight="600">第 20 轮（最优）</text><text x="405" y="140.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">参数 = θ₂₀</text><path d="M472 126L488 126" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="490" y="102" width="130" height="48" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="555" y="122.2" font-size="12" fill="#4a6a80" text-anchor="middle" font-weight="600">第 21 轮</text><text x="555" y="140.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">参数 = θ₂₁</text><path d="M622 126L638 126" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="640" y="102" width="130" height="48" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="705" y="122.2" font-size="12" fill="#4a6a80" text-anchor="middle" font-weight="600">第 22 轮</text><text x="705" y="140.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">参数 = θ₂₂</text><rect x="800" y="102" width="122" height="48" rx="6" fill="#f6ebe7" stroke="#c99787"/><text x="861" y="122.2" font-size="12" fill="#a4604b" text-anchor="middle" font-weight="600">best 中保存的</text><text x="861" y="140.6" font-size="13" fill="#a4604b" text-anchor="middle" font-weight="700">θ₂₂（最新）</text><text x="38" y="220" font-size="15" fill="#3d7058" text-anchor="start" font-weight="650">正确</text><text x="38" y="244" font-size="12" fill="#3d7058" text-anchor="start" font-weight="400">best = copy.deepcopy(model.state_dict())</text><rect x="340" y="202" width="130" height="48" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="405" y="222.2" font-size="12" fill="#4a6a80" text-anchor="middle" font-weight="600">第 20 轮（最优）</text><text x="405" y="240.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">参数 = θ₂₀</text><path d="M472 226L488 226" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="490" y="202" width="130" height="48" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="555" y="222.2" font-size="12" fill="#4a6a80" text-anchor="middle" font-weight="600">第 21 轮</text><text x="555" y="240.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">参数 = θ₂₁</text><path d="M622 226L638 226" fill="none" stroke="#708794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="640" y="202" width="130" height="48" rx="6" fill="#e8eff5" stroke="#9eb4c4"/><text x="705" y="222.2" font-size="12" fill="#4a6a80" text-anchor="middle" font-weight="600">第 22 轮</text><text x="705" y="240.2" font-size="12" fill="#5c747d" text-anchor="middle" font-weight="400">参数 = θ₂₂</text><rect x="800" y="202" width="122" height="48" rx="6" fill="#edf3ed" stroke="#6d9580"/><text x="861" y="222.2" font-size="12" fill="#3d7058" text-anchor="middle" font-weight="600">best 中保存的</text><text x="861" y="240.6" font-size="13" fill="#3d7058" text-anchor="middle" font-weight="700">θ₂₀（最优）</text><path d="M405 150C405 190 860 160 861 146" fill="none" stroke="#c99787" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowR)" stroke-dasharray="6 6"/><rect x="38" y="290" width="884" height="90" rx="8" fill="#f6f7f4" stroke="none"/><text x="56" y="318" font-size="14" fill="#5c747d" text-anchor="start" font-weight="400">或者在验证损失创新低时立即 torch.save 到文件。</text><text x="56" y="344" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">另外，当前检查点只用于恢复推理；精确续训还需保存优化器、学习率调度器与随机数状态，</text><text x="56" y="366" font-size="14" fill="#71838b" text-anchor="start" font-weight="400">并恢复数据遍历的位置。</text></svg>